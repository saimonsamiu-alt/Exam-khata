// ================= SOUND SYNTHESIZER (Web Audio API) =================
let audioCtx = null;
let soundEnabled = true;
function getAudioCtx(){
  if(!audioCtx){
    const AudioC = window.AudioContext || window.webkitAudioContext;
    if(AudioC) audioCtx = new AudioC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
window.toggleSound = function(){
  soundEnabled = !soundEnabled;
  toast(soundEnabled ? '🔊 সাউন্ড চালু' : '🔇 সাউন্ড বন্ধ');
  const btn = document.getElementById('soundToggleBtn');
  if(btn) btn.innerHTML = soundEnabled ? '🔊 সাউন্ড চালু' : '🔇 সাউন্ড বন্ধ';
};
function playSfx(type){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    if(!ctx) return;
    const now = ctx.currentTime;
    if(type === 'slash'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(850, now);
      osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.12);
    } else if(type === 'hit'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.2);
    } else if(type === 'combo'){
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + i * 0.05);
        gain.gain.setValueAtTime(0.2, now + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.05 + 0.14);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i * 0.05); osc.stop(now + i * 0.05 + 0.14);
      });
    } else if(type === 'victory'){
      [440, 554.37, 659.25, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.25, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.25);
      });
    } else if(type === 'wrong'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(130, now);
      osc.frequency.setValueAtTime(95, now + 0.12);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.28);
    }
  }catch(e){}
}

window.__hwAll = null;
function hwFriendlyError(res){
  const m = res && res.message;
  if(m === 'network') return 'ইন্টারনেট সমস্যা — আবার চেষ্টা করো';
  if(m && /[\u0980-\u09FF]/.test(m)) return m; // সার্ভারের বাংলা বার্তা
  return 'জমা দেওয়া যায়নি, আবার চেষ্টা করো';
}
function findHwRec(id){
  return ((window.__hwAll||[]).concat(window.__hwTeacherAll||[])).find(x=> x.id === id);
}
// এক টপিকের/এক দিনের একটা entry-র ভেতরের HTML: প্রশ্ন ও সমাধান দুটো ছবিই লেবেলসহ দেখায়
function hwEntryInner(rec, opts){
  opts = opts || {};
  const imgBlock = (label, url)=> !url ? '' : `
    <div style="margin-top:10px;">
      <div class="field-label" style="margin-bottom:4px;">${label}</div>
      <a href="${escapeHtml(url)}" target="_blank" rel="noopener">
        <img src="${driveImg(url)}" alt="${label}" style="max-width:100%; border-radius:8px; border:1px solid var(--paper-edge); display:block;"
             onerror="this.style.display='none'; this.parentNode.insertAdjacentHTML('beforeend','<span class=&quot;meta&quot;>🖼️ ছবিটা খুলতে চাপো</span>')">
      </a>
    </div>`;
  const boxStyle = 'margin-top:12px; background:#F5F9FE; border-radius:8px; padding:10px 12px; font-size:13.5px; line-height:1.6;';
  const fb = rec.aiFeedback
    ? `<div style="${boxStyle}">🤖 <b>ফিডব্যাক:</b> ${escapeHtml(rec.aiFeedback)}</div>`
    : `<div style="${boxStyle} background:#FEF8EC;">⏳ এই মুহূর্তে ফিডব্যাক দেখা যাচ্ছে না — শিক্ষক তোমার HW দেখবেন।
         <div><button class="btn btn-outline" style="margin-top:8px; padding:7px 12px; font-size:12.5px;" onclick="recheckHw('${rec.id}')">🔁 আবার ফিডব্যাক চাও</button></div></div>`;
  return `
    <div class="row-top">
      <div>
        <span class="q-tag">📚 ${escapeHtml(rec.topic||'সাধারণ')}</span>
        <div class="meta" style="margin-top:6px;">${escapeHtml(fmtBnDate(new Date(rec.date).getTime()))}${opts.teacher ? ' · স্টুডেন্ট: ' + escapeHtml(rec.slug) : ''}</div>
      </div>
      ${opts.student ? `<a class="link-back" onclick="deleteHw('${rec.id}')">🗑️ মুছো</a>` : ''}
    </div>
    ${imgBlock('📄 প্রশ্ন', rec.questionImageUrl)}
    ${imgBlock('✍️ আমার খাতা (সমাধান)', rec.answerImageUrl)}
    ${fb}`;
}
function hwEntryCard(rec, opts){
  return `<div class="exam-item" id="hwEntry_${rec.id}">${hwEntryInner(rec, opts)}</div>`;
}
window.recheckHw = async function(id){
  const rec = findHwRec(id); if(!rec) return;
  const box = document.getElementById('hwEntry_'+id);
  toast('আবার চেক করা হচ্ছে...');
  const res = await recheckDailyHomeworkRemote(id, rec.slug || (getLoggedStudent()||{}).slug);
  if(res && res.status === 'success'){
    rec.aiFeedback = res.aiFeedback; rec.aiPending = false;
    if(box) box.innerHTML = hwEntryInner(rec, { student: !!getLoggedStudent() && !window.__hwTeacherView, teacher: !!window.__hwTeacherView });
    toast('✅ ফিডব্যাক এসেছে');
  } else {
    toast('এখনো ফিডব্যাক দেখা যাচ্ছে না, একটু পরে আবার চেষ্টা করো');
  }
};
window.deleteHw = async function(id){
  const stud = getLoggedStudent(); if(!stud) return;
  if(!confirm('এই HW-টা মুছে ফেলতে চাও?')) return;
  const res = await deleteDailyHomeworkRemote(id, stud.slug);
  if(res && res.status === 'success'){
    window.__hwAll = (window.__hwAll||[]).filter(x=> x.id !== id);
    const box = document.getElementById('hwEntry_'+id); if(box) box.remove();
    toast('মুছে ফেলা হয়েছে');
  } else { toast('মুছতে পারলাম না, আবার চেষ্টা করো'); }
};

window.hwPickTopic = function(i){
  const inp = document.getElementById('hwTopic');
  if(inp && window.__hwTopicList) inp.value = window.__hwTopicList[i];
};
window.hwPreview = function(inputEl, targetId){
  const el = document.getElementById(targetId); if(!el) return;
  const f = inputEl.files && inputEl.files[0];
  if(!f){ el.innerHTML = ''; return; }
  el.innerHTML = `<img src="${URL.createObjectURL(f)}" alt="প্রিভিউ" style="max-width:100%; border-radius:8px; border:1px solid var(--paper-edge); margin-bottom:10px; display:block;">`;
};
window.submitDailyHw = async function(){
  const stud = getLoggedStudent();
  if(!stud) return;
  const topic = ((document.getElementById('hwTopic')||{}).value||'').trim();
  const qFile = (document.getElementById('hwQFile')||{}).files[0];
  const aFile = (document.getElementById('hwAFile')||{}).files[0];
  if(!topic){ toast('আগে টপিকের নাম লেখো (যেমন: Kp Kc)'); return; }
  if(!qFile || !aFile){ toast('প্রশ্ন ও খাতা — দুটো ছবিই দাও'); return; }
  const statusEl = document.getElementById('hwSubmitStatus');
  const btn = document.getElementById('hwSubmitBtn'); if(btn) btn.disabled = true;
  statusEl.innerHTML = `<p class="hint">ছবি প্রস্তুত করা হচ্ছে...</p>`;
  let qC, aC;
  try{ qC = await compressImageFile(qFile, 1200, 0.75); aC = await compressImageFile(aFile, 1200, 0.75); }
  catch(e){ statusEl.innerHTML = `<p class="hint">ছবি পড়া যায়নি, অন্য ছবি দিয়ে চেষ্টা করো।</p>`; if(btn) btn.disabled = false; return; }
  statusEl.innerHTML = `<p class="hint">জমা হচ্ছে ও চেক করা হচ্ছে, একটু অপেক্ষা করো...</p>`;
  const res = await submitDailyHomeworkRemote(stud.slug, todayStr(), topic, qC.base64, qC.mimeType, aC.base64, aC.mimeType);
  if(btn) btn.disabled = false;
  if(res && res.status === 'success'){
    const rec = { id: res.id, slug: stud.slug, topic: res.topic, date: res.date, questionImageUrl: res.questionImageUrl,
                  answerImageUrl: res.answerImageUrl, aiFeedback: res.aiFeedback || '', submittedAt: Date.now() };
    window.__hwAll = [rec].concat(window.__hwAll || []);
    window.__hwTeacherView = false;
    window.__hwTopicList = null;
    statusEl.innerHTML = `
      <div style="color:var(--green); font-weight:700; margin-bottom:8px;">✅ "${escapeHtml(rec.topic)}" টপিকে HW জমা হয়েছে</div>

        <button class="btn btn-gold btn-block" onclick="go('dailyHwSubmit')">➕ আরেকটা যোগ করো</button>
        <button class="btn btn-outline btn-block" onclick="go('dailyHwTopics')">📚 আমার সব HW</button>
      </div>`;
  } else {
    statusEl.innerHTML = `<p class="hint" style="color:var(--red);">❌ ${escapeHtml(hwFriendlyError(res))}</p>`;
  }
};

// ---------- ক্যালেন্ডার (তারিখ অনুযায়ী) ----------
function buildHwCalendar(year, month, records){
  const countByDate = {};
  records.forEach(r=>{ countByDate[r.date] = (countByDate[r.date]||0) + 1; });
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayS = todayStr();
  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const n = countByDate[dateStr] || 0;
    const bg = n ? 'var(--green)' : '#F5F9FE';
    const color = n ? '#fff' : 'var(--ink)';
    const border = n ? 'none' : '1px solid var(--rule)';
    const isToday = dateStr === todayS;
    const clickAttr = n ? `onclick="viewHwDay('${dateStr}')" style="cursor:pointer;` : `style="cursor:default;`;
    cells += `<div ${clickAttr} background:${bg}; color:${color}; border:${border}; ${isToday?'outline:2px solid var(--margin-red);':''} border-radius:7px; display:flex; align-items:center; justify-content:center; height:34px; font-size:13px; font-family:var(--font-mono);">${d}${n>1?`<sup style="font-size:9px;">${n}</sup>`:''}</div>`;
  }
  const prevM = month===0 ? 11 : month-1, prevY = month===0 ? year-1 : year;
  const nextM = month===11 ? 0 : month+1, nextY = month===11 ? year+1 : year;
  return `
    <div class="card" style="padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <a class="link-back" onclick="goHwCalNav(${prevY},${prevM})">‹</a>
        <b style="font-family:var(--font-display); font-size:16px;">${BN_MONTHS[month]} ${year}</b>
        <a class="link-back" onclick="goHwCalNav(${nextY},${nextM})">›</a>
      </div>
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;">
        ${BN_WEEKDAYS.map(w=>`<div style="text-align:center; font-size:11px; color:var(--pencil); font-weight:600;">${w}</div>`).join('')}
      </div>
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">${cells}</div>
      <div style="margin-top:12px; font-size:12px; color:var(--pencil);">🟩 এই দিনে HW জমা দেওয়া হয়েছে (ছোট সংখ্যা = ওই দিনে কতটা) — চাপলে দেখা যাবে</div>
    </div>
  `;
}

window.dashStartExamByCode = async function(){

  toast('পরীক্ষা খোঁজা হচ্ছে...');
  const examRaw = await sget('exam:'+code);
  if(!examRaw){ alert('পরীক্ষা পাওয়া যায়নি! কোডটি সঠিক কিনা যাচাই করুন।'); return; }
  const exam = JSON.parse(examRaw.value);
  const slug = stud.slug;

  // 🎁 Treat exams carry real money: still need the teacher's per-exam password
  if(exam.isTreat){
    const pass = (prompt('এটা একটা 🎁 Treat পরীক্ষা। শিক্ষকের দেওয়া পাসওয়ার্ড লিখুন:') || '').trim();
    if(!pass){ return; }
    if(pass !== String(exam.treatPassword)){ toast('পাসওয়ার্ড ভুল হয়েছে'); return; }
  }

  // same attempt rules as the normal entry flow
  const existingResults = await getRemoteResults(code);
  const allAttempts = existingResults.filter(r => (r.slug ? r.slug === slug : slugify(r.studentName||'') === slug));
  const myAttempts = allAttempts.filter(r => r.viaCode !== false);   // [FIX] আগের শুধু-practice attempt কোড-exam আটকাবে না
  if(myAttempts.length > 0){
    myAttempts.sort((a,b)=> b.submittedAt - a.submittedAt);
    if(exam.isTreat){ go('treatBlocked', { exam, attempt: myAttempts[0] }); return; }
    go('studentChoice', { exam, slug, name: stud.name, attempts: allAttempts.sort((a,b)=> b.submittedAt - a.submittedAt) });
    return;
  }
  runCheckingSequence(exam, slug, stud.name, 1);
};

async function renderBattleWorldMap(){

      <p class="hint">তোমার প্রতিটা চ্যাপ্টারের অগ্রগতি হিসাব করা হচ্ছে</p>
    </div>
    ${creditFooter()}
  `;

  const res = await postToScript('getBattleWorldMap', { slug });
  const worlds = (res && res.status === 'success') ? res.worlds : [];
  battleWorldDataCache = worlds;

  const subjectIcons = {
    physics: '⚡',
    chemistry: '🧪',
    mathematics: '📐',
    math: '📐',
    biology: '🌿',
    ict: '💻'
  };

  const worldsHtml = worlds.map(w => {
    const sKey = (w.subject || '').toLowerCase();
    const icon = subjectIcons[sKey] || '🪐';
    const total = w.totalChapters || 0;
    const cleared = w.clearedChapters || 0;
    const pct = total > 0 ? Math.round((cleared / total) * 100) : 0;
    const totalQ = w.totalQuestions || 0;
    const solvedQ = w.solvedQuestions || 0;
    const qPct = totalQ > 0 ? Math.round((solvedQ / totalQ) * 100) : 0;
    const isComplete = qPct === 100;

    return `
      <div class="world-card ${isComplete?'boss-unlocked-glow':''}" onclick="go('battleChapterSelect', { courseId:'${w.id}', subject:'${escapeHtml(w.subject)}', title:'${escapeHtml(w.title)}' })">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <div style="display:flex; align-items:center; gap:10px;">
            <div style="font-size:32px;">${icon}</div>
            <div>
              <h3 style="margin:0; font-size:17px; color:var(--ink);">${escapeHtml(w.title || w.subject)}</h3>
              <div style="font-size:12.5px; color:var(--pencil);">${total}টি চ্যাপ্টার · ${cleared}টি সম্পূর্ণ</div>
              <div style="font-size:12.5px; color:var(--pencil);">মোট প্রশ্ন ${totalQ}টা · সমাধান ${solvedQ}টা</div>
            </div>
          </div>
          <div style="text-align:right;">
            <span class="widget-tag ${qPct===100?'tag-gold':(qPct>0?'tag-blue':'tag-red')}">${qPct}%</span>
          </div>
        </div>
        
        <div class="hp-bar-wrap" style="max-width:100%; height:8px; margin-top:8px;">
          <div class="hp-bar-fill" style="width:${qPct}%; background:linear-gradient(90deg, #2ecc71, #27ae60);"></div>
        </div>

        <div style="display:flex; justify-content:flex-end; align-items:center; margin-top:10px; font-size:12px;">
          <span style="color:var(--ink); font-weight:700;">প্র্যাকটিস করো →</span>
        </div>
      </div>
    `;
  }).join('');

  // Group worlds by subject (e.g. "chemistry — paper1" + "chemistry — paper2" both
  // have subject "chemistry") to get one subject-level percentage, then sum everything
  // for a single overall (e.g. HSC-wide) percentage. Normalize case/whitespace so
  // "Chemistry" and "chemistry" (however a teacher happened to type it) merge into
  // one row instead of showing up as two separate subjects.
  const bySubject = {};
  worlds.forEach(w=>{
    const raw = (w.subject || 'অন্যান্য').trim();
    const key = raw.toLowerCase();
    if(!bySubject[key]) bySubject[key] = { label: raw.charAt(0).toUpperCase() + raw.slice(1), totalQ:0, solvedQ:0 };
    bySubject[key].totalQ += (w.totalQuestions || 0);
    bySubject[key].solvedQ += (w.solvedQuestions || 0);
  });
  const subjectRows = Object.keys(bySubject).map(key=>{
    const s = bySubject[key];
    const pct = s.totalQ > 0 ? Math.round((s.solvedQ / s.totalQ) * 100) : 0;
    return `<div class="meta" style="display:flex; justify-content:space-between; padding:4px 0;">
      <span>${escapeHtml(s.label)}</span><span><b>${s.solvedQ}/${s.totalQ}</b> (${pct}%)</span>
    </div>`;
  }).join('');
  const overallTotalQ = worlds.reduce((a,w)=> a + (w.totalQuestions||0), 0);
  const overallSolvedQ = worlds.reduce((a,w)=> a + (w.solvedQuestions||0), 0);
  const overallPct = overallTotalQ > 0 ? Math.round((overallSolvedQ / overallTotalQ) * 100) : 0;

  app.innerHTML = `
    ${header('বিষয়ভিত্তিক প্র্যাকটিস')}
    <div class="hero-card" style="margin-bottom:16px;">
      <div style="display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:12.5px; color:rgba(255,255,255,0.75);">মো: সায়মন সামিউ প্রণীত</div>
          <h2 style="color:#fff; margin:2px 0 4px 0; font-size:22px;">📚 মাস্টারি প্র্যাকটিস</h2>
          <div style="font-size:12.5px; color:rgba(255,255,255,0.85);">যেকোনো বিষয়ের যেকোনো চ্যাপ্টার স্বাধীনভাবে প্র্যাকটিস করো</div>
          <div style="font-size:11.5px; color:rgba(255,255,255,0.55); margin-top:8px; border-top:1px dashed rgba(255,255,255,0.2); padding-top:6px;">🕹️ শীঘ্রই আসছে — তোমাদের জন্য বানানো একটা এক্সক্লুসিভ 3D গেম (PUBG/Free Fire লেভেলের)</div>
        </div>
        <div style="font-size:40px;">📖</div>
      </div>
    </div>

    <div class="card">
      <h2>📊 সার্বিক অগ্রগতি</h2>
      <div class="score-big score-pass" style="font-size:26px;">${overallPct}%</div>
      <div class="meta" style="text-align:center; margin-bottom:8px;">মোট ${overallSolvedQ}/${overallTotalQ} প্রশ্ন সমাধান হয়েছে (সব বিষয় মিলিয়ে)</div>
      ${subjectRows}
    </div>

    <div class="card">
      <h2>বিষয় ও পেপার নির্বাচন করো</h2>
      <p class="hint">যে বিষয়ে প্র্যাকটিস করতে চাও তা স্পর্শ করো। প্রতিটা সঠিক উত্তর তোমার percentage বাড়াবে।</p>
      ${worldsHtml || '<div class="empty-state">মাস্টারিতে এখনো কোনো কোর্স যোগ করা হয়নি।</div>'}
    </div>

    <div class="center" style="margin-top:14px;"><a class="link-back" onclick="go('studentDashboard')">← ড্যাশবোর্ডে ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}

// Global battle context
window.__battleCtx = null;

window.startBattleSessionHandler = async function(courseId, subject, monsterRef, monsterType, monsterTitle, hp, maxHp){
  const stud = getLoggedStudent();
  if(!stud){ go('studentAuth'); return; }
  const slug = stud.slug;

  toast('প্র্যাকটিস শুরু হচ্ছে...');
  const res = await postToScript('startBattleSession', {
    slug,
    subject,
    monsterType,
    monsterRef
  });

  if(!res || res.status !== 'success'){
    toast('প্র্যাকটিস শুরু করতে সমস্যা হয়েছে');
    return;
  }

  window.__battleCtx = {
    sessionId: res.sessionId,
    slug,
    courseId,
    subject,
    monsterRef,
    monsterType,
    monsterTitle,
    currentHp: hp || 10,
    maxHp: maxHp || 10,
    combo: 0,
    questionsAnswered: 0,
    recentBatchCorrect: 0,
    isReviewRound: false,
    reviewQuestionsPool: [],
    recentQuestionIds: [],
    currentQuestion: null,
    timerSeconds: 50,
    timerHandle: null
  };

  playSfx('combo');
  fetchNextBattleQuestion();
};

async function fetchNextBattleQuestion(){
  const ctx = window.__battleCtx;
  if(!ctx) return;

  if(ctx.timerHandle){ clearInterval(ctx.timerHandle); ctx.timerHandle = null; }

  // Check Review Round mechanic (§3.3): Every 5 questions within a battle
  if(!ctx.isReviewRound && ctx.questionsAnswered > 0 && ctx.questionsAnswered % 5 === 0 && ctx.reviewQuestionsPool.length > 0){
    ctx.isReviewRound = true;
    toast('⚡ কুইক রিকল / রিভিশন রাউন্ড!');
    playSfx('combo');
    // Pop a question from review pool
    const revItem = ctx.reviewQuestionsPool.shift();
    // the review question must become the "current" one, otherwise its answer would be
    // graded against the previous question
    ctx.currentQuestion = revItem.q;
    ctx.currentTopicId = revItem.topicId;
    renderBattleQuestionStage(revItem.q, true);
    return;
  }

  ctx.isReviewRound = false;
  app.innerHTML = `
    ${header('প্র্যাকটিস চলছে')}
    <div class="battle-stage center" style="padding:50px 20px;">
      <div style="font-size:36px; animation:pulse 1s infinite;">📖</div>
      <h3 style="color:#fff; margin-top:12px;">পরবর্তী প্রশ্ন আসছে...</h3>
    </div>
    ${creditFooter()}
  `;

  const excludeStr = ctx.recentQuestionIds.slice(-4).join(',');
  const params = {
    slug: ctx.slug,
    monsterType: ctx.monsterType,
    excludeIds: excludeStr
  };
  if(ctx.monsterType === 'chapter') params.topicId = ctx.monsterRef;
  if(ctx.monsterType === 'boss') params.courseId = ctx.courseId;

  const res = await postToScript('getQuestionForBattle', params);
  if(!res || res.status !== 'success'){
    toast('প্রশ্ন লোড করা যায়নি');
    go('battleWorldMap');
    return;
  }

  if(res.defeated){
    showChapterCompleteScreen(ctx);
    return;
  }

  if(res.hp !== undefined) ctx.currentHp = res.hp;
  if(res.maxHp !== undefined) ctx.maxHp = res.maxHp;

  ctx.currentQuestion = res.question;
  ctx.currentTopicId = res.topicId || ctx.monsterRef;
  ctx.recentQuestionIds.push(res.question.id);

  renderBattleQuestionStage(res.question, false);
}

function renderBattleQuestionStage(question, isReview){
  const ctx = window.__battleCtx;
  const pct = ctx.maxHp > 0 ? Math.max(0, Math.min(100, Math.round(((ctx.maxHp - ctx.currentHp) / ctx.maxHp) * 100))) : 0;

  const duration = isReview ? 30 : 50;
  ctx.timerSeconds = duration;

  const optionsHtml = (question.options || []).map((opt, idx) => `
    <div class="bubble-opt battle-opt-btn" id="optBtn${idx}" onclick="submitBattleAnswerOption(${idx})" style="background:#fff; border:1.5px solid var(--rule); margin-bottom:10px; padding:12px 14px; border-radius:10px; transition:all 0.1s ease;">
      <div class="bubble" id="bubble${idx}">${String.fromCharCode(65+idx)}</div>
      <div class="opt-text" style="font-weight:600;">${escapeHtml(opt)}</div>
    </div>
  `).join('');

  app.innerHTML = `
    ${header(ctx.monsterTitle || 'প্র্যাকটিস')}

    <div class="battle-stage" id="battleArenaStage">
      <!-- Top HUD Bar -->
      <div class="battle-header-bar">
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="audio-toggle-btn" id="soundToggleBtn" onclick="toggleSound()">${soundEnabled?'🔊 সাউন্ড চালু':'🔇 সাউন্ড বন্ধ'}</button>
          ${ctx.combo >= 2 ? `<span class="combo-streak">🔥 ${ctx.combo} সঠিক পরপর!</span>` : ''}
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          ${isReview ? '<span class="widget-tag tag-gold" style="font-size:11px;">⚡ কুইক রিকল রাউন্ড</span>' : ''}
          <div class="timer-chip ${ctx.timerSeconds<=10?'low':''}" id="battleTimerBadge" style="position:static; padding:5px 12px; font-size:13px;">
            <span class="timer-dot"></span> <span id="timerNum">${ctx.timerSeconds}s</span>
          </div>
        </div>
      </div>

      <!-- Chapter progress -->
      <div class="monster-box">
        <div style="font-size:16px; font-weight:700; color:#fff; margin-bottom:6px;">📘 ${escapeHtml(ctx.monsterTitle)}</div>
        <div class="hp-bar-wrap">
          <div class="hp-bar-fill" id="battleHpBarFill" style="width:${pct}%; background:linear-gradient(90deg, #2ecc71, #27ae60);"></div>
        </div>
        <div class="hp-label">সম্পূর্ণ: <span id="hpNumDisplay">${pct}</span>% (<span id="solvedNumDisplay">${ctx.maxHp - ctx.currentHp}</span> / ${ctx.maxHp} প্রশ্ন)</div>
      </div>
    </div>

    <!-- Question Card -->
    <div class="card" style="margin-top:-6px; position:relative; z-index:2;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <span class="q-tag">প্রশ্ন #${ctx.questionsAnswered + 1}</span>
        <span style="font-size:12px; color:var(--pencil);">${isReview ? '৩০ সেকেন্ড দ্রুত রিটেনশন' : '৫০ সেকেন্ড সময়'}</span>
      </div>

      <div class="q-text" style="font-size:16.5px; line-height:1.5;">${escapeHtml(question.text || '')}</div>
      ${question.image ? `<img src="${driveImg(question.image)}" style="max-width:100%; border-radius:8px; margin-bottom:12px;" alt="প্রশ্নের ছবি">` : ''}

      <div style="margin-top:14px;" id="optionsGroup">
        ${optionsHtml}
      </div>

      <div style="margin-top:14px; text-align:center;">
        <a class="link-back" onclick="abandonBattlePrompt()">🏳️ প্র্যাকটিস থেকে বের হও</a>
      </div>
    </div>

    ${creditFooter()}
  `;

  renderAllMath(document.getElementById('app'));

  // Start Countdown Timer
  const timerBadge = document.getElementById('battleTimerBadge');
  const timerNum = document.getElementById('timerNum');
  ctx.timerStartTime = Date.now();
  ctx.timerHandle = setInterval(() => {
    ctx.timerSeconds--;
    if(timerNum) timerNum.innerText = ctx.timerSeconds + 's';
    if(ctx.timerSeconds <= 10 && timerBadge) timerBadge.classList.add('low');
    if(ctx.timerSeconds <= 0){
      clearInterval(ctx.timerHandle);
      ctx.timerHandle = null;
      handleBattleTimeout();
    }
  }, 1000);
}

window.submitBattleAnswerOption = async function(chosenIndex){
  const ctx = window.__battleCtx;
  if(!ctx || ctx.isSubmitting) return;
  ctx.isSubmitting = true;

  if(ctx.timerHandle){ clearInterval(ctx.timerHandle); ctx.timerHandle = null; }

  const timeTakenSec = Math.max(1, Math.round((Date.now() - ctx.timerStartTime) / 1000));
  const q = ctx.currentQuestion;
  const isReview = ctx.isReviewRound;

  // Disable options visually
  const optBtns = document.querySelectorAll('.battle-opt-btn');
  optBtns.forEach(b => b.style.pointerEvents = 'none');

  const res = await postToScript('submitBattleAnswer', {
    sessionId: ctx.sessionId,
    slug: ctx.slug,
    topicId: ctx.currentTopicId,
    questionId: q.id,
    chosenIndex,
    timeTakenSec,
    isReview: isReview ? 'true' : 'false',
    monsterType: ctx.monsterType
  });

  ctx.isSubmitting = false;
  ctx.questionsAnswered++;

  const chosenBtn = document.getElementById('optBtn' + chosenIndex);
  const chosenBubble = document.getElementById('bubble' + chosenIndex);

  if(!res || res.status !== 'success'){
    toast('উত্তর যাচাই করতে সমস্যা হয়েছে');
    fetchNextBattleQuestion();
    return;
  }

  const isCorrect = res.correct;
  const correctIdx = res.correctIndex;

  if(isCorrect){
    // Play sound
    playSfx('slash');
    setTimeout(() => playSfx('hit'), 80);

    ctx.combo++;
    if(!isReview) ctx.reviewQuestionsPool.push({ q, topicId: ctx.currentTopicId });

    // Visual styles
    if(chosenBtn){
      chosenBtn.style.background = '#EBF7EE';
      chosenBtn.style.borderColor = 'var(--green)';
    }
    if(chosenBubble){
      chosenBubble.style.background = 'var(--green)';
      chosenBubble.style.color = '#fff';
    }

    // Update chapter progress locally
    if(res.hpUpdate){
      ctx.currentHp = res.hpUpdate.hp;
      ctx.maxHp = res.hpUpdate.maxHp;
      const hpFill = document.getElementById('battleHpBarFill');
      const hpNum = document.getElementById('hpNumDisplay');
      const solvedNum = document.getElementById('solvedNumDisplay');
      const solved = ctx.maxHp - ctx.currentHp;
      const pct = ctx.maxHp > 0 ? Math.max(0, Math.round((solved / ctx.maxHp) * 100)) : 0;
      if(hpFill) hpFill.style.width = pct + '%';
      if(hpNum) hpNum.innerText = pct;
      if(solvedNum) solvedNum.innerText = solved;
    }

    // Check chapter complete
    if(res.hpUpdate && res.hpUpdate.defeated){
      setTimeout(() => {
        showChapterCompleteScreen(ctx);
      }, 700);
      return;
    }
  } else {
    // Wrong answer
    playSfx('wrong');
    ctx.combo = 0;

    if(chosenBtn){
      chosenBtn.style.background = '#FDEEEE';
      chosenBtn.style.borderColor = 'var(--red)';
    }
    if(chosenBubble){
      chosenBubble.style.background = 'var(--red)';
      chosenBubble.style.color = '#fff';
    }

    // Highlight correct answer
    const rightBtn = document.getElementById('optBtn' + correctIdx);
    if(rightBtn){
      rightBtn.style.background = '#EBF7EE';
      rightBtn.style.borderColor = 'var(--green)';
    }
  }

  // Next question after 1.4s delay
  setTimeout(() => {
    fetchNextBattleQuestion();
  }, 1400);
};

// POST that returns the server's JSON even on errors (postToScript() hides the error message)
const SLOW_AI_ACTIONS = ['revisionGradeCq','revisionAssignAnswer','planSetCq','appealWrittenMarks'];
async function postToScriptRaw(action, params){
  const ctl = (SLOW_AI_ACTIONS.indexOf(action) !== -1 && window.AbortController) ? new AbortController() : null;
  const tm = ctl ? setTimeout(() => ctl.abort(), 100000) : null;   // ১০০ সেকেন্ডে সাড়া না এলে থামিয়ে ছাত্রকে জানানো হয়
  try{
    const r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...params }),
      signal: ctl ? ctl.signal : undefined
    });
    const text = await r.text();
    try{ const o = JSON.parse(text); if(o && o.vkEarned > 0) setTimeout(() => { try{ toast('📈 Vorkuta: +' + o.vkEarned + ' শেয়ার'); }catch(x){} }, 400); return o; }catch(e){ return { status:'error', message:'bad_response' }; }
  }catch(e){
    return { status:'error', message: (e && e.name === 'AbortError') ? 'timeout' : 'network' };
  }finally{ if(tm) clearTimeout(tm); }
}
function gradeErrMsg(res){
  const m = res && res.message;
  if(m === 'irrelevant') return '⚠️ ওয়ার্নিং: তোমার ছবি এই প্রশ্নের উত্তরের সাথে মিলছে না। ' + escapeHtml((res && res.feedback) || '') + ' — প্রশ্নের সঠিক উত্তরের ছবি তুলে আবার জমা দাও।';
  if(m === 'timeout') return '⏳ AI চেক করতে অনেক সময় নিচ্ছে। আবার জমা দাও।';
  if(m === 'ai_unavailable') return 'AI এখন চেক করতে পারেনি, একটু পরে আবার জমা দাও।';
  return 'জমা হয়নি, আবার চেষ্টা করো।';
}
async function getJson(action, params){
  try{
    const qs = Object.keys(params||{}).map(k=> k+'='+encodeURIComponent(params[k])).join('&');
    const r = await fetch(`${SCRIPT_URL}?action=${action}${qs?'&'+qs:''}`);
    return await r.json();
  }catch(e){ return null; }
}
function fmtBnDate(ms){
  if(!ms) return '';
  const d = new Date(ms);
  return isNaN(d.getTime()) ? '' : d.toLocaleDateString('bn-BD', { day:'numeric', month:'long', year:'numeric' });
}
function monthKeyFromCal(){
  const now = new Date();
  const y = window.__calYear !== null && window.__calYear !== undefined ? window.__calYear : now.getFullYear();
  const m = window.__calMonth !== null && window.__calMonth !== undefined ? window.__calMonth : now.getMonth();
  return y + '-' + String(m+1).padStart(2,'0');
}
function normalizeWithdrawal(w){
  // Defensive: tolerates an older backend that used a different field name (bkashNumber)
  // or didn't send method/dueAt at all -- so the UI never shows "undefined" or "NaN".
  if(!w) return w;
  const requestedAt = w.requestedAt || Date.now();
  return { ...w,
    number: w.number || w.bkashNumber || '',
    method: w.method || 'bkash',
    requestedAt,
    dueAt: w.dueAt || (requestedAt + 14*86400000)
  };
}
function couponState(name, slug, data){
  return { name, slug, balance: data.balance, unrequestedBalance: data.unrequestedBalance || 0, history: data.history,
           pendingWithdrawal: data.pendingWithdrawal ? normalizeWithdrawal(data.pendingWithdrawal) : null,
           pendingWithdrawals: (data.pendingWithdrawals || []).map(normalizeWithdrawal),
           withdrawals: (data.withdrawals || []).map(normalizeWithdrawal) };
}

function normalizeBdPhone(raw){
  let n = String(raw||'').replace(/[০-৯]/g, d=> '০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[^\d+]/g, '');
  return n.replace(/^\+?88/, '');
}

// ---------- ১) ছবি বড় করে দেখার overlay ----------
(function(){
  const st = document.createElement('style');
  st.textContent = `
    #app img:not(.brand-logo):not(.about-logo){ cursor:zoom-in; }
    #imgZoomOverlay{ position:fixed; inset:0; z-index:200; background:rgba(10,14,24,0.93); display:flex; flex-direction:column; }
    #imgZoomBar{ display:flex; align-items:center; gap:8px; padding:10px 12px; flex-wrap:wrap; }
    #imgZoomBar button, #imgZoomBar a{ background:rgba(255,255,255,0.15); color:#fff; border:1px solid rgba(255,255,255,0.28);
      border-radius:18px; padding:6px 14px; font-size:14px; font-weight:600; cursor:pointer; text-decoration:none; font-family:inherit; }
    #imgZoomBox{ flex:1; overflow:auto; touch-action:pan-x pan-y; text-align:left; padding:8px; cursor:grab; -webkit-overflow-scrolling:touch; }
    #imgZoomBox.grabbing{ cursor:grabbing; }
    #imgZoomWrap{ position:relative; margin:0 auto; }
    #imgZoomBox img{ position:absolute; left:50%; top:50%; max-width:none; background:#fff; border-radius:6px; cursor:inherit; user-select:none; -webkit-user-drag:none; }
    #imgZoomLoading{ position:absolute; inset:60px 0 0 0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:15px; pointer-events:none; }
    #imgZoomBar button.on{ background:#F2C14E; color:#1F2A44; border-color:#F2C14E; }
  `;
  document.head.appendChild(st);

  window.__zoomState = { z: 1, rot: 0, enh: false, pinchDist: 0, pinchStartZ: 1 };

  // ছবির আকার/ঘোরানো/জুম — সব এখান থেকে হিসাব হয়। জুম করলে আঙুল/মাউসের জায়গাটাই স্ক্রিনে থাকে।
  function zoomLayout(cx, cy, keepFocus){
    const box = document.getElementById('imgZoomBox'), wrap = document.getElementById('imgZoomWrap'), img = document.getElementById('imgZoomImg');
    if(!box || !wrap || !img) return;
    const st = window.__zoomState;
    const ar = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 0.75;
    const bw = box.clientWidth - 16;
    if(cx == null) cx = box.clientWidth / 2;
    if(cy == null) cy = box.clientHeight / 2;
    const oldW = wrap.offsetWidth || 1, oldH = wrap.offsetHeight || 1;
    const fx = (box.scrollLeft + cx - 8) / oldW, fy = (box.scrollTop + cy - 8) / oldH;
    const VW = Math.max(100, bw * st.z);
    const sideways = (st.rot % 180) !== 0;
    let W, H, VH;
    if(sideways){ H = VW; W = H * ar; VH = W; } else { W = VW; H = VW / ar; VH = H; }
    wrap.style.width = VW + 'px'; wrap.style.height = VH + 'px';
    img.style.width = W + 'px'; img.style.height = H + 'px';
    img.style.transform = 'translate(-50%,-50%) rotate(' + st.rot + 'deg)';
    img.style.filter = st.enh ? 'grayscale(1) contrast(1.8) brightness(1.08)' : '';
    if(keepFocus){
      box.scrollLeft = fx * VW + 8 - cx;
      box.scrollTop = fy * VH + 8 - cy;
    }
  }
  window.imgZoomSet = function(z, cx, cy){
    z = Math.max(1, Math.min(8, z));
    window.__zoomState.z = z;
    zoomLayout(cx, cy, true);
    if(z === 1){ const box = document.getElementById('imgZoomBox'); if(box){ box.scrollLeft = 0; } }
  };
  window.imgZoomBy = function(f){ imgZoomSet(window.__zoomState.z * f); };
  window.imgZoomRotate = function(){
    window.__zoomState.rot = (window.__zoomState.rot + 90) % 360;
    zoomLayout(null, null, false);
    const box = document.getElementById('imgZoomBox'); if(box){ box.scrollLeft = 0; box.scrollTop = 0; }
  };
  window.imgZoomEnhance = function(btn){
    window.__zoomState.enh = !window.__zoomState.enh;
    if(btn) btn.classList.toggle('on', window.__zoomState.enh);
    zoomLayout(null, null, false);
  };
  window.imgZoomReset = function(){
    window.__zoomState.z = 1;
    zoomLayout(null, null, false);
    const box = document.getElementById('imgZoomBox'); if(box){ box.scrollLeft = 0; box.scrollTop = 0; }
  };
  window.closeImgZoom = function(){
    const ov = document.getElementById('imgZoomOverlay');
    if(ov) ov.remove();
  };
  window.openImgZoom = function(url, openUrl, extraHtml){
    closeImgZoom();
    window.__zoomState = { z: 1, rot: 0, enh: false, pinchDist: 0, pinchStartZ: 1 };
    const ov = document.createElement('div');
    ov.id = 'imgZoomOverlay';
    ov.innerHTML = `
      <div id="imgZoomBar">
        <button onclick="imgZoomBy(0.8)" title="ছোট">➖</button>
        <button onclick="imgZoomBy(1.25)" title="বড়">➕</button>
        <button onclick="imgZoomRotate()" title="ঘোরাও">⟳ ঘোরাও</button>
        <button onclick="imgZoomEnhance(this)" title="লেখা স্পষ্ট করো">✏️ স্পষ্ট</button>
        <button onclick="imgZoomReset()" title="রিসেট">↺</button>
        ${extraHtml || ''}
        <span style="flex:1;"></span>
        ${openUrl ? `<a href="${escapeHtml(openUrl)}" target="_blank" rel="noopener">↗ নতুন ট্যাবে</a>` : ''}
        <button onclick="closeImgZoom()">✕ বন্ধ</button>
      </div>
      <div id="imgZoomBox"><div id="imgZoomWrap" style="width:100%; height:300px;"><img id="imgZoomImg" alt="ছবি"></div></div>
      <div id="imgZoomLoading">⏳ ছবি লোড হচ্ছে...</div>`;
    document.body.appendChild(ov);

    const box = document.getElementById('imgZoomBox');
    const img = document.getElementById('imgZoomImg');
    const loading = document.getElementById('imgZoomLoading');

    // বেশি রেজোলিউশনের ছবি + ব্যর্থ হলে বিকল্প লিংক
    const idm = String(url || '').match(/drive\.google\.com\/thumbnail\?id=([-\w]+)/) || String(url || '').match(/[?&]id=([-\w]+)/);
    const id = (idm && /drive\.google\.com/.test(String(url))) ? idm[1] : null;
    const cands = id ? [
      'https://drive.google.com/thumbnail?id=' + id + '&sz=w2400',
      'https://lh3.googleusercontent.com/d/' + id + '=w2400',
      'https://drive.google.com/uc?export=view&id=' + id
    ] : [url];
    let ci = 0, done = false, timer = null;
    function fail(){
      if(done) return;
      clearTimeout(timer);
      box.innerHTML = '<p style="color:#fff; padding:30px;">ছবিটা এখানে লোড হয়নি।' + (openUrl ? ' উপরের "নতুন ট্যাবে" চাপো।' : '') + '</p>';
      if(loading) loading.remove();
    }
    function tryNext(){
      if(done) return;
      clearTimeout(timer);
      if(ci >= cands.length){ fail(); return; }
      img.src = cands[ci++];
      timer = setTimeout(function(){ if(!done && !(img.complete && img.naturalWidth)) tryNext(); }, 12000);
    }
    img.onload = function(){ done = true; clearTimeout(timer); if(loading) loading.remove(); zoomLayout(null, null, false); };
    img.onerror = function(){ tryNext(); };
    zoomLayout(null, null, false);
    tryNext();

    ov.addEventListener('click', function(e){ if(e.target === ov) closeImgZoom(); });
    window.addEventListener('resize', function r(){ if(!document.getElementById('imgZoomOverlay')){ window.removeEventListener('resize', r); return; } zoomLayout(null, null, true); });

    // ডবল-ক্লিক / ডবল-ট্যাপ: জুম ইন/আউট
    const toggleAt = function(clientX, clientY){
      const r = box.getBoundingClientRect();
      imgZoomSet(window.__zoomState.z > 1 ? 1 : 2.5, clientX - r.left, clientY - r.top);
    };
    img.addEventListener('dblclick', function(e){ toggleAt(e.clientX, e.clientY); });
    let lastTap = 0;
    box.addEventListener('touchend', function(e){
      if(e.touches.length === 0 && e.changedTouches.length === 1){
        const now = Date.now();
        if(now - lastTap < 300){ toggleAt(e.changedTouches[0].clientX, e.changedTouches[0].clientY); lastTap = 0; }
        else lastTap = now;
      }
    }, { passive: true });

    // ডেস্কটপ: ক্লিক ধরে টেনে সরানো + Ctrl/ট্র্যাকপ্যাড-পিঞ্চ দিয়ে জুম
    let drag = null;
    box.addEventListener('mousedown', function(e){
      if(e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, sl: box.scrollLeft, st: box.scrollTop };
      box.classList.add('grabbing'); e.preventDefault();
    });
    window.addEventListener('mousemove', function mm(e){
      if(!document.getElementById('imgZoomOverlay')){ window.removeEventListener('mousemove', mm); return; }
      if(!drag) return;
      box.scrollLeft = drag.sl - (e.clientX - drag.x);
      box.scrollTop = drag.st - (e.clientY - drag.y);
    });
    window.addEventListener('mouseup', function(){ drag = null; box.classList.remove('grabbing'); });
    box.addEventListener('wheel', function(e){
      if(!e.ctrlKey) return;
      e.preventDefault();
      const r = box.getBoundingClientRect();
      imgZoomSet(window.__zoomState.z * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    // মোবাইল: দুই আঙুলে পিঞ্চ জুম (দুই আঙুলের মাঝখানে ফোকাস)
    const dist = (t)=> Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    box.addEventListener('touchstart', function(e){
      if(e.touches.length === 2){ window.__zoomState.pinchDist = dist(e.touches); window.__zoomState.pinchStartZ = window.__zoomState.z; }
    }, { passive: true });
    box.addEventListener('touchmove', function(e){
      if(e.touches.length === 2 && window.__zoomState.pinchDist){
        e.preventDefault();
        const r = box.getBoundingClientRect();
        const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
        const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
        imgZoomSet(window.__zoomState.pinchStartZ * (dist(e.touches) / window.__zoomState.pinchDist), mx, my);
      }
    }, { passive: false });
    box.addEventListener('touchend', function(e){ if(e.touches.length < 2) window.__zoomState.pinchDist = 0; }, { passive: true });
  };

  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeImgZoom(); });

  document.addEventListener('click', function(e){
    const t = e.target;
    if(!t || !t.closest || t.closest('#imgZoomOverlay')) return;
    const appEl = document.getElementById('app');
    if(!appEl || !appEl.contains(t)) return;

    const a = t.closest('a[href*="drive.google.com/file/d/"]');
    if(a && (a.querySelector('img') || /ছবি/.test(a.textContent))){
      e.preventDefault(); e.stopPropagation();
      openImgZoom(driveImg(a.getAttribute('href')), a.href);
      return;
    }
    const im = t.closest('img');
    if(im && im.src && !im.classList.contains('brand-logo') && !im.classList.contains('about-logo')){
      e.preventDefault(); e.stopPropagation();
      openImgZoom(im.currentSrc || im.src, /^https?:/.test(im.src) ? im.src : '');
    }
  }, true);
})();

function renderPastWrittenDetail(title, subs, examQuestions){
  examQuestions = examQuestions || [];
  const rows = (subs || []).map(s=>{
    const q = examQuestions[s.questionIndex] || {};
    const maxMarks = Number(q.marks) || 5;

    return `
    <div class="exam-item">
      <div class="row-top">
        <div class="q-text" style="font-size:14.5px;">প্রশ্ন ${s.questionIndex + 1}</div>
        <div style="text-align:end;">
          <div class="score-big ${s.percent >= 50 ? 'score-pass' : 'score-fail'}" style="font-size:17px;">${marks}/${maxMarks}</div>
          <div class="meta" style="margin-top:0;">AI ${s.percent}%</div>
        </div>
      </div>

      ${s.driveUrl ? `

  }).join('');
  app.innerHTML = `

    toast('রিভিউর অনুরোধ পাঠানো হয়েছে ✅');

};

// ---------- ৩) Written পরীক্ষা: আগে সব ছবি বাছাই -> একসাথে জমা -> AI এক এক করে চেক ----------
function redrawWrittenSolve(){
  const ctx = window.__writtenSolveCtx;
  ctx.pending = ctx.pending || {};
  const { exam, answered, pending } = ctx;
  const total = exam.questions.length;
  const totalMarksAll = exam.questions.reduce((a, qq)=> a + (Number(qq.marks) || 5), 0);

  const qHtml = exam.questions.map((q, idx)=>{
    const maxMarks = Number(q.marks) || 5;
    const head = `
      <div class="q-text">${idx + 1}. ${escapeHtml(q.text || '')} <span class="q-tag">${maxMarks} নম্বর</span></div>
      ${q.imageUrl ? `<img src="${driveImg(q.imageUrl)}" style="max-width:100%; border-radius:8px; margin-bottom:6px; display:block;" alt="প্রশ্নের ছবি">
        <div class="meta" style="margin:0 0 10px 0;">🔍 ছবিতে চাপলে বড় করে দেখা যাবে</div>` : ''}`;
    if(answered[idx]){
      return `<div class="q-block">${head}<div style="background:#E8F6EF; border-radius:8px; padding:8px 12px; font-size:13.5px;">✅ এই প্রশ্নের উত্তর আগেই জমা হয়েছে</div></div>`;
    }
    return `<div class="q-block">${head}
      <input type="file" id="wFile${idx}" accept="image/*" onchange="pickWrittenImage(${idx})" style="margin-bottom:6px;">
      <div id="wPrev${idx}">${pending[idx] ? `<img src="${pending[idx].preview}" alt="তোমার খাতার প্রিভিউ" style="max-width:100%; border-radius:8px; border:1px solid var(--paper-edge); display:block;">` : ''}</div>
    </div>`;
  }).join('');

  app.innerHTML = `
    ${header('Written CQ পরীক্ষা')}
    ${ctx.timer ? '<div id="wTimerBar" style="position:sticky; top:0; z-index:50;"></div>' : ''}
    <div class="card">
      <h2>${escapeHtml(exam.title)}</h2>
      <p class="hint">মোট ${total}টা প্রশ্ন (${totalMarksAll} নম্বর)। যে প্রশ্নগুলোর উত্তর এখন দিতে চাও সেগুলোর খাতার ছবি বাছো — অন্তত ১টা বাছলেই নিচের "জমা দাও" বাটন চাপা যাবে, তখন AI এক এক করে চেক করবে। ⚠️ একবার জমা দিলে আর কোনো প্রশ্ন জমা দিতে পারবে না (শিক্ষক অনুমতি না দিলে) — যে প্রশ্ন জমা দেবে না সেগুলোতে ০ ধরা হবে। জমা দেওয়ার আগে ছবি বদলানো যাবে।</p>
    </div>
    <div class="card">${qHtml}</div>
    <div id="wFinalArea"></div>
    <div class="center"><a class="link-back" onclick="go('landing')">← মূল পাতায় ফিরে যাও</a></div>
    ${creditFooter()}
  `;
  updateWrittenFinalBar();
  startWrittenTick();
}

function updateWrittenFinalBar(){
  const ctx = window.__writtenSolveCtx;
  const el = document.getElementById('wFinalArea');
  if(!ctx || !el) return;
  const { exam, answered, pending } = ctx;
  if(ctx.needFinalize){
    el.innerHTML = `
      <div class="card center">
        <p class="hint">উত্তরগুলো জমা হয়ে গেছে, কিন্তু জমা চূড়ান্ত করা যায়নি (ইন্টারনেট সমস্যা)। নিচের বাটন চেপে চূড়ান্ত করো।</p>
        <button class="btn btn-primary btn-block" onclick="retryFinalizeWritten()">✅ জমা চূড়ান্ত করো</button>
        ${ctx.lastError ? `<p class="hint" style="color:var(--red); margin-top:10px;">${ctx.lastError}</p>` : ''}
      </div>`;
    return;
  }
  const todo = exam.questions.map((q, i)=> i).filter(i=> !answered[i]);
  const ready = todo.filter(i=> pending[i]).length;
  const ok = todo.length > 0 && ready >= 1;
  const partial = ok && ready < todo.length;
  const hintTxt = ready === 0
    ? `${ready} / ${todo.length}টা প্রশ্নের ছবি বাছা হয়েছে — অন্তত ১টার ছবি বাছলে জমা দেওয়া যাবে`
    : partial
      ? `${ready} / ${todo.length}টা প্রশ্নের ছবি বাছা হয়েছে — ⚠️ বাকি ${todo.length - ready}টা জমা না দিলে ওগুলোতে ০ ধরা হবে, আর জমা দেওয়ার পর সেগুলো দেওয়া যাবে না`
      : `${ready} / ${todo.length}টা প্রশ্নের ছবি বাছা হয়েছে`;
  el.innerHTML = `
    <div class="card center">
      <p class="hint">${hintTxt}</p>
      <button class="btn btn-primary btn-block" ${ok ? '' : 'disabled'} onclick="submitAllWritten()">📤 ${ok ? ready + 'টা' : 'সব'} উত্তর জমা দাও (AI চেক শুরু হবে)</button>
      ${ctx.lastError ? `<p class="hint" style="color:var(--red); margin-top:10px;">${ctx.lastError}</p>` : ''}
    </div>`;
}

function wBn(n){ return String(n).replace(/\d/g, d=> '০১২৩৪৫৬৭৮৯'[d]); }
function startWrittenTick(){
  const ctx = window.__writtenSolveCtx;
  if(window.__wTick){ clearInterval(window.__wTick); window.__wTick = null; }
  if(!ctx || !ctx.timer) return;
  const paint = function(){
    const c = window.__writtenSolveCtx;
    if(c !== ctx || !c.timer){ clearInterval(window.__wTick); window.__wTick = null; return; }
    const left = c.timer.endAt - (Date.now() + c.timer.offset);
    const bar = document.getElementById('wTimerBar');
    if(bar){
      const sec = Math.max(0, Math.ceil(left / 1000));
      const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
      const txt = (hh ? wBn(hh) + ':' : '') + wBn(String(mm).padStart(2, '0')) + ':' + wBn(String(ss).padStart(2, '0'));
      const low = sec <= 300;
      bar.innerHTML = sec > 0
        ? `<div style="background:${low ? '#FDEEEE' : '#EAF2FF'}; border:1.5px solid ${low ? '#F2B8B8' : '#BBD3F5'}; color:${low ? 'var(--red)' : '#1F4E8C'}; border-radius:10px; padding:8px 12px; margin-bottom:10px; text-align:center; font-weight:700;">⏱ বাকি সময়: ${txt}${low ? ' — তাড়াতাড়ি করো!' : ''}</div>`
        : `<div style="background:#FDEEEE; border:1.5px solid #F2B8B8; color:var(--red); border-radius:10px; padding:8px 12px; margin-bottom:10px; text-align:center; font-weight:700;">⏰ সময় শেষ</div>`;
    } else if(!c.grading){
      clearInterval(window.__wTick); window.__wTick = null; return; // ছাত্র অন্য পাতায় চলে গেছে
    }
    if(left <= 0 && !c.grading && !c.timeUpFired){
      c.timeUpFired = true;
      onWrittenTimeUp();
    }
  };
  paint();
  window.__wTick = setInterval(paint, 1000);
}
async function onWrittenTimeUp(){
  const ctx = window.__writtenSolveCtx;
  if(!ctx || ctx.grading || ctx.needFinalize) return;
  toast('⏰ সময় শেষ!');
  const hasPending = Object.keys(ctx.pending || {}).length > 0;
  if(hasPending){ await window.submitAllWritten({ auto: true }); return; }
  ctx.grading = true;
  const fin = await finalizeWrittenRemote(ctx.exam.code, ctx.slug, ctx.name);
  ctx.grading = false;
  if(!fin){
    ctx.needFinalize = true;
    ctx.lastError = 'সময় শেষ, কিন্তু জমা চূড়ান্ত করা যায়নি (ইন্টারনেট সমস্যা)। আবার চেষ্টা করো।';
    redrawWrittenSolve();
    return;
  }
  let totalMarks = 0, earnedMarks = 0, pendingCount = 0;
  ctx.exam.questions.forEach((qq, i)=>{
    const m = Number(qq.marks) || 5; totalMarks += m;
    const a = ctx.answered[i];
    if(a){ earnedMarks += percentToMarks(a.percent, m); if(a.aiFailed) pendingCount++; }
  });
  go('writtenResult', { earnedMarks, totalMarks, pendingCount, couponAmount: fin.couponAmount || 0, unanswered: ctx.exam.questions.filter((qq, i)=> !ctx.answered[i]).length, title: ctx.exam.title });
}
window.retryFinalizeWritten = async function(){
  const ctx = window.__writtenSolveCtx;
  if(!ctx || ctx.grading) return;
  const { exam, slug, name } = ctx;
  ctx.grading = true; ctx.lastError = ''; toast('চূড়ান্ত করা হচ্ছে...');
  const fin = await finalizeWrittenRemote(exam.code, slug, name);
  ctx.grading = false;
  if(!fin){ ctx.lastError = 'এখনো চূড়ান্ত করা যায়নি। ইন্টারনেট দেখে আবার চাপো।'; updateWrittenFinalBar(); return; }
  ctx.needFinalize = false;
  let totalMarks = 0, earnedMarks = 0, pendingCount = 0;
  exam.questions.forEach((qq, i)=>{
    const m = Number(qq.marks) || 5; totalMarks += m;
    const a = ctx.answered[i];
    if(a){ earnedMarks += percentToMarks(a.percent, m); if(a.aiFailed) pendingCount++; }
  });
  go('writtenResult', { earnedMarks, totalMarks, pendingCount, couponAmount: fin.couponAmount || 0, unanswered: exam.questions.filter((qq, i)=> !ctx.answered[i]).length, title: exam.title });
};

window.pickWrittenImage = async function(idx){
  const ctx = window.__writtenSolveCtx;
  const input = document.getElementById('wFile' + idx);
  const file = input && input.files && input.files[0];
  if(!ctx || !file) return;
  ctx.pending = ctx.pending || {};
  const prev = document.getElementById('wPrev' + idx);
  if(prev) prev.innerHTML = `<p class="hint">ছবি প্রস্তুত করা হচ্ছে...</p>`;
  try{
    const c = await compressImageFile(file, 1200, 0.75);
    ctx.pending[idx] = { base64: c.base64, mimeType: c.mimeType, fileName: file.name, preview: 'data:' + c.mimeType + ';base64,' + c.base64 };
    if(prev) prev.innerHTML = `<img src="${ctx.pending[idx].preview}" alt="তোমার খাতার প্রিভিউ" style="max-width:100%; border-radius:8px; border:1px solid var(--paper-edge); display:block;">`;
  }catch(e){
    delete ctx.pending[idx];
    if(prev) prev.innerHTML = `<p class="hint" style="color:var(--red);">ছবি পড়া যায়নি, অন্য ছবি দিয়ে চেষ্টা করো।</p>`;
  }
  updateWrittenFinalBar();
};

function paintWrittenGrading(exam, order, status){
  const done = order.filter(i=> status[i] === 'done').length;
  const pct = order.length ? Math.round((done / order.length) * 100) : 0;
  const icon = { wait: '⏳', run: '🔍', done: '✅', fail: '❌' };
  const label = { wait: 'অপেক্ষায়', run: 'AI চেক করছে...', done: 'চেক হয়েছে', fail: 'চেক করা যায়নি' };
  app.innerHTML = `
    ${header('Written CQ পরীক্ষা')}
    <div class="card center">
      <h2>${escapeHtml(exam.title)}</h2>
      <p class="hint">AI এক এক করে তোমার খাতা চেক করছে — পেজ বন্ধ কোরো না, একটু অপেক্ষা করো।</p>
      <div class="hp-bar-wrap" style="max-width:100%; height:10px; background:#E3E8F1; border-color:#E3E8F1;">
        <div class="hp-bar-fill" style="width:${pct}%;"></div>
      </div>
      <div class="meta" style="margin-top:6px;">${done} / ${order.length} চেক হয়েছে</div>
    </div>
    <div class="card">
      ${order.map(i=> `<div class="review-block" style="display:flex; justify-content:space-between; gap:10px;">
        <span>প্রশ্ন ${i + 1}</span><span>${icon[status[i]]} ${label[status[i]]}</span></div>`).join('')}
    </div>`;
}

window.submitAllWritten = async function(opts){
  const ctx = window.__writtenSolveCtx;
  if(!ctx || ctx.grading) return;
  const { exam, slug, name } = ctx;
  ctx.pending = ctx.pending || {};
  const unanswered = exam.questions.map((q, i)=> i).filter(i=> !ctx.answered[i]);
  const order = unanswered.filter(i=> ctx.pending[i]);
  if(!order.length){ toast('অন্তত ১টা প্রশ্নের ছবি বাছো'); return; }
  const leftOut = unanswered.length - order.length;
  const confirmMsg = leftOut > 0
    ? `${order.length}টা উত্তর জমা দেবে? বাকি ${leftOut}টা প্রশ্নে ০ ধরা হবে, আর জমা দেওয়ার পর কোনো প্রশ্নই আর জমা দিতে পারবে না (শিক্ষক অনুমতি না দিলে)। নিশ্চিত?`
    : `${order.length}টা উত্তর জমা দেবে? জমা দেওয়ার পর আর বদলানো যাবে না।`;
  if(!(opts && opts.auto) && !confirm(confirmMsg)) return;

  ctx.grading = true;
  ctx.lastError = '';
  window.onbeforeunload = function(){ return 'AI চেক চলছে, এখন বের হলে মাঝপথে থেমে যাবে।'; };

  const status = {};
  order.forEach(i=> status[i] = 'wait');
  let last = null;
  const failed = [];

  for(const i of order){
    status[i] = 'run';
    paintWrittenGrading(exam, order, status);
    const p = ctx.pending[i];
    let res = await submitWrittenAnswerRemote(exam.code, slug, name, i, p.base64, p.mimeType, p.fileName);
    if(!res || res.status !== 'success'){
      await new Promise(r=> setTimeout(r, 1500));
      res = await submitWrittenAnswerRemote(exam.code, slug, name, i, p.base64, p.mimeType, p.fileName);
    }
    if(res && res.status === 'success'){
      ctx.answered[i] = { percent: res.percent, aiFeedback: res.aiFeedback, subId: res.subId };
      delete ctx.pending[i];
      status[i] = 'done';
      if(res.allDone) last = res;
    } else {
      status[i] = 'fail';
      failed.push(i);
    }
    paintWrittenGrading(exam, order, status);
  }

  ctx.grading = false;
  window.onbeforeunload = null;

  let finRes = null;
  if(failed.length === 0){
    finRes = await finalizeWrittenRemote(exam.code, slug, name);
    if(!finRes){
      ctx.needFinalize = true;
      ctx.lastError = 'জমা চূড়ান্ত করা যায়নি (ইন্টারনেট সমস্যা)। আবার চেষ্টা করো।';
      redrawWrittenSolve();
      return;
    }
  }
  if(failed.length === 0){
    let totalMarks = 0, earnedMarks;
    exam.questions.forEach((qq, i)=>{
      const m = Number(qq.marks) || 5;
      totalMarks += m;
      if(ctx.answered[i]) earnedMarks += percentToMarks(ctx.answered[i].percent, m);
    });
    go('writtenResult', { earnedMarks, totalMarks, couponAmount: finRes ? (finRes.couponAmount || 0) : 0, unanswered: exam.questions.filter((qq, i)=> !ctx.answered[i]).length, title: exam.title });
    return;
  }
  ctx.lastError = `${failed.length}টা প্রশ্ন চেক করা যায়নি (ইন্টারনেট বা AI সমস্যা)। ছবিগুলো এখনো আছে — নিচের বাটন চেপে আবার চেষ্টা করো।`;
  redrawWrittenSolve();
};

function renderWrittenResult(earnedMarks, totalMarks, couponAmount, title){
  const pct = totalMarks ? Math.round((earnedMarks / totalMarks) * 100) : 0;
  const passed = pct >= 50;
  app.innerHTML = `
    ${header('ফলাফল')}
    <div class="card center">
      <h2>${escapeHtml(title)}</h2>
      <p class="hint">সব প্রশ্ন জমা হয়ে AI চেক শেষ ✅</p>
      <div class="stamp ${passed ? '' : 'fail'}">${earnedMarks}/${totalMarks}</div>
      <p class="hint" style="margin-top:10px;">এটা তোমার সব প্রশ্নের মোট AI-মূল্যায়িত নম্বর।</p>
      
      <p class="hint" style="margin-top:10px;">কোন প্রশ্নে কত নম্বর পেয়েছো আর AI-র মন্তব্য কী — "Past Exams"-এ গিয়ে দেখো। নম্বর নিয়ে দ্বিমত থাকলে সেখান থেকেই "🚩 রিভিউ চাও" চাপতে পারবে।</p>
      ${getLoggedStudent() ? `<button class="btn btn-gold btn-block" style="margin-top:6px;" onclick="go('pastExams')">📜 Past Exams-এ বিস্তারিত দেখো</button>` : ''}
    </div>
    <div class="center"><button class="btn btn-primary" onclick="go('landing')">মূল পাতায় যাও</button></div>
    ${creditFooter()}
  `;

function annFit(){
  const A = window.__ann; if(!A || !A.cv) return;
  const box = document.getElementById('annScroll');
  A.fitW = Math.max(200, Math.min(box.clientWidth - 20, 1100));
  annApplyZoom();
}
function annApplyZoom(){
  const A = window.__ann; if(!A || !A.cv) return;
  const w = A.fitW * A.zoom;
  A.cv.style.width = w + 'px';
  A.cv.style.height = (w * A.H / A.W) + 'px';
}
window.annZoom = function(f){
  const A = window.__ann; if(!A) return;
  A.zoom = Math.max(0.5, Math.min(5, A.zoom * f));
  annApplyZoom();
};
function annLineW(){ const A = window.__ann; return Math.max(2, A.W / 300) * A.wMul; }
function annFontSize(){ const A = window.__ann; return Math.round(Math.max(24, A.W / 32)); }

function annDrawItem(c, it){
  if(it.t === 'p'){
    c.strokeStyle = it.c; c.lineWidth = it.w; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath();
    it.pts.forEach(function(p, i){ if(i) c.lineTo(p[0], p[1]); else c.moveTo(p[0], p[1]); });
    if(it.pts.length === 1) c.lineTo(it.pts[0][0] + 0.01, it.pts[0][1]);
    c.stroke();
  } else {
    c.fillStyle = it.c;
    c.font = 'bold ' + it.s + 'px "Noto Sans Bengali", sans-serif';
    c.textBaseline = 'alphabetic';
    String(it.text).split('\n').forEach(function(ln, i){ c.fillText(ln, it.x, it.y + i * it.s * 1.2); });
  }
}
function annDraw(){
  const A = window.__ann; if(!A || !A.ctx) return;
  const c = A.ctx;
  c.clearRect(0, 0, A.W, A.H);
  c.drawImage(A.base, 0, 0);
  A.items.forEach(function(it){ annDrawItem(c, it); });
  if(A.cur) annDrawItem(c, A.cur);
}
function annBtns(){
  const A = window.__ann; if(!A) return;
  const u = document.getElementById('annUndo'), r = document.getElementById('annRedo');
  if(u) u.disabled = A.undo.length === 0;
  if(r) r.disabled = A.redo.length === 0;
}
function annSnap(){
  const A = window.__ann;
  A.undo.push(JSON.stringify(A.items));
  if(A.undo.length > 60) A.undo.shift();
  A.redo = [];
  annBtns();
}
window.annUndo = function(){
  const A = window.__ann; if(!A || !A.undo.length) return;
  A.redo.push(JSON.stringify(A.items));
  A.items = JSON.parse(A.undo.pop());
  annDraw(); annBtns();
};
window.annRedo = function(){
  const A = window.__ann; if(!A || !A.redo.length) return;
  A.undo.push(JSON.stringify(A.items));
  A.items = JSON.parse(A.redo.pop());
  annDraw(); annBtns();
};
window.annTool = function(t){
  const A = window.__ann; if(!A) return;
  A.tool = t;
  ['pen','text','tick','cross','eraser','pan'].forEach(function(n){
    const b = document.getElementById('annT_' + n);
    if(b) b.classList.toggle('on', n === t);
  });
  if(A.cv){
    A.cv.style.touchAction = (t === 'pan') ? 'auto' : 'none';
    A.cv.style.cursor = (t === 'pan') ? 'grab' : (t === 'text' ? 'text' : 'crosshair');
  }
};
window.annColor = function(c){
  const A = window.__ann; if(!A) return;
  A.color = c;
  document.querySelectorAll('#annBar .ann-sw').forEach(function(s){ s.classList.toggle('on', s.getAttribute('data-c') === c); });
  if(A.tool === 'eraser' || A.tool === 'pan') annTool('pen');
};
window.annSetWidth = function(){
  const A = window.__ann; if(!A) return;
  A.wMul = parseFloat(document.getElementById('annWidth').value) || 1.4;
};
window.annRotate = function(){
  const A = window.__ann; if(!A || !A.base) return;
  const oW = A.W, oH = A.H;
  const b = document.createElement('canvas');
  b.width = oH; b.height = oW;
  const c = b.getContext('2d');
  c.translate(oH, 0); c.rotate(Math.PI / 2);
  c.drawImage(A.base, 0, 0);
  A.items.forEach(function(it){
    if(it.t === 'p') it.pts = it.pts.map(function(p){ return [oH - p[1], p[0]]; });
    else { const nx = oH - it.y, ny = it.x; it.x = nx; it.y = ny; }
  });
  A.W = oH; A.H = oW; A.base = b;
  A.cv.width = A.W; A.cv.height = A.H;
  A.undo = []; A.redo = [];
  annFit(); annDraw(); annBtns();
};

function annDistSeg(px, py, a, b){
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const l2 = dx*dx + dy*dy;
  let t = l2 ? ((px - a[0]) * dx + (py - a[1]) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (a[0] + t * dx), py - (a[1] + t * dy));
}
function annHit(it, p, R){
  if(it.t === 'p'){
    const r = R + it.w / 2;
    if(it.pts.length === 1) return Math.hypot(p[0] - it.pts[0][0], p[1] - it.pts[0][1]) <= r;
    for(let i = 1; i < it.pts.length; i++){ if(annDistSeg(p[0], p[1], it.pts[i-1], it.pts[i]) <= r) return true; }
    return false;
  }
  const lines = String(it.text).split('\n');
  const w = Math.max.apply(null, lines.map(function(l){ return l.length; })) * it.s * 0.65;
  const top = it.y - it.s, bottom = it.y + (lines.length - 1) * it.s * 1.2 + it.s * 0.3;
  return p[0] >= it.x - R && p[0] <= it.x + w + R && p[1] >= top - R && p[1] <= bottom + R;
}
function annEraseAt(p){
  const A = window.__ann;
  const R = Math.max(14, A.W / 60);
  const keep = A.items.filter(function(it){ return !annHit(it, p, R); });
  if(keep.length !== A.items.length){ A.items = keep; A.erased = true; annDraw(); }
}
function annPos(e){
  const A = window.__ann;
  const r = A.cv.getBoundingClientRect();
  return [(e.clientX - r.left) * A.W / r.width, (e.clientY - r.top) * A.H / r.height];
}
function annBind(){
  const A = window.__ann, cv = A.cv;
  cv.addEventListener('pointerdown', function(e){
    if(A.tool === 'pan') return;
    e.preventDefault();
    const p = annPos(e);
    if(A.tool === 'pen'){
      annSnap();
      A.cur = { t:'p', c:A.color, w:annLineW(), pts:[p] };
      A.ptr = true; cv.setPointerCapture(e.pointerId); annDraw();
    } else if(A.tool === 'eraser'){
      annSnap();
      A.ptr = true; A.erased = false; cv.setPointerCapture(e.pointerId); annEraseAt(p);
    } else if(A.tool === 'text'){
      const t = prompt('কী লিখবে?');
      if(t && t.trim()){ annSnap(); A.items.push({ t:'t', c:A.color, s:annFontSize(), x:p[0], y:p[1], text:t.trim() }); annDraw(); annBtns(); }
    } else if(A.tool === 'tick' || A.tool === 'cross'){
      const s = Math.round(annFontSize() * 1.6);
      annSnap();
      A.items.push({ t:'t', c:(A.tool === 'tick' ? '#15803d' : '#d11'), s:s, x:p[0] - s * 0.4, y:p[1] + s * 0.35, text:(A.tool === 'tick' ? '✔' : '✘') });
      annDraw(); annBtns();
    }
  });
  cv.addEventListener('pointermove', function(e){
    if(!A.ptr) return;
    e.preventDefault();
    const p = annPos(e);
    if(A.tool === 'pen' && A.cur){ A.cur.pts.push(p); annDraw(); }
    else if(A.tool === 'eraser'){ annEraseAt(p); }
  });
  const end = function(){
    if(!A.ptr) return;
    A.ptr = false;
    if(A.tool === 'pen' && A.cur){ A.items.push(A.cur); A.cur = null; annDraw(); }
    else if(A.tool === 'eraser' && !A.erased){ A.undo.pop(); }
    annBtns();
  };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
}

window.annSave = async function(){

        </div>

      <div class="meta">মোট: <b>${earnedMarks} / ${totalMarks}</b> নম্বর (${list.length}টা প্রশ্নের ভিত্তিতে)</div>

// ---------- ছাত্র: সব জমা (AI ব্যর্থ হলেও খাতা সেভ থাকে, শিক্ষক দেখবেন) ----------
window.submitAllWritten = async function(opts){
  const ctx = window.__writtenSolveCtx;
  if(!ctx || ctx.grading) return;
  const { exam, slug, name } = ctx;
  ctx.pending = ctx.pending || {};
  const unanswered = exam.questions.map((q, i)=> i).filter(i=> !ctx.answered[i]);
  const order = unanswered.filter(i=> ctx.pending[i]);
  if(!order.length){ toast('অন্তত ১টা প্রশ্নের ছবি বাছো'); return; }
  const leftOut = unanswered.length - order.length;
  const confirmMsg = leftOut > 0
    ? `${order.length}টা উত্তর জমা দেবে? বাকি ${leftOut}টা প্রশ্নে ০ ধরা হবে, আর জমা দেওয়ার পর কোনো প্রশ্নই আর জমা দিতে পারবে না (শিক্ষক অনুমতি না দিলে)। নিশ্চিত?`
    : `${order.length}টা উত্তর জমা দেবে? জমা দেওয়ার পর আর বদলানো যাবে না।`;
  if(!(opts && opts.auto) && !confirm(confirmMsg)) return;

  ctx.grading = true;
  ctx.lastError = '';
  window.onbeforeunload = function(){ return 'AI চেক চলছে, এখন বের হলে মাঝপথে থেমে যাবে।'; };

  const status = {};
  order.forEach(i=> status[i] = 'wait');
  let last = null;
  const failed = [];

  for(const i of order){
    status[i] = 'run';
    paintWrittenGrading(exam, order, status);
    const p = ctx.pending[i];
    let res = await submitWrittenAnswerRemote(exam.code, slug, name, i, p.base64, p.mimeType, p.fileName);
    if(!res || res.status !== 'success'){
      await new Promise(r=> setTimeout(r, 1500));
      res = await submitWrittenAnswerRemote(exam.code, slug, name, i, p.base64, p.mimeType, p.fileName);
    }
    if(res && res.status === 'success'){
      ctx.answered[i] = { percent: res.percent, aiFeedback: res.aiFeedback, subId: res.subId, aiFailed: !!res.aiFailed };
      delete ctx.pending[i];
      status[i] = 'done';
      if(res.allDone) last = res;
    } else {
      status[i] = 'fail';
      failed.push(i);
    }
    paintWrittenGrading(exam, order, status);
  }

  ctx.grading = false;
  window.onbeforeunload = null;

  let finRes = null;
  if(failed.length === 0){
    finRes = await finalizeWrittenRemote(exam.code, slug, name);
    if(!finRes){
      ctx.needFinalize = true;
      ctx.lastError = 'জমা চূড়ান্ত করা যায়নি (ইন্টারনেট সমস্যা)। আবার চেষ্টা করো।';
      redrawWrittenSolve();
      return;
    }
  }
  if(failed.length === 0){
    let totalMarks = 0, earnedMarks, pendingCount = 0;
    exam.questions.forEach((qq, i)=>{
      const m = Number(qq.marks) || 5;
      totalMarks += m;
      const a = ctx.answered[i];
      if(a){ earnedMarks += percentToMarks(a.percent, m); if(a.aiFailed) pendingCount++; }
    });
    go('writtenResult', { earnedMarks, totalMarks, pendingCount, couponAmount: finRes ? (finRes.couponAmount || 0) : 0, unanswered: exam.questions.filter((qq, i)=> !ctx.answered[i]).length, title: exam.title });
    return;
  }
  ctx.lastError = `${failed.length}টা প্রশ্ন জমা দেওয়া যায়নি (ইন্টারনেট সমস্যা)। ছবিগুলো এখনো আছে — নিচের বাটন চেপে আবার চেষ্টা করো।`;
  redrawWrittenSolve();
};

function renderWrittenResult(earnedMarks, totalMarks, couponAmount, title, pendingCount, unanswered){
  const pct = totalMarks ? Math.round((earnedMarks / totalMarks) * 100) : 0;
  const passed = pct >= 50;
  app.innerHTML = `
    ${header('ফলাফল')}
    <div class="card center">
      <h2>${escapeHtml(title)}</h2>
      <p class="hint">${unanswered > 0 ? `জমা হয়েছে ✅ — ${unanswered}টা প্রশ্ন জমা দাওনি, সেগুলোতে ০ ধরা হয়েছে। আর নতুন করে জমা দেওয়া যাবে না (শিক্ষক অনুমতি দিলে ছাড়া)।` : 'সব প্রশ্ন জমা হয়েছে ✅'}</p>

window.aiRecheckPending = async function(code){
  const btn = document.getElementById('aiRecheckBtn');
  const st = document.getElementById('aiRecheckStatus');
  if(btn) btn.disabled = true;
  let done = 0, remaining = null, guard = 0, quotaOut = false, err = false;
  while(guard++ < 60){
    if(st) st.innerHTML = `<p class="hint">🤖 AI চেক চলছে... ${done}টা হয়েছে${remaining !== null ? ', বাকি ' + remaining + 'টা' : ''} — পেজ বন্ধ কোরো না</p>`;
    const res = await postToScriptRaw('aiRecheckWritten', { code: code || '', max: 4 });
    if(!res || res.status !== 'success'){ err = true; break; }
    done += res.success; remaining = res.remaining;
    if(res.remaining <= 0) break;
    if(res.success === 0){ quotaOut = true; break; }
  }
  if(st){
    st.innerHTML = err ? `<p class="hint" style="color:var(--red);">❌ সংযোগ বা সার্ভার সমস্যা, আবার চেষ্টা করো।</p>`
      : quotaOut ? `<p class="hint" style="color:#9B6A15;">⚠️ ${done}টা চেক হয়েছে। বাকি ${remaining}টায় AI-র কোটা এখনো শেষ — পরে আবার চাপো, অথবা নিজে "✏️ চেক / মার্ক করো" দিয়ে নম্বর দাও।</p>`
      : `<p class="hint" style="color:var(--green);">✅ ${done}টা খাতা AI দিয়ে চেক হয়েছে।</p>`;
  }
  if(btn) btn.disabled = false;
  if(done > 0){
    setTimeout(function(){
      if(code) go('writtenSubmissions', { code: code, onlyPending: !!(state && state.onlyPending) });
      else go('reviewInbox');
    }, 1800);
  }
};

window.drawNotesGroups = function(){
  const ctx = window.__notesListCtx, el = document.getElementById('notesGroups');
  if(!ctx || !el) return;
  const q = ((document.getElementById('notesSearch') || {}).value || '').trim().toLowerCase();
  const list = ctx.items.map((n, idx)=> ({ n, idx })).filter(x=>{
    if(!q) return true;
    return (x.n.title + ' ' + x.n.chapter + ' ' + x.n.topic + ' ' + (x.n.subtopics || []).join(' ')).toLowerCase().indexOf(q) !== -1;
  });
  if(!list.length){ el.innerHTML = `<div class="empty-state">${ctx.items.length ? 'কিছু পাওয়া যায়নি।' : 'এখনো এই বিষয়ে কোনো নোট/স্লাইড যোগ করা হয়নি।'}</div>`; return; }
  const chapters = {}, order = [];
  list.forEach(x=>{
    const ch = x.n.chapter || 'অন্যান্য', tp = x.n.topic || 'সাধারণ';
    if(!chapters[ch]){ chapters[ch] = {}; order.push(ch); }
    (chapters[ch][tp] = chapters[ch][tp] || []).push(x);
  });
  const open = (ctx.items.length <= 12 || q) ? 'open' : '';
  el.innerHTML = order.map(ch=>{
    const topics = chapters[ch];
    const count = Object.keys(topics).reduce((a, t)=> a + topics[t].length, 0);
    return `<details ${open} style="margin-bottom:10px; border:1px solid var(--paper-edge); border-radius:10px; padding:8px 12px; background:#FCFDFE;">
      <summary style="cursor:pointer; font-weight:700;">📖 ${escapeHtml(ch)} <span class="meta">(${count}টা)</span></summary>
      ${Object.keys(topics).map(tp=> `
        <div style="margin-top:10px;">
          <div style="font-weight:600; color:var(--pencil); font-size:13.5px; margin-bottom:6px;">▸ ${escapeHtml(tp)}</div>
          ${topics[tp].map(x=>{
            const n = x.n;
            return `<div class="exam-item" style="margin-bottom:8px;">
              <h3 style="margin-bottom:4px; font-size:15px;">${escapeHtml(n.title)}</h3>
              <div>${noteChips(n)}</div>
              ${n.type === 'html'
                ? `<button class="btn btn-outline btn-block" style="margin-top:6px;" onclick="viewNoteSlide(${x.idx})">📄 দেখো</button>`
                : `<a href="${escapeHtml(n.content)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="text-decoration:none; margin-top:6px;">📄 খোলো</a>`}
            </div>`;
          }).join('')}
        </div>`).join('')}
    </details>`;
  }).join('');
};
window.viewNoteSlide = async function(idx){
  const { subject, items } = window.__notesListCtx;
  const n = items[idx];
  let content = n.content;
  if(String(content).indexOf('DRIVEHTML:') === 0){

const SEARCH_SRC = {
  note: { icon:'📑', label:'ক্লাস নোট / স্লাইড' },
  mcq:  { icon:'🎯', label:'MCQ প্র্যাকটিস' },

};
window.__searchImg = null;

function renderSmartSearch(){
  const subjectOptions = Object.keys(NOTES_SUBJECTS).map(k=> `<option value="${k}">${NOTES_SUBJECTS[k].icon} ${NOTES_SUBJECTS[k].label}</option>`).join('');
  window.__searchImg = null;
  app.innerHTML = `
    ${header('খুঁজে দেখো')}
    <div class="card">
      <h2>🔎 টপিক বা প্রশ্ন খোঁজো</h2>
      <p class="hint">প্রশ্নের ছবি তুলে দাও, বা টপিকের নাম/প্রশ্ন লিখো — এই টপিকে নোট, MCQ, পরীক্ষার প্রশ্ন আর তোমার Daily HW কবে কী ছিল, তারিখসহ এক জায়গায় দেখাবে।</p>

      <label class="field-label">লিখে খোঁজো</label>
      <textarea id="searchQuery" style="min-height:90px;" placeholder="যেমন: Kp ও Kc এর সম্পর্ক, বিয়োজন মাত্রা দেওয়া আছে..."></textarea>
      <label class="field-label">অথবা প্রশ্নের ছবি</label>
      <input type="file" id="searchImgInput" accept="image/*" onchange="pickSearchImage(this)" style="margin-bottom:14px;">
      <button class="btn btn-primary btn-block" onclick="doSmartSearch()">🔎 খোঁজো</button>
      <div id="searchResults" style="margin-top:16px;"></div>
    </div>

window.pickSearchImage = async function(inp){
  const f = inp.files[0];
  if(!f){ window.__searchImg = null; return; }
  window.__searchImg = await compressImageFile(f, 1200, 0.75);
  toast('ছবি নেওয়া হয়েছে ✅');
};
window.doSmartSearch = async function(){
  const query = document.getElementById('searchQuery').value.trim();
  const subject = document.getElementById('searchSubject').value;
  const img = window.__searchImg;
  if(!query && !img){ toast('লিখো অথবা একটা ছবি দাও'); return; }
  const stud = getLoggedStudent();
  const box = document.getElementById('searchResults');
  box.innerHTML = `<div class="card center" style="padding:20px;">খোঁজা হচ্ছে...</div>`;
  const res = await postToScriptRaw('smartSearch', {
    slug: stud ? stud.slug : '', subject, query,
    imageBase64: img ? img.base64 : '', imageMimeType: img ? img.mimeType : ''
  });
  if(!res || res.status !== 'success'){
    box.innerHTML = `<div class="empty-state">খোঁজা যায়নি, একটু পরে আবার চেষ্টা করো।</div>`;
    return;
  }
  const u = res.understood || {};
  const items = res.items || [];
  const dateBn = d => d ? fmtBnDate(new Date(d).getTime()) : '';

  const topicLine = u.topic
    ? `<div style="font-weight:700;">${escapeHtml(u.chapter)} › ${escapeHtml(u.topic)}</div>` +
      (u.subtopics && u.subtopics.length ? `<div class="meta">ধরন: ${u.subtopics.map(escapeHtml).join(' · ')}</div>` : '')
    : `<div class="meta">নির্দিষ্ট টপিক ধরা যায়নি — লেখার সাথে মিল দেখে খোঁজা হয়েছে।</div>`;
  const spanLine = res.first
    ? `<div class="meta" style="margin-top:6px;">এই টপিকের উপকরণ: <b>${res.total}</b>টা · প্রথম ${dateBn(res.first)} থেকে সর্বশেষ ${dateBn(res.last)} পর্যন্ত</div>` : '';

  const card = it => {
    const s = SEARCH_SRC[it.source] || { icon:'📄', label:it.source };
    let extra = '';
    if(it.source === 'note' && it.ref && it.ref.url) extra = `<a href="${escapeHtml(it.ref.url)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="text-decoration:none; margin-top:8px;">📄 খোলো</a>`;
    if(it.source === 'hw' && it.ref){
      extra = `<div class="row" style="margin-top:8px;">
          ${it.ref.qUrl ? `<a href="${escapeHtml(it.ref.qUrl)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="text-decoration:none;">প্রশ্নের ছবি</a>` : ''}
          ${it.ref.aUrl ? `<a href="${escapeHtml(it.ref.aUrl)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="text-decoration:none;">তোমার সমাধান</a>` : ''}
        </div>${it.ref.feedback ? `<div class="say" style="margin-top:8px;">🤖 ${escapeHtml(it.ref.feedback)}</div>` : ''}`;
    }
    return `<div class="exam-item">
      <div class="row-top"><div>
        <span class="q-tag">${s.icon} ${s.label}</span> <span class="meta">${dateBn(it.date)}</span>
        <div style="font-weight:600; margin-top:4px;">${escapeHtml(it.title||'')}</div>
      </div></div>
      <div class="meta" style="margin-top:4px;">${escapeHtml(it.snippet||'')}</div>
      ${it.subtopics && it.subtopics.length ? `<div class="meta">🏷️ ${it.subtopics.map(escapeHtml).join(' · ')}</div>` : ''}
      ${extra}
    </div>`;
  };
  const exact = items.filter(i=> i.level === 'exact');
  const rest = items.filter(i=> i.level !== 'exact');

  box.innerHTML = `
    <div class="card" style="background:#F5F9FE;">${topicLine}${spanLine}</div>
    ${exact.length ? `<h3>🎯 একদম কাছাকাছি ধরনের</h3>${exact.map(card).join('')}` : ''}
    ${rest.length ? `<h3 style="margin-top:14px;">📂 ${u.topic ? 'একই টপিকের অন্যান্য' : 'মিলে যাওয়া'}</h3>${rest.map(card).join('')}` : ''}
    ${!items.length ? `<div class="empty-state">এই টপিকে এখনো কিছু পাওয়া যায়নি।</div>` : ''}
  `;
  renderAllMath(box);
};

  window.revStart = async function(){

    const segs = sep ? subs.map(s => ({ subs:[s], sec:mins * 60 })) : [{ subs:subs, sec:mins * 60 }];

  function revBeginSeg(){

      if(state.screen !== 'revision' || !R() || R() !== r){ clearInterval(r.timer); return; }
      if(r.paused) return;
      r.remaining--; localStorage.setItem(doneKey(), doneSec() + 1);
      const el = document.getElementById('revT'); if(el) el.textContent = fmtTime(Math.max(0, r.remaining));
      if(r.remaining <= 0){ r.over = true; clearInterval(r.timer); }
    }, 1000);
    revNext();
  }

  function revPick(){
    const r = R(); if(r.over) return null;
    const sub = r.segs[r.si].subs, P = r.pool;
    const ok = i => !r.used[i.key] && (i.subject ? sub.indexOf(i.subject) !== -1 : !!(i.amb && i.amb.length && i.amb.every(x => sub.indexOf(x) !== -1)));
    r.seen = r.seen || {};
    const get = k => { const a = (P[k] || []).filter(ok), f = a.filter(i => !r.seen[i.tk]); return f.length ? f : a; };
    r.tog ^= 1;                                   // দুর্বল ↔ সহজ পালাক্রমে
    const weak = r.tog === 1, cq = r.remaining >= CQ_MIN_SEC;
    const order = cq
      ? (weak ? ['cqWeak','gen','cqEasy','mcqWeak','mcqEasy'] : ['cqEasy','cqWeak','gen','mcqEasy','mcqWeak'])
      : (weak ? ['mcqWeak','mcqEasy'] : ['mcqEasy','mcqWeak']);
    for(const k of order){ const l = get(k); if(l.length){
      let it = l[0];
      if(!r.started){                              // দিনের প্রথম প্রশ্ন: সেরা ৫টার মধ্যে র‍্যান্ডম, গতবারেরটা বাদ
        const last = localStorage.getItem('rev_first_last');
        const cand = l.slice(0, 5).filter(x => x.key !== last);
        it = cand.length ? cand[Math.floor(Math.random() * cand.length)] : l[0];
        r.started = true; localStorage.setItem('rev_first_last', it.key);

      r.used[it.key] = 1; r.seen[it.tk] = 1; return it; } }
    return null;
  }

  function revNext(){
    const r = R(), it = revPick();
    if(!it){
      if(r.si < r.segs.length - 1){ r.si++; toast('পরের বিষয়'); revBeginSeg(); return; }
      r.phase = 'summary'; clearInterval(r.timer); revRender(); return;

  // ================= ⏸ রিভিশন নোট: টাইমার থামিয়ে নোট পড়া, তারপর টাইমার চালু করে ফিরে আসা =================
  const rnTok = s => String(s || '').toLowerCase().split(/[^a-z0-9\u0980-\u09FF]+/).filter(x => x.length >= 3);

  const bnD = s => String(s).replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
  const LBL = { bn:['ক', 'খ', 'গ', 'ঘ'], en:['a', 'b', 'c', 'd'] };
  function bqStem(s){
    let t = String(s).replace(/\s*\n\s*/g, ' ').trim(), tag = '';
    t = t.replace(/^\s*Q\s*\d*\s*[:.)]\s*/i, '').replace(/^\s*(?:প্রশ্ন\s*)?[\d০-৯]+\s*[.)।:\-]\s*/, '');
    const tm = t.match(/\[([^\]]+)\]\s*$/); if(tm){ tag = tm[1].trim(); t = t.replace(/\s*\[[^\]]+\]\s*$/, '').trim(); }
    return { text:t, tag };
  }
  function bqParseOne(block){
    let t = block.replace(/\r/g, '').trim(), correct = -1;
    const am = t.match(/(?:সঠিক\s*উত্তর|উত্তর|উঃ|ans(?:wer)?|ans)\s*[:：=\-]?\s*\(?\s*([কখগঘ]|[a-dA-D]|[১-৪1-4])\s*\)?\s*\.?\s*$/im);
    if(am){
      const v = bnD(am[1]).toLowerCase(), ix = LBL.bn.indexOf(v) !== -1 ? LBL.bn.indexOf(v) : (LBL.en.indexOf(v) !== -1 ? LBL.en.indexOf(v) : (+v - 1));
      if(ix >= 0 && ix <= 3) correct = ix;
      t = t.slice(0, am.index).trim();
    }
    for(const set of [LBL.bn, LBL.en]){
      let pos = [], from = 0, ok = true;
      for(const l of set){
        const re = new RegExp('(^|\\s)\\(?' + l + '[.)।:]\\s*', 'i'); const m = re.exec(t.slice(from));
        if(!m){ ok = false; break; }
        const st = from + m.index + m[1].length, en = from + m.index + m[0].length;
        pos.push([st, en]); from = en;
      }
      if(!ok) continue;
      const sm = bqStem(t.slice(0, pos[0][0]));
      const opts = pos.map((p, i) => t.slice(p[1], i < 3 ? pos[i + 1][0] : t.length).replace(/\s+/g, ' ').trim());
      return { text:sm.text, tag:sm.tag, opts, correct, ok:true };
    }
    const fb = bqStem(t); return { text:fb.text, tag:fb.tag, opts:['', '', '', ''], correct, ok:false };
  }
  function bqSplitBlocks(raw){
    let blocks = raw.replace(/\r/g, '').split(/\n\s*\n+/).map(x => x.trim()).filter(Boolean);
