  .dg-tile.on{ background:var(--ink,#1F2A44); color:#fff; border-color:var(--ink,#1F2A44); }
  .dg-tile.on small{ color:#e6e9f2; }
  .dg-panel{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; padding:10px; background:#F6F8FB; border-radius:12px; }
  .dg-panel .btn{ padding:9px 8px; font-size:12.5px; line-height:1.3; }
  @media (max-width:340px){ .dg-panel, .dg-top, .dg-tiles{ grid-template-columns:1fr; } }
</style>
<script>
(function(){
  const GROUPS = [
    ['📚 HW',          /HW|হোমওয়ার্ক/],
    ['🔁 রিভিশন',       /রিভিশন/],
    ['🗂️ প্রশ্নভান্ডার', /বাল্ক|মাস্টার তালিকা|চ্যাপ্টার|Taxonomy|TOC|ট্যাগ|Exam Leak/],
    ['⚙️ ম্যানেজ',       /উপস্থিতি|রেজিস্ট্রেশন|পাসওয়ার্ড|প্রশ্নোত্তর|জ্ঞানমূলক|ব্যাটেল/],
    ['🎓 কনটেন্ট',      /নোট|স্লাইড|গুরুত্বপূর্ণ টপিক|Mastery|Past|পরীক্ষা|রিভিউ/],
    ['🎁 রিওয়ার্ড',     /Coupon|Withdraw|শপ|কুপন/]
  ];
  const OTHER = '➕ অন্যান্য';
  let active = null, lastSig = '';

  function quickCard(){
    return [...document.querySelectorAll('#app .card')].find(c => !c.id && c.querySelector('h2') && /দ্রুত অ্যাকশন/.test(c.querySelector('h2').textContent));
  }
  function build(){
    if(!(state && state.screen === 'teacherDashboard')){ lastSig = ''; return; }
    const qc = quickCard(); if(!qc) return;
    const btns = [...qc.querySelectorAll('button, a.btn')];
    const sig = btns.map(b => b.textContent.trim()).join('|');
    const old = document.getElementById('dashGroups');
    if(old && sig === lastSig) return;
    if(old) old.remove();
    lastSig = sig;

    const buckets = {}; GROUPS.forEach(g => buckets[g[0]] = []); buckets[OTHER] = [];
    let primary = null;
    btns.forEach((b, i) => {
      const label = b.textContent.trim();
      if(i === 0 && /নতুন পরীক্ষা/.test(label)){ primary = b; return; }
      const g = GROUPS.find(g => g[1].test(label));
      buckets[g ? g[0] : OTHER].push(b);
    });
    const names = Object.keys(buckets).filter(n => buckets[n].length);
    if(!names.includes(active)) active = null;

    const proxy = (orig, cls) => {
      const p = document.createElement('button');
      p.type = 'button'; p.className = 'btn btn-block ' + (cls || (/btn-gold/.test(orig.className) ? 'btn-gold' : 'btn-outline'));
      p.textContent = orig.textContent.trim().replace(/^(\S+)\s+/, '$1 ');
      p.onclick = () => orig.click();
      return p;
    };
    const card = document.createElement('div');
    card.className = 'card'; card.id = 'dashGroups';
    const top = document.createElement('div'); top.className = 'dg-top';
    if(primary){ const pb = proxy(primary, 'btn-primary'); pb.textContent = '+ নতুন পরীক্ষা'; top.appendChild(pb); }
    const tg = document.createElement('button'); tg.type = 'button'; tg.className = 'btn btn-gold btn-block';
    tg.textContent = '🏷️ ট্যাগ সেন্টার'; tg.onclick = () => go('tagCenter'); top.appendChild(tg);
    card.appendChild(top);

    const tiles = document.createElement('div'); tiles.className = 'dg-tiles';
    const panelBox = document.createElement('div');
    const draw = () => {
      tiles.querySelectorAll('.dg-tile').forEach(t => t.classList.toggle('on', t.dataset.g === active));
      panelBox.innerHTML = '';
      if(!active) return;
      const panel = document.createElement('div'); panel.className = 'dg-panel';
      buckets[active].forEach(b => panel.appendChild(proxy(b)));
      panelBox.appendChild(panel);
    };
    names.forEach(n => {
      const t = document.createElement('button'); t.type = 'button'; t.className = 'dg-tile'; t.dataset.g = n;
      t.innerHTML = n + '<small>' + buckets[n].length + 'টা</small>';
      t.onclick = () => { active = (active === n) ? null : n; draw(); };
      tiles.appendChild(t);
    });
    card.appendChild(tiles); card.appendChild(panelBox); draw();

    qc.classList.add('ub-hide');          // আসল কার্ড লুকানো থাকে (অন্য ফিচারের বাটন-ইনজেকশন যেন ঠিকঠাক কাজ করে)
    qc.parentNode.insertBefore(card, qc);
  }
  let q = 0;
  new MutationObserver(() => { if(q) return; q = requestAnimationFrame(() => { q = 0; build(); }); })
    .observe(document.getElementById('app'), { childList:true, subtree:true });
  build();
})();
</script>

<!-- ===== ছবির ইনপুটে "📷 ছবি তোলো" (ক্যামেরা) বাটন — "ছবি বাছো"-র পাশাপাশি ===== -->
<script>
(function(){
  const SKIP = ['bkFiles','tcFiles'];                       // শিক্ষকের বাল্ক-আপলোড ইনপুট বাদ
  function addCam(inp){
    if(inp.dataset.cam || SKIP.indexOf(inp.id) >= 0 || inp.style.display === 'none' || inp.hidden) return;
    inp.dataset.cam = '1';
    const cam = document.createElement('input');
    cam.type = 'file'; cam.accept = 'image/*'; cam.setAttribute('capture', 'environment'); cam.style.display = 'none';
    cam.onchange = () => {
      const f = cam.files && cam.files[0]; if(!f) return;
      try{
        const dt = new DataTransfer(); dt.items.add(f);
        inp.files = dt.files;
        inp.dispatchEvent(new Event('change', { bubbles:true }));
      }catch(e){ if(typeof toast === 'function') toast('এই ব্রাউজারে ক্যামেরা সরাসরি কাজ করছে না — "ছবি বাছো" ব্যবহার করো'); }
      cam.value = '';
    };
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn btn-outline'; b.textContent = '📷 ছবি তোলো';
    b.style.cssText = 'margin:0 0 8px 0; padding:8px 14px; font-size:13px;';
    b.onclick = () => cam.click();
    inp.insertAdjacentElement('afterend', b);
    b.insertAdjacentElement('afterend', cam);
  }
  function sweepCam(){ document.querySelectorAll('#app input[type=file][accept^="image"]').forEach(addCam); }
  let q = 0;
  new MutationObserver(() => { if(q) return; q = requestAnimationFrame(() => { q = 0; sweepCam(); }); })
    .observe(document.getElementById('app'), { childList:true, subtree:true });
  sweepCam();
})();
</script>
</body>
</html>
