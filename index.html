<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>পরীক্ষার খাতা</title>
<meta name="theme-color" content="#1F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="পরীক্ষার খাতা">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<!-- KaTeX for Math & Science LaTeX equations -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" media="print" onload="this.media='all'">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="if(typeof renderAllMath==='function')renderAllMath();"></script>
<style>
  :root{
    --paper:#F5F7FB; --paper-edge:#E3E8F1; --rule:#E3E8F1; --margin-red:#BF3A2C;
    --ink:#1F2A44; --pencil:#5B6472; --gold:#D9A441; --green:#2F7D5A; --red:#BF3A2C;
    --card-shadow: 0 2px 0 rgba(31,42,68,0.06), 0 8px 24px -12px rgba(31,42,68,0.18);
    --font-display:'Noto Sans Bengali','Inter',sans-serif; --font-body:'Noto Sans Bengali','Inter',sans-serif; --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body); color:var(--ink);
    background: linear-gradient(180deg, #F8FAFD 0%, #EEF2F8 100%);
    min-height:100vh; position:relative; padding:0 0 40px 0;
  }
  body::after{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(480px 320px at 88% -6%, rgba(217,164,65,0.14), transparent 70%),
      radial-gradient(420px 300px at -8% 12%, rgba(47,125,90,0.10), transparent 70%);
  }
  .feature-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px; }
  .feature-card{ background:#FCFDFE; border:1px solid var(--paper-edge); border-radius:12px; padding:16px 10px; text-align:center; cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease; }
  .feature-card:hover{ box-shadow:0 6px 16px -6px rgba(31,42,68,0.25); transform:translateY(-2px); }
  .feature-card:active{ transform:translateY(0); }
  .feature-card .ic{ font-size:26px; display:block; margin-bottom:6px; }
  .feature-card .lbl{ font-size:13px; font-weight:600; color:var(--ink); line-height:1.3; }
  .admin-link{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--pencil); text-decoration:underline; cursor:pointer; margin-top:14px; }
  .holes{ display:none; }
  .wrap{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:28px 20px 20px 20px; }
  header.top{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
  .logo{ font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--ink); display:flex; align-items:center; gap:8px; }
  .logo .dot{ color:var(--margin-red); }
  .tagline{ font-size:13px; color:var(--pencil); }
  .card{ background:#fff; border-radius:10px; box-shadow:var(--card-shadow); padding:22px; margin-bottom:18px; border:1px solid var(--paper-edge); }
  h1,h2,h3{ font-family:var(--font-display); margin:0 0 12px 0; color:var(--ink); font-weight:700; }
  h1{font-size:26px;} h2{font-size:21px;} h3{font-size:17px;}
  p.hint{ color:var(--pencil); font-size:13.5px; margin:0 0 14px 0; line-height:1.5; }
  label.field-label{ display:block; font-size:13px; color:var(--pencil); margin-bottom:6px; font-weight:600; }
  input[type=text], input[type=number], input[type=password], input[type=tel], select, textarea{
    width:100%; padding:11px 12px; border-radius:7px; border:1.5px solid var(--rule); background:#FBFDFF;
    font-family:var(--font-body); font-size:15px; color:var(--ink); margin-bottom:14px; outline:none;
  }
  textarea{ font-family:var(--font-mono); font-size:13px; min-height:160px; resize:vertical; }
  input:focus, textarea:focus, select:focus{ border-color:var(--gold); box-shadow:0 0 0 3px rgba(217,164,65,0.18); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-body); font-weight:600; font-size:14.5px;
    padding:12px 18px; border-radius:8px; border:none; cursor:pointer; transition:transform .08s ease, box-shadow .08s ease; }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ box-shadow:0 4px 14px -4px rgba(31,42,68,0.5); }
  .btn-gold{ background:var(--gold); color:#3a2a06; }
  .btn-outline{ background:transparent; color:var(--ink); border:1.5px solid var(--rule); }
  .btn-danger{ background:transparent; color:var(--red); border:1.5px solid rgba(191,58,44,0.35); }
  .btn-block{ width:100%; }
  .btn[disabled]{ opacity:0.5; cursor:not-allowed; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > *{ flex:1; }
  .exam-item{ border:1px solid var(--paper-edge); border-radius:9px; padding:14px 16px; margin-bottom:12px; background:#FCFDFE; }
  .exam-item .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .exam-item .code-chip{ font-family:var(--font-mono); background:var(--ink); color:#fff; padding:4px 9px; border-radius:6px; font-size:13px; letter-spacing:1px; }
  .meta{ color:var(--pencil); font-size:12.5px; margin-top:4px; }
  .q-block{ padding:16px 0; border-bottom:1px dashed var(--rule); }
  .q-block:last-child{ border-bottom:none; }
  .q-num{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:2px solid var(--margin-red);
    color:var(--margin-red); font-family:var(--font-mono); font-weight:700; font-size:13px; margin-inline-end:8px; }
  .q-tag{ font-family:var(--font-mono); font-size:11px; color:var(--pencil); background:#EEF3F8; padding:2px 7px; border-radius:5px; }
  .q-text{ font-weight:600; font-size:15.5px; margin-bottom:12px; }
  .bubble-opt{ display:flex; align-items:center; gap:10px; padding:9px 6px; border-radius:7px; cursor:pointer; }
  .bubble-opt:hover{ background:#F5F9FE; }
  .bubble-opt.locked{ opacity:0.65; cursor:default; }
  .bubble-opt.locked:hover{ background:none; }
  .bubble{ width:24px; height:24px; min-width:24px; border-radius:50%; border:2px solid var(--pencil); display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:11px; color:var(--pencil); font-weight:700; transition: all .12s ease; }
  input[type=radio]{ display:none; }
  input[type=radio]:checked + .bubble{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .opt-text{ font-size:14.5px; color:var(--ink); }
  .opt-input{ flex:1; padding:8px 10px; border-radius:6px; border:1.5px solid var(--rule); font-family:var(--font-body); font-size:14px; margin-bottom:0; }
  .timer-chip{ position:sticky; top:10px; z-index:5; display:inline-flex; align-items:center; gap:8px; background:var(--ink); color:#fff;
    font-family:var(--font-mono); font-weight:700; font-size:15px; padding:8px 14px; border-radius:20px; box-shadow:0 4px 14px -4px rgba(31,42,68,0.5); float:right; }
  .timer-chip.low{ background:var(--red); }
  .timer-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  table.results{ width:100%; border-collapse:collapse; font-size:14px; }
  table.results th{ text-align:start; color:var(--pencil); font-weight:600; padding:8px 6px; border-bottom:2px solid var(--rule); font-size:12.5px; }
  table.results td{ padding:9px 6px; border-bottom:1px dashed var(--rule); }
  .rank1{ color:var(--gold); font-weight:700; }
  .score-big{ font-family:var(--font-mono); font-weight:700; }
  .score-pass{ color:var(--green); }
  .score-fail{ color:var(--red); }
  a.link-back{ color:var(--pencil); font-size:13.5px; cursor:pointer; text-decoration:underline; }
  #logoutFab{
    position:fixed; top:14px; right:14px; z-index:60;
    background:var(--margin-red); color:#fff; border:none; border-radius:20px;
    padding:9px 16px; font-family:var(--font-body); font-weight:600; font-size:13px;
    cursor:pointer; box-shadow:0 4px 14px -4px rgba(191,58,44,0.55);
  }
  #logoutFab:active{ transform:translateY(1px); }
  @media (max-width:480px){ #logoutFab{ top:auto; bottom:78px; right:12px; padding:8px 14px; font-size:12.5px; } }
  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13.5px; box-shadow:0 6px 20px -6px rgba(0,0,0,0.4); z-index:50; opacity:0; transition:opacity .25s ease; }
  .toast.show{ opacity:1; }
  .stamp{ display:inline-block; border:3px solid var(--green); color:var(--green); border-radius:50%; padding:14px 18px;
    font-family:var(--font-display); font-weight:700; font-size:22px; transform:rotate(-8deg); }
  .stamp.fail{ border-color:var(--red); color:var(--red); }
  .center{ text-align:center; }
  .empty-state{ text-align:center; padding:30px 10px; color:var(--pencil); }
  .credit{ text-align:center; font-size:11.5px; color:var(--pencil); opacity:0.85; margin-top:6px; letter-spacing:0.2px; }
  .brand-logo{ width:34px; height:34px; border-radius:8px; object-fit:cover; margin-inline-end:4px; vertical-align:middle; box-shadow:0 2px 6px -2px rgba(31,42,68,0.4); }
  .info-btn{ background:none; border:none; font-size:13px; color:var(--pencil); cursor:pointer; opacity:0.8; padding:4px 8px; display:inline-flex; align-items:center; gap:4px; border:1px solid var(--rule); border-radius:14px; }
  .info-btn:hover{ opacity:1; border-color:var(--gold); }
  .info-label{ font-family:var(--font-body); font-size:11.5px; font-weight:600; }
  .about-overlay{ position:fixed; inset:0; background:rgba(15,20,32,0.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; }
  .about-card{ background:#fff; border-radius:14px; padding:26px 24px; max-width:340px; width:100%; text-align:center; box-shadow:0 20px 60px -20px rgba(0,0,0,0.5); }
  .about-logo{ width:88px; height:88px; border-radius:50%; object-fit:cover; box-shadow:0 4px 14px -4px rgba(31,42,68,0.4); border:3px solid var(--gold); }
  .check-seq{ padding:30px 6px; text-align:center; }
  .check-line{ display:flex; align-items:center; gap:10px; justify-content:center; padding:9px 0; font-family:var(--font-mono); font-size:14px; color:var(--pencil); opacity:0; transition:opacity .3s ease; }
  .check-line.show{ opacity:1; }
  .check-line .tick{ color:var(--green); font-weight:700; }
  .qprog{ font-family:var(--font-mono); font-size:12.5px; color:var(--pencil); margin-bottom:6px; }
  .review-block{ padding:12px 0; border-bottom:1px dashed var(--rule); }
  .review-block:last-child{ border-bottom:none; }
  .review-ans{ font-size:13.5px; margin-top:4px; }
  .review-ans.right{ color:var(--green); }
  .review-ans.wrong{ color:var(--red); }
  .detail-wrap{ display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--rule); }
  .detail-wrap.open{ display:block; }
  /* === NEXT-LEVEL STYLES: DASHBOARD & BOSS BATTLE === */
  .hero-card{
    background: linear-gradient(135deg, #1F2A44 0%, #2A3B5C 100%);
    color: #fff; border-radius: 16px; padding: 22px 20px; margin-bottom: 18px;
    box-shadow: 0 10px 30px -10px rgba(31,42,68,0.4); position: relative; overflow: hidden;
  }
  .hero-card::after{
    content:""; position: absolute; right: -20px; top: -30px; width: 140px; height: 140px;
    background: radial-gradient(circle, rgba(217,164,65,0.25) 0%, transparent 70%); pointer-events:none;
  }
  .hero-profile-row{ display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  .hero-avatar{
    width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), #f39c12);
    display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff;
    box-shadow: 0 4px 12px rgba(217,164,65,0.4); border: 2px solid rgba(255,255,255,0.2);
  }
  .hero-stats-row{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12);
  }
  .stat-badge{
    background: rgba(255,255,255,0.08); border-radius: 10px; padding: 8px 10px; text-align: center;
    border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(4px);
  }
  .stat-badge .stat-val{ font-family: var(--font-mono); font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .stat-badge .stat-lbl{ font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }
  .streak-fire{ animation: fireGlow 1.2s infinite alternate ease-in-out; }
  @keyframes fireGlow{ 0%{ transform: scale(1); filter: drop-shadow(0 0 2px #e67e22); } 100%{ transform: scale(1.15); filter: drop-shadow(0 0 8px #f39c12); } }
  
  .widget-grid{ display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 18px; }
  .widget{
    background: #fff; border-radius: 14px; border: 1.5px solid var(--paper-edge); padding: 18px;
    box-shadow: 0 4px 16px -6px rgba(31,42,68,0.08); transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .widget:hover{ box-shadow: 0 8px 24px -8px rgba(31,42,68,0.15); }
  .widget-header{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .widget-title{ font-size: 16px; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; margin: 0; }
  .widget-tag{ font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 12px; }
  .tag-green{ background: #E8F6EF; color: var(--green); }
  .tag-gold{ background: #FEF6E8; color: #9B6A15; }
  .tag-blue{ background: #EDF3FC; color: #2B5797; }
  .tag-red{ background: #FDEEEE; color: var(--red); }
  
  .tab-group{ display: flex; background: #EEF2F8; border-radius: 10px; padding: 4px; gap: 4px; margin-bottom: 18px; }
  .tab-btn{
    flex: 1; padding: 9px 12px; border: none; background: transparent; border-radius: 8px;
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600; color: var(--pencil);
    cursor: pointer; transition: all 0.15s ease; text-align: center;
  }
  .tab-btn.active{ background: #fff; color: var(--ink); box-shadow: 0 2px 6px rgba(31,42,68,0.12); }

  /* Boss Battle Arena Styles */
  .battle-stage{
    background: linear-gradient(180deg, #151C2C 0%, #1F2A44 100%);
    border-radius: 18px; color: #fff; padding: 22px 18px; margin-bottom: 18px;
    box-shadow: 0 12px 36px -12px rgba(15,20,35,0.6); position: relative; overflow: hidden;
  }
  .battle-header-bar{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .monster-box{ text-align: center; position: relative; padding: 10px 0 16px 0; }
  .monster-avatar{
    width: 96px; height: 96px; margin: 0 auto 10px auto; border-radius: 50%;
    background: radial-gradient(circle, #34495e 0%, #1a252f 100%);
    border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center;
    font-size: 48px; box-shadow: 0 0 20px rgba(217,164,65,0.3); transition: transform 0.1s ease;
  }
  .monster-speech{
    display: inline-block; background: rgba(255,255,255,0.12); border-radius: 12px;
    padding: 6px 14px; font-size: 13px; color: #F5F7FB; margin-bottom: 12px;
    border: 1px solid rgba(255,255,255,0.15); max-width: 90%;
  }
  .hp-bar-wrap{
    background: rgba(0,0,0,0.4); border-radius: 12px; height: 16px; width: 100%; max-width: 320px;
    margin: 0 auto; overflow: hidden; border: 1.5px solid rgba(255,255,255,0.15); position: relative;
  }
  .hp-bar-fill{
    height: 100%; border-radius: 10px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.4s ease;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
  }
  .hp-bar-fill.mid{ background: linear-gradient(90deg, #f39c12, #e67e22); }
  .hp-bar-fill.low{ background: linear-gradient(90deg, #e74c3c, #c0392b); }
  .hp-label{ font-family: var(--font-mono); font-size: 12px; color: #fff; margin-top: 6px; font-weight: 700; }
  
  @keyframes monsterHitShake {
    0% { transform: translate(1px, 1px) rotate(0deg); }
    20% { transform: translate(-3px, 0px) rotate(1deg); }
    40% { transform: translate(3px, 2px) rotate(0deg); }
    60% { transform: translate(-3px, 1px) rotate(0deg); }
    80% { transform: translate(-1px, -1px) rotate(1deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }
  .shake-monster{ animation: monsterHitShake 0.4s ease-in-out; filter: brightness(1.3) drop-shadow(0 0 12px #e74c3c); }
  
  @keyframes floatDamage {
    0% { opacity: 1; transform: translate(-50%, 0) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -28px) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
  }
  .damage-popup {
    position: absolute; top: 25%; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 26px; font-weight: 800; color: #ff4757;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6); pointer-events: none;
    animation: floatDamage 0.75s forwards ease-out; z-index: 30;
  }
  .damage-popup.crit { color: #ffa502; font-size: 32px; text-shadow: 0 0 16px rgba(255,165,2,0.8); }

  .combo-streak{
    display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #e67e22, #d35400);
    color: #fff; padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(230,126,34,0.4);
  }
  .audio-toggle-btn{
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2);
    color: #fff; border-radius: 20px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .world-card{
    background: #FCFDFE; border: 1.5px solid var(--paper-edge); border-radius: 14px;
    padding: 16px 14px; margin-bottom: 12px; cursor: pointer; transition: all 0.15s ease;
  }
  .world-card:hover{ border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 6px 18px -4px rgba(31,42,68,0.15); }
  .boss-unlocked-glow{ border-color: var(--gold) !important; box-shadow: 0 0 16px rgba(217,164,65,0.3) !important; }

  /* KaTeX mathematical and chemical equation styles */
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin: 0.6em 0; }
  .katex { font-size: 1.06em; line-height: 1.2; }

  /* PWA installation banner */
  .pwa-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: linear-gradient(135deg, #1F2A44, #2c3e66); color: #fff;
    padding: 12px 16px; border-radius: 12px; margin-bottom: 16px;
    box-shadow: 0 4px 16px rgba(31,42,68,0.22); border: 1px solid rgba(255,255,255,0.15);
  }
  .pwa-banner-text { font-size: 13px; font-weight: 500; line-height: 1.4; }
  .pwa-banner-text strong { color: #fff; font-size: 13.5px; }
  .pwa-btn {
    background: var(--gold); color: #3a2a06; font-size: 12px; font-weight: 700;
    padding: 7px 14px; border-radius: 20px; border: none; cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: transform 0.1s ease;
  }
  .pwa-btn:hover { transform: scale(1.03); }

  /* Voice Doubt UI */
  .voice-record-btn {
    display: inline-flex; align-items: center; gap: 6px; background: #EEF2F8;
    color: var(--ink); border: 1.5px solid var(--paper-edge); border-radius: 20px;
    padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s ease;
  }
  .voice-record-btn:hover { background: #E2E8F0; }
  .voice-record-btn.recording {
    background: #ff4757; color: #fff; border-color: #ff4757;
    animation: voicePulse 1.2s infinite ease-in-out;
  }
  @keyframes voicePulse {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,71,87,0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(255,71,87,0); }
    100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,71,87,0); }
  }
  .read-aloud-btn {
    display: inline-flex; align-items: center; gap: 4px; background: rgba(31,42,68,0.06);
    border: 1px solid var(--paper-edge); border-radius: 14px; padding: 4px 10px;
    font-size: 12px; font-weight: 600; color: var(--ink); cursor: pointer; transition: background 0.15s ease;
  }
  .read-aloud-btn:hover { background: rgba(31,42,68,0.12); }

  /* ===== Question library: side panel next to the exam form ===== */
  .lib-panel{ position:fixed; z-index:70; top:60px; bottom:12px; right:12px; width:min(94vw,440px);
    background:#fff; border:1.5px solid var(--paper-edge); border-radius:14px; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 18px 50px -12px rgba(31,42,68,0.45); }
  .lib-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--paper-edge); background:#FCFDFE; }
  .lib-panel-body{ flex:1; overflow-y:auto; padding:14px 16px; }
  .lib-panel-foot{ padding:9px 16px; border-top:1px solid var(--paper-edge); font-size:12.5px; color:var(--pencil); background:#FCFDFE; }
  .lib-actions{ position:sticky; top:-14px; z-index:2; background:#fff; padding:8px 0 10px 0; margin-top:-8px; display:flex; gap:8px; }
  .lib-actions .btn{ flex:1; padding:9px 10px; font-size:13px; }
  .lib-q{ display:flex; gap:10px; align-items:flex-start; padding:10px 6px; border-bottom:1px dashed var(--rule); cursor:pointer; }
  .lib-q input{ margin:4px 0 0 0; width:18px; height:18px; flex:none; }
  .lib-q.dup{ opacity:.55; cursor:default; }
  .lib-q-text{ font-weight:600; font-size:14px; line-height:1.5; }
  @media (min-width:1150px){
    /* wide screen: form moves slightly left, library sits right beside it */
    body.lib-open .wrap{ margin-left:24px; margin-right:auto; }
    .lib-panel{ left:680px; right:auto; width:min(560px, calc(100vw - 696px)); box-shadow:var(--card-shadow); }
  }
  /* [NEW] class-days summary chips */
  .cls-chips{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .cls-chip{ border-radius:10px; padding:8px 4px; text-align:center; display:flex; flex-direction:column; gap:2px; }
  .cls-chip b{ font-family:var(--font-mono); font-size:19px; }
  .cls-chip span{ font-size:11px; font-weight:600; line-height:1.25; }
  /* [NEW] প্রশ্ন প্যালেট + নরম ফলাফল */
  .qpal{ position:sticky; top:0; z-index:4; display:flex; gap:8px; overflow-x:auto; padding:10px 2px; margin:0 0 10px; background:linear-gradient(180deg,#F8FAFD 80%,rgba(248,250,253,0)); -webkit-overflow-scrolling:touch; }
  .qpal-b{ flex:none; width:42px; height:42px; border-radius:12px; border:2px solid #C9D2E2; background:#fff; color:#44506A; font-family:var(--font-mono); font-weight:700; font-size:14px; cursor:pointer; }
  .qpal-b.done{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .stamp.soft{ border-color:var(--gold); color:#9B6A15; }
</style>

// Some Android WebViews / installed PWAs report navigator.clipboard.writeText()
// as resolved (so our toast says "কপি হয়েছে") without actually placing anything
// on the system clipboard. This wraps the modern API with the older
// textarea+execCommand('copy') fallback, and always verifies the fallback
// actually worked before resolving, so the toast never lies about the result.
function copyText(text){
  return new Promise((resolve, reject)=>{
    const tryFallback = ()=>{
      try{
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length); // needed on some mobile browsers
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        ok ? resolve() : reject();
      }catch(e){ reject(e); }
    };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(resolve).catch(tryFallback);
    } else {
      tryFallback();
    }
  });
}

async function sget(key) {
  if (key.startsWith('exam:')) {
    const code = key.split(':')[1];
    try {
      let r = await fetch(`${SCRIPT_URL}?action=getExam&code=${code}`);
      let text = await r.text();
      if(text.trim().startsWith('<!DOCTYPE') || text.trim().startsWith('<html')) {
         alert("গুগল স্ক্রিপ্ট সমস্যা: স্ক্রিপ্টটি সঠিকভাবে ডেপ্লয় করা হয়নি অথবা 'Anyone' অ্যাক্সেস দেওয়া হয়নি।");
         return null;
      }
      let json = JSON.parse(text);
      if (json.status === "success") {
        localStorage.setItem(key, JSON.stringify(json.data));
        return { value: JSON.stringify(json.data) };
      }
    } catch(e) {
      alert("নেটওয়ার্ক বা গুগলের সমস্যা: " + e.message);
    }
  }
  const r = localStorage.getItem(key);
  return r ? { value: r } : null;
}

async function sset(key, value) {
  localStorage.setItem(key, value);
  try {
    if (key.startsWith('exam:')) {
      const code = key.split(':')[1];
      const r = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight; Apps Script just reads raw body
        body: JSON.stringify({ action: 'saveExam', code, exam: value })
      });
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); } catch(parseErr){
        console.error('saveExam: non-JSON response', text);
        toast('সেভ ব্যর্থ: সার্ভার থেকে ভুল উত্তর এসেছে');
        return null;
      }
      if(json.status !== 'success'){
        console.error('saveExam failed', json);
        toast('সেভ ব্যর্থ: ' + (json.message || 'অজানা সমস্যা'));
        return null;
      }
    } else if (key.startsWith('result:')) {
      const parts = key.split(':');
      const code = parts[1];
      const slug = parts[2];
      const r = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitResult', code, slug, result: value })
      });
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); } catch(parseErr){
        console.error('submitResult: non-JSON response', text);
        toast('জমা ব্যর্থ: সার্ভার থেকে ভুল উত্তর এসেছে');
        return null;
      }
      if(json.status !== 'success'){
        console.error('submitResult failed', json);
        toast('জমা ব্যর্থ: ' + (json.message || 'অজানা সমস্যা'));
        return null;
      }
    }
    return true;
  } catch(e) {
    console.error('sset network error', e);
    toast('নেটওয়ার্ক সমস্যা: সেভ/জমা করা যায়নি');
    return null;
  }
}

async function sdel(key){ localStorage.removeItem(key); return true; }
async function slist(prefix){
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith(prefix)) keys.push(k);
  }
  return keys;
}

async function getRemoteResults(code) {
  try {
    let r = await fetch(`${SCRIPT_URL}?action=getResults&code=${code}`);
    let json = await r.json();
    if (json.status === "success") return json.data;
  } catch(e){}
  return [];
}

(function(){

  const bn = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  let timer = null;
  function tick(){
    const boxes = document.querySelectorAll('.ld-box');
    if(!boxes.length){ clearInterval(timer); timer = null; return; }
    boxes.forEach(b => {

let recognition = null;
let isRecordingVoice = false;

window.toggleVoiceInput = function(){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRec){
    toast('আপনার ব্রাউজারে ভয়েস টাইপিং সাপোর্ট নেই (Google Chrome ব্যবহার করুন)');
    return;
  }
  const btn = document.getElementById('voiceInputBtn');
  const txtArea = document.getElementById('doubtText');
  if(!txtArea) return;

  if(isRecordingVoice && recognition){
    recognition.stop();
    isRecordingVoice = false;
    if(btn){
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️ মুখে বলো (বাংলায়)';
    }
    return;
  }

  try{
    recognition = new SpeechRec();
    recognition.lang = 'bn-BD';
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function(){
      isRecordingVoice = true;
      if(btn){
        btn.classList.add('recording');
        btn.innerHTML = '🔴 শুনছি... কথা বলুন';
      }
      toast('কথা বলুন (বাংলায়)...');
    };

    recognition.onresult = function(event){
      if(event.results && event.results[0] && event.results[0][0]){
        const transcript = event.results[0][0].transcript;
        if(transcript){
          txtArea.value = (txtArea.value ? txtArea.value + ' ' : '') + transcript;
          toast('ভয়েস যুক্ত হয়েছে!');
        }
      }
    };

    recognition.onerror = function(event){
      console.warn('SpeechRec error:', event.error);
      isRecordingVoice = false;
      if(btn){
        btn.classList.remove('recording');
        btn.innerHTML = '🎙️ মুখে বলো (বাংলায়)';
      }
      if(event.error === 'not-allowed'){
        toast('মাইক্রোফোন পারমিশন দেওয়া হয়নি');
      } else {
        toast('ভয়েস বুঝতে সমস্যা হয়েছে, আবার চেষ্টা করো');
      }
    };

    recognition.onend = function(){
      isRecordingVoice = false;
      if(btn){
        btn.classList.remove('recording');
        btn.innerHTML = '🎙️ মুখে বলো (বাংলায়)';
      }
    };

    recognition.start();
  }catch(err){
    console.error('Speech recognition error:', err);
    isRecordingVoice = false;
    if(btn){
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️ মুখে বলো (বাংলায়)';
    }
  }
};

window.toggleReadAloud = function(text){
  if(!('speechSynthesis' in window)){
    toast('আপনার ব্রাউজারে স্পিচ সুবিধা নেই');

  const bnVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes('bn'));
  if(bnVoice) utter.voice = bnVoice;

  utter.onend = () => { toast('পড়া শেষ হয়েছে'); };

};

// ===== Persistent login storage (localStorage + cookie backup) =====
// Browser tab-এ refresh/বন্ধ করে খুললেও যেন লগইন থাকে — localStorage হারিয়ে গেলে cookie থেকে ফেরত আনে।
function _pGet(key){
  let v = null;
  try{ v = localStorage.getItem(key); }catch(e){}
  if(v) return v;
  try{
    const m = document.cookie.match(new RegExp('(?:^|; )' + key + '=([^;]*)'));
    if(m){
      v = decodeURIComponent(m[1]);
      try{ localStorage.setItem(key, v); }catch(e){}
      return v;
    }
  }catch(e){}
  return null;
}
function _pSet(key, val){
  try{ localStorage.setItem(key, val); }catch(e){}
  try{ document.cookie = key + '=' + encodeURIComponent(val) + '; max-age=' + (60*60*24*365) + '; path=/; SameSite=Lax'; }catch(e){}
}
function _pDel(key){
  try{ localStorage.removeItem(key); }catch(e){}
  try{ document.cookie = key + '=; max-age=0; path=/; SameSite=Lax'; }catch(e){}
}

const EXAM_PROGRESS_KEY = 'exam_progress_v1';
function saveExamProgress(){
  try{
    if(!state || state.screen !== 'studentExam' || !state.exam) return;
    const s = { exam: state.exam, slug: state.slug, name: state.name, attemptNumber: state.attemptNumber, viaCode: state.viaCode,
      answers: state.answers, locked: state.locked, startedAt: state.startedAt, qIndex: state.qIndex || 0,
      qStartedAt: state.qStartedAt || Date.now(), qStartedFor: state.qStartedFor, savedAt: Date.now() };
    localStorage.setItem(EXAM_PROGRESS_KEY, JSON.stringify(s));
  }catch(e){}
}
function clearExamProgress(){ try{ localStorage.removeItem(EXAM_PROGRESS_KEY); }catch(e){} }
function loadExamProgress(){
  try{
    const raw = localStorage.getItem(EXAM_PROGRESS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !s.exam || !s.answers || Date.now() - s.savedAt > 12*3600*1000){ clearExamProgress(); return null; }
    const now = Date.now();
    if(s.exam.timerMode !== 'total'){
      const sec = s.exam.perQuestionSeconds || 30;
      if(s.answers[s.qIndex] !== null && s.answers[s.qIndex] !== undefined){ s.qIndex += 1; s.qStartedAt = now; }
      const skip = Math.floor((now - s.qStartedAt)/1000/sec);
      if(skip > 0){ s.qIndex += skip; s.qStartedAt += skip*sec*1000; }
      s.qStartedFor = s.qIndex;
      s.finished = s.qIndex >= s.exam.questions.length;
      s.remaining = Math.max(0, sec - Math.floor((now - s.qStartedAt)/1000));
    } else {
      s.remaining = Math.max(0, s.exam.duration*60 - Math.floor((now - s.startedAt)/1000));
      s.finished = s.remaining <= 0;
    }
    return s;
  }catch(e){ return null; }
}

const MB_KEY = s => 'mistakes_v1_' + s;

function _mbLoad(k, d){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : d; }catch(e){ return d; } }

function recordExamForMistakes(exam, slug, answers){
  try{
    if(!slug || !exam || !exam.questions || !answers) return;
    const mb = _mbLoad(MB_KEY(slug), {}), ts = _mbLoad(TS_KEY(slug), {});
    exam.questions.forEach((q, i)=>{
      const ok = answers[i] === q.correct;
      const key = q.mkey || (exam.code + '|' + i);
      const tag = (q.tag && String(q.tag).trim()) || 'অন্যান্য';
      const statTag = tag.split(' › ').slice(0,2).join(' › ');
      const t = ts[statTag] || (ts[statTag] = { right:0, total:0 });
      t.total += 1; if(ok) t.right += 1;
      if(!ok){
        const prev = mb[key] || {};
        mb[key] = { key, text:q.text, options:q.options, correct:q.correct, tag, title:exam.title, wrong:(prev.wrong||0)+1, streak:0, ts:Date.now() };
      } else if(mb[key]){
        mb[key].streak = (mb[key].streak||0) + 1;
        if(mb[key].streak >= 2) delete mb[key]; // পরপর ২বার ঠিক হলে খাতা থেকে বাদ
      }
    });
    const keys = Object.keys(mb);
    if(keys.length > 200) keys.sort((a,b)=> mb[a].ts - mb[b].ts).slice(0, keys.length-200).forEach(k=> delete mb[k]);
    _mbSave(MB_KEY(slug), mb); _mbSave(TS_KEY(slug), ts);
    localStorage.setItem('lrn_updated_' + slug, String(Date.now()));
    fbPushLearning(slug); // [NEW] Firebase চালু থাকলে ক্লাউডে সেভ
  }catch(e){}
}

  const tip = (pct < 90 && tags.length) ? `<div style="margin-top:8px; font-size:13px; color:#44506A;">এই টপিকগুলো আরেকবার দেখে নিতে পারো: <b>${tags.map(escapeHtml).join(', ')}</b></div>` : '';

let __fbP = null;
function fbInit(){
  if(!FIREBASE_CONFIG) return Promise.resolve(null);
  if(__fbP) return __fbP;
  const load = src => new Promise((res, rej)=>{ const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
  const B = 'https://www.gstatic.com/firebasejs/10.12.2/';
  __fbP = load(B + 'firebase-app-compat.js')
    .then(()=> Promise.all([ load(B + 'firebase-auth-compat.js'), load(B + 'firebase-firestore-compat.js') ]))
    .then(async ()=>{ firebase.initializeApp(FIREBASE_CONFIG); await firebase.auth().signInAnonymously(); return firebase.firestore(); })
    .catch(e=>{ console.warn('Firebase বন্ধ:', e); return null; });
  return __fbP;
}
function _fbDoc(db, slug){ return db.collection('students').doc(slug).collection('data').doc('learning'); }
async function fbPullLearning(slug){
  try{
    const db = await fbInit(); if(!db || !slug) return false;
    const snap = await _fbDoc(db, slug).get();
    if(!snap.exists) return false;
    const r = snap.data();
    const localAt = Number(localStorage.getItem('lrn_updated_' + slug) || 0);
    if(!(r.updatedAt > localAt)) return false; // ফোনের ডাটা নতুন হলে রেখে দাও
    _mbSave(MB_KEY(slug), JSON.parse(r.mistakes || '{}'));
    _mbSave(TS_KEY(slug), JSON.parse(r.topics || '{}'));
    localStorage.setItem('lrn_updated_' + slug, String(r.updatedAt));
    return true;
  }catch(e){ return false; }
}
async function fbPushLearning(slug){
  try{
    const db = await fbInit(); if(!db || !slug) return;
    const at = Number(localStorage.getItem('lrn_updated_' + slug) || Date.now());
    await _fbDoc(db, slug).set({ mistakes: JSON.stringify(_mbLoad(MB_KEY(slug), {})), topics: JSON.stringify(_mbLoad(TS_KEY(slug), {})), updatedAt: at });
  }catch(e){}
}

}

async function libRender(){
  const L = window.__lib;
  const body = document.getElementById('libBody');
  const crumb = document.getElementById('libCrumb');
  if(!L || !body) return;

  if(L.step==='subject'){
    crumb.textContent = 'বিষয় বাছো';
    if(!L.courses){
      body.innerHTML = `<div class="empty-state">লোড হচ্ছে...</div>`;
      const courses = await getMasteryCourses();
      if(window.__lib !== L || !document.getElementById('libBody')) return;
      L.courses = courses;
      L.subjects = [...new Set(courses.map(c=> c.subject))];
    }
    body.innerHTML = L.subjects.length
      ? L.subjects.map((sub,i)=> `<button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="libPickSubject(${i})">${escapeHtml(sub)}</button>`).join('')
      : `<div class="empty-state">Mastery-তে এখনো কোনো কোর্স/চ্যাপ্টার যোগ করা হয়নি — আগে ওখানে (বা import_to_app.py দিয়ে) প্রশ্ন যোগ করো।</div>`;
    return;
  }

  if(L.step==='course'){
    crumb.textContent = L.subjectVal;
    body.innerHTML = libBackBtn() + (L.courseList.map((c,i)=> `<button class="btn btn-primary btn-block" style="margin-bottom:8px;" onclick="libPickCourse(${i})">${escapeHtml(c.title)}</button>`).join('') || `<div class="empty-state">কোনো কোর্স নেই।</div>`);
    return;
  }

  if(L.step==='chapter'){
    crumb.textContent = L.subjectVal + ' › ' + L.course.title;
    body.innerHTML = libBackBtn() + (L.topics.map((t,i)=> `<button class="btn btn-primary btn-block" style="margin-bottom:8px; text-align:start; justify-content:flex-start;" onclick="libPickTopic(${i})">${t.order}. ${escapeHtml(t.title)} (${t.questions.length}টা)</button>`).join('') || `<div class="empty-state">এই কোর্সে এখনো কোনো চ্যাপ্টার নেই।</div>`);
    return;
  }

  if(L.step==='questions'){
    const topic = L.topic;
    crumb.textContent = L.course.title + ' › ' + topic.title;
    const already = new Set(draftQuestions.map(d=> (d.text||'').trim()));
    const rows = topic.questions.map((q,i)=>{
      const dup = already.has((q.text||'').trim());
      return `<label class="lib-q ${dup?'dup':''}">
        <input type="checkbox" id="libq${i}" ${dup?'disabled':''}>
        <div>
          <div class="lib-q-text">${i+1}. ${escapeHtml(q.text)}</div>
          <div class="meta">সঠিক: ${['ক','খ','গ','ঘ'][q.correct]}) ${escapeHtml(q.options[q.correct])}${dup?' · ✓ যোগ করা আছে':''}</div>
        </div>
      </label>`;
    }).join('');
    body.innerHTML = libBackBtn() + `
      <div class="lib-actions">
        <button class="btn btn-outline" onclick="libToggleAll()">☑️ সব বাছো</button>
        <button class="btn btn-primary" onclick="libAddSelected()">✅ পরীক্ষায় যোগ করো</button>
      </div>
      ${rows || `<div class="empty-state">এই চ্যাপ্টারে কোনো প্রশ্ন নেই।</div>`}`;
    renderAllMath(body);
    return;
  }
}

window.importBulk = function(){
  const raw = document.getElementById('bulkText').value;
  if(!raw.trim()){ toast('আগে টেক্সট পেস্ট করো'); return; }
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const parsed = [];
  const letterMap = {'A':0,'B':1,'C':2,'D':3,'ক':0,'খ':1,'গ':2,'ঘ':3,'a':0,'b':1,'c':2,'d':3};
  for(const block of blocks){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let qtext='', tag='', options=['','','',''], correct=0;
    for(const line of lines){
      const qm = line.match(/^Q[:.]?\s*(.*)$/i);
      const om = line.match(/^([A-Dকখগঘ])[).]\s*(.*)$/i);
      const am = line.match(/^ANS[:.]?\s*([A-Dকখগঘ])/i);
      if(qm){
        let t = qm[1];
        const tagm = t.match(/\[([^\]]+)\]\s*$/);
        if(tagm){ tag = tagm[1]; t = t.replace(/\s*\[[^\]]+\]\s*$/,'').trim(); }
        qtext = t;
      } else if(om){
        const realIdx = (om[1] in letterMap) ? letterMap[om[1]] : letterMap[om[1].toUpperCase()];
        options[realIdx] = om[2].trim();
      } else if(am){
        correct = (am[1] in letterMap) ? letterMap[am[1]] : letterMap[am[1].toUpperCase()];
      }
    }
    if(qtext && options.every(o=>o)){
      parsed.push({ text: qtext, tag, options, correct });
    }
  }
  if(parsed.length === 0){ toast('ফরম্যাট মেলেনি'); return; }
  draftQuestions = parsed;
  renderQList();
  toast(parsed.length + 'টি প্রশ্ন ইম্পোর্ট হয়েছে');
  document.getElementById('bulkText').value = '';
}

async function saveExam(){
  const title = document.getElementById('examTitle').value.trim();
  const subject = document.getElementById('examSubject').value.trim();
  const timerMode = document.getElementById('timerMode').value;
  const duration = parseInt(document.getElementById('examDuration').value, 10) || 7;
  const perQuestionSeconds = parseInt(document.getElementById('perQSeconds').value, 10) || 36;
  const isPublic = document.getElementById('isPublic').checked;

  const treatMaxAmount = isTreat ? (parseInt(document.getElementById('treatMaxAmount').value, 10) || 300) : null;
  if(!title || !subject){ toast('নাম ও বিষয় পূরণ করো'); return; }
  for(const q of draftQuestions){
    if(!q.text.trim() || q.options.some(o=>!o.trim())){ toast('সব পূরণ করো'); return; }
  }
  const editingExam = window.__editingExam;
  const code = editingExam ? editingExam.code : genCode();
  const teacherId = currentTeacher ? currentTeacher.id : 'admin';
  const treatPassword = isTreat ? (editingExam && editingExam.isTreat ? editingExam.treatPassword : genTreatPassword()) : null;
  const createdAt = editingExam ? editingExam.createdAt : Date.now();
  const exam = { code, title, subject, timerMode, duration, perQuestionSeconds, isPublic, isTreat, treatPassword, treatMaxAmount, teacherId, questions: draftQuestions, createdAt };
  toast('গুগল শিটে সেভ হচ্ছে...');

  window.__editingExam = null;
  alert((editingExam ? 'পরীক্ষা আপডেট হয়েছে! কোড: ' : 'পরীক্ষা তৈরি হয়েছে এবং গুগল শিটে সেভ হয়েছে! কোড: ')+code

function genTreatPassword(){

async function renderTeacherResults(code){
  app.innerHTML = `${header('রেজাল্ট')}<div class="card center">গুগল শিট থেকে রেজাল্ট লোড হচ্ছে...</div>`;
  const examRaw = await sget('exam:'+code);
  if(!examRaw){ app.innerHTML = `${header()}<div class="card center">পরীক্ষা পাওয়া যায়নি।</div>`; return; }
  const exam = JSON.parse(examRaw.value);

  const rawResults = await getRemoteResults(code);
  // group multiple practice attempts per student into one row (student can attempt unlimited times)
  const groups = {};
  rawResults.forEach(r=>{
    const key = r.slug || slugify(r.studentName||'');
    if(!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const grouped = Object.values(groups).map(list=>{
    list.sort((a,b)=> b.submittedAt - a.submittedAt);
    const best = list.reduce((m,r)=> (r.score > m.score ? r : m), list[0]);
    return { studentName: list[0].studentName, attempts: list, best, count: list.length };
  });
  grouped.sort((a,b)=> b.best.score - a.best.score || a.best.submittedAt - b.best.submittedAt);
  window.__lastGrouped = grouped;
  window.__lastExam = exam;

  let rows = grouped.map((g,i)=>{
    const pct = Math.round((g.best.score/g.best.total)*100);
    return `<tr>
      <td class="${i===0?'rank1':''}">${i+1}</td>
      <td>${escapeHtml(g.studentName)}${g.count>1?` <span class="q-tag">${g.count}বার চেষ্টা</span>`:''}</td>
      <td class="score-big ${pct>=50?'score-pass':'score-fail'}">${g.best.score}/${g.best.total}</td>
      <td>${pct}%</td>
      <td>${new Date(g.best.submittedAt).toLocaleTimeString('bn-BD')}</td>
      <td><a class="link-back" onclick="toggleDetail(${i})">খাতা দেখো</a></td>
    </tr>
    <tr><td colspan="6" style="border-bottom:none; padding:0;"><div class="detail-wrap" id="detail${i}"></div></td></tr>`;
  }).join('');

  app.innerHTML = `
    ${header('রেজাল্ট')}
    <div class="card">
      <h2>${escapeHtml(exam.title)}</h2>
      <p class="hint">কোড: <span class="code-chip">${exam.code}</span> · মোট স্টুডেন্ট: ${grouped.length} · মোট জমা (সব attempt মিলিয়ে): ${rawResults.length}</p>
      <p class="hint">এখানে প্রতিটা স্টুডেন্টের সবচেয়ে ভালো স্কোরটা দেখানো হচ্ছে (একাধিকবার practice করলেও)।</p>
      ${grouped.length===0 ? `<div class="empty-state">এখনো কেউ পরীক্ষা দেয়নি বা লোড হতে পারছে না।</div>` : `
      <table class="results">
        <thead><tr><th>#</th><th>নাম</th><th>সেরা স্কোর</th><th>%</th><th>সময়</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`}
    </div>
    <div class="center"><a class="link-back" onclick="go('teacherDashboard')">← ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}

  if(isNaN(newScore) || newScore < 0 || newScore > total){ toast('সঠিক নম্বর দাও'); return; }
  toast('আপডেট হচ্ছে...');
  const res = await postToScript('updateResultScore', { resultId, examCode, slug, newScore, total });

async function verifyStudentLogin(){
  const loggedStud = getLoggedStudent(); // [NEW]
  const name = loggedStud ? loggedStud.name : ((document.getElementById('studName')||{}).value||'').trim();
  const code = document.getElementById('studCode').value.trim().toUpperCase();
  const pass = document.getElementById('studPass').value.trim();
  if(!name || !code || !pass){ toast('সবগুলো পূরণ করো'); return; }

  toast('গুগল শিট থেকে পরীক্ষা খোঁজা হচ্ছে...');
  const __resultsP = getRemoteResults(code); // [SPEED] দুটো রিকোয়েস্ট একসাথে চলবে
  const examRaw = await sget('exam:'+code);
  if(!examRaw){ alert('পরীক্ষা পাওয়া যায়নি! কোডটি সঠিক কিনা যাচাই করো বা একটি নতুন এক্সাম তৈরি করে ট্রাই করো।'); return; }

  const exam = JSON.parse(examRaw.value);

  const requiredPassword = exam.isTreat ? exam.treatPassword : STUDENT_PASSWORD;
  if(pass !== requiredPassword){ toast('পাসওয়ার্ড ভুল হয়েছে'); return; }

  const slug = loggedStud ? loggedStud.slug : slugify(name); // [NEW]

  const existingResults = await __resultsP;
  const allAttempts = existingResults.filter(r => (r.slug ? r.slug === slug : slugify(r.studentName||'') === slug));
  // [FIX] আগে শুধু উন্মুক্ত practice (viaCode:false) দিয়ে থাকলেও কোড দিয়ে প্রথমবার দিলে সেটা আসল (গোনা) attempt
  const myAttempts = allAttempts.filter(r => r.viaCode !== false);
  if(myAttempts.length > 0){
    myAttempts.sort((a,b)=> b.submittedAt - a.submittedAt);
    if(exam.isTreat){
      // Treat exams are tied to real money rewards - no retries allowed once
      // a given name has completed it (this replaces the old password-rotation
      // approach, which was causing confusion).
      go('treatBlocked', { exam, attempt: myAttempts[0] });
      return;
    }
    go('studentChoice', { exam, slug, name, attempts: allAttempts.sort((a,b)=> b.submittedAt - a.submittedAt) });
    return;
  }

  runCheckingSequence(exam, slug, name, 1); // code exam -> counts as attendance
}

function renderStudentExamTotal(){
  const { exam, answers, locked } = state;
  const totalSec = exam.duration*60;
  const qHtml = exam.questions.map((q,i)=> `
    <div class="q-block" id="qb${i}">
      <div style="display:flex; align-items:flex-start; gap:2px;">
        <span class="q-num">${i+1}</span>

          ${q.tag ? `<span class="q-tag">${escapeHtml(q.tag)}</span>`:''}
        </div>
      </div>
      ${q.options.map((opt,j)=> `
        <label class="bubble-opt ${locked[i]?'locked':''}">
          <input type="radio" name="ans${i}" ${answers[i]===j?'checked':''} ${locked[i]?'disabled':''} onchange="setAnswerTotal(${i},${j})">
          <div class="bubble">${['ক','খ','গ','ঘ'][j]}</div>
          <div class="opt-text">${escapeHtml(opt)}</div>
        </label>
      `).join('')}
    </div>
  `).join('');

  app.innerHTML = `
    <div>
      <div class="timer-chip" id="timerChip"><span class="timer-dot"></span><span id="timerText">${fmtTime(totalSec)}</span></div>
      <header class="top" style="margin-bottom:8px;"><div class="logo" style="font-size:22px;">${escapeHtml(exam.title)}</div></header>
    </div>
    ${examPaletteHtml()}
    <div class="card">${qHtml}</div>
    <button class="btn btn-primary btn-block" onclick="confirmSubmitTotal()">✅ খাতা জমা দাও</button>
    ${creditFooter()}
  `;

  let remaining = totalSec - Math.floor((Date.now()-state.startedAt)/1000);
  if(remaining < 0) remaining = 0;
  updateTimerDisplay(remaining);
  timerInterval = setInterval(()=>{
    remaining -= 1;
    updateTimerDisplay(remaining);
    if(remaining <= 0){
      clearInterval(timerInterval); timerInterval = null;
      submitExam(true);
    }
  }, 1000);
}

function updateTimerDisplay(sec){
  const chip = document.getElementById('timerChip');

  if(!txt) return;
  txt.textContent = fmtTime(Math.max(sec,0));

window.submitExam = async function(auto){
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  const { exam, slug, name, answers, attemptNumber, viaCode } = state;

  exam.questions.forEach((q,i)=>{ if(answers[i] === q.correct) score++; });
  const resultObj = { id: genId('res'), studentName: name, slug, score, total: exam.questions.length, submittedAt: Date.now(), answers, attemptNumber: attemptNumber||1, viaCode: !!viaCode };

  if(exam.code === '__MISTAKES__'){ clearExamProgress(); await recordAndSync(exam, slug, answers); go('studentResult', { exam, result: resultObj, auto, couponAmount: 0 }); return; } // [NEW] ভুল খাতার অনুশীলন সার্ভারে যায় না

      <div class="card center">
        <p class="hint">তোমার উত্তরপত্র জমা দিতে সমস্যা হয়েছে (ইন্টারনেট বা সার্ভার সমস্যা)। তোমার উত্তরগুলো এখনো এই ডিভাইসে সেভ আছে, হারিয়ে যায়নি — নিচে আবার চেষ্টা করো।</p>

async function finalizeExamSubmission(exam, slug, resultObj, auto, viaCode){
  clearExamProgress(); // [NEW] জমা সফল হলে সেভ করা প্রোগ্রেস মুছে ফেলো
  { const tg = window.__tagsP ? await window.__tagsP : await fetchExamTags(exam.code); window.__tagsP = null; exam = examWithTags(exam, tg); } // [NEW] ট্যাগ সেন্টারের ট্যাগ
  await recordAndSync(exam, slug, resultObj.answers); // [NEW] ভুল খাতা ও টপিক হিসাব
  let couponAmount = 0;
  if(exam.isTreat && (resultObj.attemptNumber||1) === 1){
    const percent = Math.round((resultObj.score/exam.questions.length)*100);
    const couponRes = await awardCouponRemote(slug, exam.code, percent, exam.treatMaxAmount);
    if(couponRes && couponRes.amount) couponAmount = couponRes.amount;
    // NOTE: password is no longer rotated after use - once someone with a given
    // name has completed this Treat exam, they're blocked from re-entering
    // (checked in verifyStudentLogin), so a fixed shared password is safe.
  }
  // [NEW] taking a CODE exam today counts as proof of attendance (blue). Practice exams / retakes do not.
  if(viaCode) markAttendanceRemote(slug, todayStr(), 'exam').catch(()=>{});
  go('studentResult', { exam, result: resultObj, auto, couponAmount });
}

function buildAnswerReview(exam, answers){
  return exam.questions.map((q,qi)=>{
    const given = answers[qi];
    const correct = q.correct;
    const isRight = given === correct;
    const givenLabel = (given===null||given===undefined) ? 'উত্তর দেওনি' : `${['ক','খ','গ','ঘ'][given]}) ${escapeHtml(q.options[given])}`;
    const correctLabel = `${['ক','খ','গ','ঘ'][correct]}) ${escapeHtml(q.options[correct])}`;
    return `<div class="review-block">
      <div class="q-text" style="font-size:14px;">${qi+1}. ${escapeHtml(q.text)}</div>
      <div class="review-ans ${isRight?'right':'wrong'}">তুমি দিয়েছিলে: ${givenLabel} ${isRight?'✓':'✗'}</div>
      ${!isRight ? `<div class="review-ans right">সঠিক উত্তর: ${correctLabel}</div>` : ''}
    </div>`;
  }).join('');
}

window.importTopicsBulk = async function(subject, sectionKey, maxCount){
  const raw = document.getElementById('topicBulkText').value;
  if(!raw.trim()){ toast('আগে টেক্সট পেস্ট করো'); return; }
  const blocks = raw.split(/\n(?=##\s)/).map(b=>b.trim()).filter(Boolean);
  const parsed = [];
  for(const block of blocks){
    const lines = block.split('\n');
    const headerLine = lines[0].replace(/^##\s*/, '').trim();
    const content = lines.slice(1).join('\n').trim();
    if(headerLine) parsed.push({ name: headerLine, content });
  }
  if(parsed.length === 0){ toast('কোনো অধ্যায় পার্স করা যায়নি, ফরম্যাট চেক করো'); return; }
  const toSave = parsed.slice(0, maxCount);
  toast(`${toSave.length}টা অধ্যায় সেভ হচ্ছে...`);
  for(let i=0;i<toSave.length;i++){
    const key = `${subject}_${sectionKey}_${i+1}`;
    await saveTopicRemote(key, toSave[i].name, toSave[i].content);
  }
  toast(`${toSave.length}টা অধ্যায় সেভ হয়েছে ✅`);
  go('topicsManageChapters', { subject, sectionKey });
}

function labelForCouponExamCode(examCode){
  if(String(examCode).indexOf('MONTHLY:') === 0){
    const monthKey = examCode.slice(8); // 'yyyy-MM'
    const [y, m] = monthKey.split('-');
    return `${BN_MONTHS[Number(m)-1] || m} ${y} (মাসিক রিওয়ার্ড)`;
  }
  if(String(examCode).indexOf('CUT:') === 0) return 'কাট (মিস দিন / API বিল)';
  if(String(examCode).indexOf('PERIOD:') === 0){

    return `কোড এক্সাম রিওয়ার্ড (${p[0]} থেকে ${p[1]})`;
  }
  return examCode;

function buildMiniCalendar(year, month, records, onDayClickFn, navTargetScreen, navCtx, hwMap){
  window.__calNavCtx = navCtx; // stash instead of inlining (names/records could contain quotes)
  const recByDate = {};
  records.forEach(r=> recByDate[r.date] = r);
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayS = todayStr();

  let cells = '';
  for(let i=0;i<startWeekday;i++){ cells += `<div></div>`; }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = recByDate[dateStr];
    let bg = '#F5F9FE', color = 'var(--ink)', border = '1px solid var(--rule)';
    if(rec){
      if(rec.source === 'exam'){ bg = '#3B82F6'; color = '#fff'; border = 'none'; }        // blue: confirmed by taking an exam
      else if(rec.status === 'approved'){ bg = 'var(--green)'; color = '#fff'; border = 'none'; } // green: manually confirmed by student
      else if(rec.status === 'pending'){ bg = 'var(--gold)'; color = '#3a2a06'; border = 'none'; } // gold: awaiting student confirmation
    }
    const isToday = dateStr === todayS;
    const clickable = onDayClickFn ? `onclick="${onDayClickFn}('${dateStr}')" style="cursor:pointer;` : `style="cursor:default;`;
    const hw = hwMap && hwMap[dateStr];   // শিক্ষকের ক্যালেন্ডারে HW (গোলাপি) ও রিভিশন (বেগুনি) ফোঁটা; কিছু মিস হলে গাঢ় লাল দাগ
    const dotCss = c => `width:6px;height:6px;border-radius:50%;background:${c};border:1px solid #fff;`;
    const hwDot = hw ? `<span style="position:absolute;bottom:2px;left:50%;transform:translateX(-50%);display:flex;gap:2px;">${hw.hw ? `<i style="${dotCss('#EC4899')}"></i>` : ''}${hw.rev ? `<i style="${dotCss('#7C3AED')}"></i>` : ''}</span>` : '';
    cells += `<div ${clickable} position:relative; background:${bg}; color:${color}; border:${border}; ${isToday?'outline:2px solid var(--margin-red);':''}${hw && hw.missed ? 'box-shadow:inset 0 0 0 2px #7F1D1D;' : ''} border-radius:7px; display:flex; align-items:center; justify-content:center; height:34px; font-size:13px; font-family:var(--font-mono);">${d}${hwDot}</div>`;
  }

  const prevM = month===0 ? 11 : month-1;
  const prevY = month===0 ? year-1 : year;
  const nextM = month===11 ? 0 : month+1;
  const nextY = month===11 ? year+1 : year;

  return `
    <div class="card" style="padding:16px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <a class="link-back" onclick="goCalNav(${prevY},${prevM},'${navTargetScreen}')">‹</a>
        <b style="font-family:var(--font-display); font-size:16px;">${BN_MONTHS[month]} ${year}</b>
        <a class="link-back" onclick="goCalNav(${nextY},${nextM},'${navTargetScreen}')">›</a>
      </div>
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:6px;">
        ${BN_WEEKDAYS.map(w=>`<div style="text-align:center; font-size:11px; color:var(--pencil); font-weight:600;">${w}</div>`).join('')}
      </div>
      <div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px;">
        ${cells}
      </div>
      <div style="margin-top:12px; font-size:12px; color:var(--pencil); display:flex; gap:14px; flex-wrap:wrap;">
        <span>🟦 exam দিয়ে confirm</span><span>🟩 নিজে confirm করেছে</span><span>🟨 confirm করার অপেক্ষায়</span>${hwMap ? '<span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#EC4899;vertical-align:1px;"></i> HW</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7C3AED;vertical-align:1px;"></i> রিভিশন</span><span style="box-shadow:inset 0 0 0 2px #7F1D1D;border-radius:4px;padding:0 4px;">⚠️ মিস</span>' : ''}
      </div>
    </div>
  `;
}
window.__calYear = null; window.__calMonth = null;
window.goCalNav = function(y, m, targetScreen){
  window.__calYear = y; window.__calMonth = m;
  go(targetScreen, window.__calNavCtx);
}

async function renderAttendanceMark(slug, studentName, records){
  app.innerHTML = `${header('উপস্থিতি মার্ক করো')}<div class="card center">লোড হচ্ছে...</div>`;
  records = records || await listAttendanceRemote(slug);
  const now = new Date();
  const year = window.__calYear !== null ? window.__calYear : now.getFullYear();
  const month = window.__calMonth !== null ? window.__calMonth : now.getMonth();
  window.__calYear = year; window.__calMonth = month;

  const curMonthKey = todayStr().slice(0,7);
  const approvedThisMonth = records.filter(r=> (r.status==='approved' || r.source==='exam') && monthKeyOf(r.date)===curMonthKey).length;

  // সবার জন্য দেওয়া HW + ছাত্রের নিজের HW — শিক্ষকের ক্যালেন্ডারেও দেখাও (planCalendar একই ডেটা দেয়)
  let hwEv = [];
  try{
    const pc = await postToScriptRaw('planCalendar', { slug, month:`${year}-${String(month+1).padStart(2,'0')}`, today:todayStr() });
    if(pc && pc.status === 'success') hwEv = (pc.events || []).filter(e => e.type === 'hw' || e.type === 'rev').sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  }catch(err){}
  const hwMap = {};
  hwEv.forEach(e => { const c = hwMap[e.date] = hwMap[e.date] || {}; c[e.type] = true; if(e.status === 'missed') c.missed = true; });
  const hwSt = { done:'✅ জমা হয়েছে', todo:'⏳ বাকি', missed:'⚠️ মিস' };
  const hwListHtml = `<div class="card"><h3>📚 এই মাসের HW ও রিভিশন</h3>${hwEv.length ? hwEv.map(e => `<div class="exam-item" style="border-left:5px solid ${e.type === 'rev' ? '#7C3AED' : '#EC4899'};"><div class="row-top"><div><div style="font-weight:700;">${e.type === 'rev' ? '🟪 রিভিশন · ' : '🩷 HW · '}${escapeHtml(e.title)}${e.all ? ' <span style="font-size:11px;background:#FCE7F3;color:#9D174D;padding:1px 7px;border-radius:10px;font-weight:600;">সবার জন্য</span>' : ''}</div><div class="meta">${e.date} · ${hwSt[e.status] || ''}</div></div></div></div>`).join('') : '<div class="empty-state">এই মাসে কোনো HW বা রিভিশন নেই।</div>'}</div>`;
  const calHtml = buildMiniCalendar(year, month, records, 'teacherToggleDay', 'attendanceMark', { slug, studentName }, hwMap);
  state.records = records; // stash so teacherToggleDay can inspect the clicked day's current state
  const planCardHtml = !FEATURE_CLASS_PLAN ? '' : await buildClassPlanCard(slug, `${year}-${String(month+1).padStart(2,'0')}`, year, month); // [NEW]

  app.innerHTML = `
    ${header('উপস্থিতি মার্ক করো')}
    <div class="card center">
      <h2>${escapeHtml(studentName)}</h2>
      <p class="hint">ফাঁকা দিনে ক্লিক করলে মার্ক হবে। ইতিমধ্যে মার্ক করা দিনে ক্লিক করলে বাতিল করার অপশন আসবে। এই মাসে অনুমোদিত: <b>${approvedThisMonth}</b>টা।</p>
    </div>
    ${planCardHtml}
    ${calHtml}
    ${hwListHtml}
    <div class="center"><a class="link-back" onclick="go('attendanceDashboard')">← স্টুডেন্ট তালিকায় ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}
window.teacherToggleDay = async function(dateStr){
  const { slug, studentName, records } = state;
  const existing = (records||[]).find(r=> r.date === dateStr);
  if(existing){
    if(!confirm(`${dateStr} তারিখের উপস্থিতি বাতিল করতে চাও?`)) return;
    toast('বাতিল করা হচ্ছে...');

    toast('বাতিল হয়েছে');

    if(ok) toast('মার্ক হয়েছে ✅');

  go('attendanceMark', { slug, studentName, records: freshRecords });
}

async function getAllFAQ(){
  try{
    const r = await fetch(`${SCRIPT_URL}?action=listFAQ`);
    const json = await r.json();
    if(json.status==='success') return json.data;
  } catch(e){}
  return [];
}
async function getAllFAQCombined(){
  const sheetItems = await getAllFAQ();
  return [...DEFAULT_FAQ, ...sheetItems];
}
async function saveFAQRemote(id, question, answer){
  const res = await postToScript('saveFAQ', { id: id||'', question, answer });
  return res;
}
async function deleteFAQRemote(id){
  try{ await fetch(`${SCRIPT_URL}?action=deleteFAQ&id=${encodeURIComponent(id)}`); }catch(e){}
}

    </div>`).join('');
  let rows = items.map((it,idx)=> `

      <h3 style="margin-bottom:6px;">${escapeHtml(it.question)}</h3>
      <div class="row">
        <button class="btn btn-outline" onclick="go('faqEdit',{id:'${it.id}'})">✏️ এডিট করো</button>

      <h2>সব প্রশ্নোত্তর</h2>
      <p class="hint">সাধারণ জ্ঞান, ভর্তি সংক্রান্ত তথ্য, বা যেকোনো গুরুত্বপূর্ণ প্রশ্ন-উত্তর এখানে যোগ করো — স্টুডেন্টরা মূল পাতা থেকে "❓ সাধারণ জিজ্ঞাসা"-তে গিয়ে দেখতে পারবে।</p>

window.deleteFAQItem = async function(id){
  if(!confirm('এই প্রশ্নোত্তরটা মুছে ফেলতে চাও?')) return;
  await deleteFAQRemote(id);
  toast('মুছে ফেলা হয়েছে');
  go('faqManage');
}
async function renderFAQEdit(id){
  let question = '', answer = '';
  if(id){
    const items = window.__faqItems && window.__faqItems.length ? window.__faqItems : await getAllFAQ();
    const it = items.find(x=> x.id === id);
    if(it){ question = it.question; answer = it.answer; }
  }
  app.innerHTML = `
    ${header('প্রশ্নোত্তর')}
    <div class="card">
      <h2>${id ? 'এডিট করো' : 'নতুন প্রশ্নোত্তর'}</h2>
      <label class="field-label">প্রশ্ন</label>
      <input type="text" id="faqQ" value="${escapeHtml(question)}" placeholder="যেমন: IUT কি প্রাইভেট বিশ্ববিদ্যালয়?">
      <label class="field-label">উত্তর (রেফারেন্সসহ লিখতে পারো)</label>
      <textarea id="faqA" style="min-height:260px;" placeholder="বিস্তারিত উত্তর লেখো...">${escapeHtml(answer)}</textarea>
      <button class="btn btn-primary btn-block" onclick="saveFAQItem('${id||''}')">✅ সেভ করো</button>
    </div>
    <div class="center"><a class="link-back" onclick="go('faqManage')">← ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}
window.saveFAQItem = async function(id){
  const question = document.getElementById('faqQ').value.trim();
  const answer = document.getElementById('faqA').value.trim();
  if(!question || !answer){ toast('প্রশ্ন ও উত্তর দুটোই লেখো'); return; }
  toast('সেভ হচ্ছে...');
  await saveFAQRemote(id, question, answer);
  toast('সেভ হয়েছে ✅');
  go('faqManage');
}

window.editNoteItem = function(idx){

window.deleteNoteItem = async function(id, subject){

  toast('মুছে ফেলা হয়েছে');

function renderNotesEdit(subject, noteId, mode, existingTitle, existingContent){
  const isHtml = mode === 'html';
  app.innerHTML = `
    ${header('নোট/স্লাইড')}
    <div class="card">
      <h2>${noteId ? 'এডিট করো' : (isHtml ? 'নতুন HTML স্লাইড' : 'নতুন লিংক')}</h2>

      ${isHtml ? `
        <label class="field-label">HTML কোড / স্লাইড কনটেন্ট</label>
        <p class="hint">সরাসরি HTML লিখতে/পেস্ট করতে পারো (হেডিং, বোল্ড, ছবি, টেবিল ইত্যাদি)। একাধিক স্লাইড বানাতে চাইলে প্রতিটা স্লাইডের মাঝে একটা আলাদা লাইনে <code>---</code> লিখে ভাগ করো।</p>
        <textarea id="noteContent" style="min-height:280px; font-family:var(--font-mono); font-size:13px;" placeholder="<h2>শিরোনাম</h2>&#10;<p>এখানে কনটেন্ট লেখো...</p>&#10;&#10;---&#10;&#10;<h2>দ্বিতীয় স্লাইড</h2>&#10;<p>...</p>">${escapeHtml(existingContent||'')}</textarea>
      ` : `
        <label class="field-label">লিংক (Google Drive/Slides শেয়ার লিংক)</label>
        <input type="text" id="noteContent" value="${escapeHtml(existingContent||'')}" placeholder="https://drive.google.com/...">
      `}
      <button class="btn btn-primary btn-block" onclick="saveNoteItem('${subject}','${noteId||''}','${mode}')">✅ সেভ করো</button>
    </div>
    <div class="center"><a class="link-back" onclick="go('notesManageSubject',{subject:'${subject}'})">← ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}
window.saveNoteItem = async function(subject, noteId, mode){
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteContent').value.trim();
  if(!title || !content){ toast('শিরোনাম ও কনটেন্ট দুটোই দাও'); return; }
  toast('সেভ হচ্ছে...');
  await saveNoteRemote(noteId, subject, title, mode, content);
  toast('সেভ হয়েছে ✅');
  go('notesManageSubject', { subject });
}

window.viewNoteSlide = function(idx){
  const { subject, items } = window.__notesListCtx;
  const n = items[idx];
  const slides = n.content.split(/\n\s*---\s*\n/);
  go('notesSlideView', { subject, title: n.title, slides, slideIndex: 0 });
}
function renderNotesSlideView(subject, title, slides, slideIndex){
  const total = slides.length;
  app.innerHTML = `
    ${header('ক্লাস নোট / স্লাইড')}
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <h2 style="margin-bottom:0;">${escapeHtml(title)}</h2>
        ${total>1 ? `<span class="q-tag">${slideIndex+1} / ${total}</span>` : ''}
      </div>
      <div id="slideFrame" style="border:1px solid var(--paper-edge); border-radius:8px; padding:18px; min-height:200px; background:#fff;">${slides[slideIndex]}</div>
      ${total>1 ? `
      <div class="row" style="margin-top:14px;">
        <button class="btn btn-outline btn-block" ${slideIndex===0?'disabled':''} onclick="goNoteSlideNav(${slideIndex-1})">← আগের স্লাইড</button>
        <button class="btn btn-outline btn-block" ${slideIndex===total-1?'disabled':''} onclick="goNoteSlideNav(${slideIndex+1})">পরের স্লাইড →</button>
      </div>` : ''}
    </div>
    <div class="center"><a class="link-back" onclick="go('notesList',{subject:'${subject}'})">← তালিকায় ফিরে যাও</a></div>
    ${creditFooter()}
  `;
}
window.goNoteSlideNav = function(newIndex){
  state.slideIndex = newIndex;
  renderNotesSlideView(state.subject, state.title, state.slides, newIndex);
}

window.importMasteryBulk = async function(){
  const { courseId } = window.__masteryCourseCtx;
  const raw = document.getElementById('masteryBulkText').value;
  if(!raw.trim()){ toast('আগে টেক্সট পেস্ট করো'); return; }
  const topicBlocks = raw.split(/\n(?=##\s)/).map(b=>b.trim()).filter(Boolean);
  const letterMap = {'A':0,'B':1,'C':2,'D':3,'ক':0,'খ':1,'গ':2,'ঘ':3,'a':0,'b':1,'c':2,'d':3};
  const parsedTopics = [];
  for(const tblock of topicBlocks){
    const lines = tblock.split('\n');
    const topicTitle = lines[0].replace(/^##\s*/, '').trim();
    const rest = lines.slice(1).join('\n');
    const qBlocks = rest.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
    const questions = [];
    for(const block of qBlocks){
      const qlines = block.split('\n').map(l=>l.trim()).filter(Boolean);
      let qtext='', options=['','','',''], correct=0, image='';
      for(const line of qlines){
        const qm = line.match(/^Q[:.]?\s*(.*)$/i);
        const om = line.match(/^([A-Dকখগঘ])[).]\s*(.*)$/i);
        const am = line.match(/^ANS[:.]?\s*([A-Dকখগঘ])/i);
        const im = line.match(/^IMG[:.]?\s*(.*)$/i);
        if(qm){ qtext = qm[1]; }
        else if(im){ image = im[1].trim(); }
        else if(om){ const idx = (om[1] in letterMap) ? letterMap[om[1]] : letterMap[om[1].toUpperCase()]; options[idx] = om[2].trim(); }
        else if(am){ correct = (am[1] in letterMap) ? letterMap[am[1]] : letterMap[am[1].toUpperCase()]; }
      }
      if(qtext && options.every(o=>o)) questions.push({ text: qtext, options, correct, image });
    }
    if(topicTitle && questions.length>0) parsedTopics.push({ title: topicTitle, questions });
  }
  if(parsedTopics.length===0){ toast('কোনো টপিক পার্স করা যায়নি, ফরম্যাট চেক করো'); return; }
  const existing = await getMasteryTopics(courseId);
  let nextOrder = existing.length + 1;
  toast(`${parsedTopics.length}টা টপিক সেভ হচ্ছে...`);
  for(const t of parsedTopics){
    await saveMasteryTopicRemote(courseId, nextOrder, t.title, t.questions, MASTERY_PASS_PERCENT);
    nextOrder++;
  }
  toast(`${parsedTopics.length}টা টপিক সেভ হয়েছে ✅`);
  go('masteryManageCourse');
}

function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        const base64 = dataUrl.split(',')[1];
        resolve({ base64, mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function safeCouponBalance(data){
  if(data && data.balance !== null && data.balance !== undefined && isFinite(Number(data.balance))) return Number(data.balance);
  return ((data && data.history) || []).filter(h=> h.status !== 'settled').reduce((a,h)=> a + (Number(h.amount)||0), 0);
}

function rewardBase(p){ p = Math.round(Number(p)); return (!isFinite(p) || p <= 0) ? 0 : Math.min(100, p); }   // শতকরা অংশ
function rewardAmount(p, max){ return Math.round(rewardBase(p) / 100 * (Number(max) || 0)); }   // টাকা = % × সর্বোচ্চ

window.finalizeOneReward = async function(i){
  const s = (window.__rewardRows || [])[i]; if(!s) return;
  const max = parseInt((document.getElementById('rwMax' + i) || {}).value, 10) || 0;
  if(max <= 0){ toast('আগে এই ছাত্রের জন্য সর্বোচ্চ টাকা বাছো'); return; }
  if(!confirm(`${s.name}: ${s.examCount}টা exam, মোট ${s.percent}% → ৳${rewardAmount(s.percent, max)} (১০০%-এ সর্বোচ্চ ৳${max})।\nফাইনালাইজ করলে এই পর্যন্ত exam গোনা শেষ হবে, পরের রিওয়ার্ড নতুন exam থেকে শুরু। এগোবে?`)) return;
  toast('ফাইনালাইজ হচ্ছে...');
  const res = await postToScriptRaw('finalizePeriodReward', { slug: s.slug, maxAmount: max });
  if(res && res.status === 'success'){ toast(`✅ ${s.name}-কে ৳${res.amount} দেওয়া হয়েছে`); renderMonthlyReward(); }
  else toast(res && res.message === 'no_exams' ? 'গোনার মতো নতুন exam নেই' : 'ফাইনালাইজ করা যায়নি, আবার চেষ্টা করো');
};
window.finalizeAllRewards = async function(){
  const rows = window.__rewardRows || [];
  const amounts = {};
  let missing = [];
  rows.forEach((s, i)=>{
    if(s.examCount === 0) return;
    const max = parseInt((document.getElementById('rwMax' + i) || {}).value, 10) || 0;
    if(max > 0) amounts[s.slug] = max; else missing.push(s.name);
  });
  if(missing.length){ toast('এদের টাকা বাছো: ' + missing.join(', ')); return; }
  const n = Object.keys(amounts).length;
  if(!n){ toast('কেউ নেই'); return; }
  if(!confirm(`${n} জনের রিওয়ার্ড (প্রত্যেকের নিজের বাছা সর্বোচ্চ টাকা অনুযায়ী) একসাথে ফাইনালাইজ করবে। এগোবে?`)) return;
  toast('ফাইনালাইজ হচ্ছে...');
  const res = await postToScriptRaw('finalizePeriodRewardsForAll', { amounts: JSON.stringify(amounts) });
  if(res && res.status === 'success'){ toast(`${res.studentCount} জনকে মোট ৳${res.totalAwarded} দেওয়া হয়েছে ✅`); renderMonthlyReward(); }
  else toast('ফাইনালাইজ করা যায়নি, আবার চেষ্টা করো');
};

function parseWrittenBulk(raw){
  const blocks = raw.split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const questions = [];
  for(const block of blocks){
    const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
    const q = { text:'', imageUrl:'', modelAnswerText:'', modelAnswerImageUrl:'', marks:5, markingScheme:'' };
    let cur = null; // কোন ফিল্ডে আছি — কী ছাড়া পরের লাইন হলে সেটাতেই জুড়ে যাবে (একাধিক লাইনের উত্তর/নম্বর বণ্টনের জন্য)
    for(const line of lines){
      let m;
      if((m = line.match(/^Q[:.]\s*(.*)$/i)) || (m = line.match(/^Q\s+(.*)$/i))){ q.text = m[1]; cur = 'text'; }
      else if((m = line.match(/^QIMG[:.]?\s*(.*)$/i))){ q.imageUrl = m[1].trim(); cur = null; }
      else if((m = line.match(/^MODEL[:.]?\s*(.*)$/i))){ q.modelAnswerText = m[1]; cur = 'modelAnswerText'; }
      else if((m = line.match(/^MIMG[:.]?\s*(.*)$/i))){ q.modelAnswerImageUrl = m[1].trim(); cur = null; }
      else if((m = line.match(/^MARKS[:.]?\s*(\d+(?:\.\d+)?)/i))){ q.marks = parseFloat(m[1]); cur = null; }
      else if((m = line.match(/^(?:RUBRIC|SCHEME|নম্বর\s*বণ্টন)[:.]?\s*(.*)$/i))){ q.markingScheme = m[1]; cur = 'markingScheme'; }
      else if(cur){ q[cur] += '\n' + line; }
    }
    if(q.text || q.imageUrl){ questions.push(q); }
  }
  return questions;
}

function percentToMarks(percent, maxMarks){ maxMarks = Number(maxMarks) || 5; return Math.round((percent/100)*maxMarks*2)/2; } // nearest 0.5

          <div style="margin-top:8px; padding:10px; background:#F5F9FE; border-radius:8px; font-size:13px;">

            ${q.modelAnswerText ? `<div style="margin-top:6px;"><b>মডেল উত্তর:</b> ${escapeHtml(q.modelAnswerText)}</div>` : ''}

            ${q.markingScheme ? `<div style="margin-top:6px;"><b>নম্বর বণ্টন:</b> ${escapeHtml(q.markingScheme)}</div>` : ''}
          </div>
        </details>
        <a href="${escapeHtml(s.driveUrl)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="margin-bottom:8px;">🖼️ ছাত্রের খাতার ছবি দেখো</a>
        <div class="review-ans wrong">🤖 ${marks}/${maxMarks} নম্বর (AI ${s.percent}%) — ${escapeHtml(s.aiFeedback||'')}</div>
        <div class="row" style="margin-top:6px;">

    }).join('');
    return `<div class="exam-item">
      <h3 style="margin-bottom:4px;">${escapeHtml(list[0].studentName)}</h3>

window.startWrittenExam = async function(){
  const name = document.getElementById('wStudName').value.trim();
  const code = document.getElementById('wCode').value.trim().toUpperCase();
  const pass = document.getElementById('wPass').value.trim().toUpperCase();
  if(!name || !code || !pass){ toast('সবগুলো পূরণ করো'); return; }
  toast('খোঁজা হচ্ছে...');
  const q = await getWrittenQuestionByCode(code);
  if(!q){ toast('এই কোডে কোনো exam পাওয়া যায়নি'); return; }
  // compare as text, defensively, in case a password ever ends up stored/read as a different type
  if(String(pass).trim().toUpperCase() !== String(q.treatPassword).trim().toUpperCase()){ toast('পাসওয়ার্ড ভুল হয়েছে'); return; }

  const slug = slugify(name);
  // this is a Treat exam tied to money - block re-entry once this name has fully
  // completed it before; if partially done, resume exactly where they left off
  const [mySubs, finalSlugs] = await Promise.all([getWrittenSubmissionsRemote(code), getWrittenFinalsRemote(code)]);
  const mine = mySubs.filter(s=> s.slug === slug);
  const answered = {};
  mine.forEach(s=>{ answered[s.questionIndex] = { percent: s.percent, aiFeedback: s.aiFeedback }; });
  if(Object.keys(answered).length >= q.questions.length || finalSlugs.indexOf(slug) !== -1){
    let totalMarks = 0, earnedMarks = 0;
    q.questions.forEach((qq,i)=>{
      const m = Number(qq.marks) || 5;
      totalMarks += m;
      if(answered[i]) earnedMarks += percentToMarks(answered[i].percent, m);
    });
    go('treatBlocked', { exam: { title: q.title, isWritten: true }, attempt: { score: earnedMarks, total: totalMarks } });
    return;
  }
  let timer = null;
  if(Number(q.timeLimit) > 0){
    if(!confirm(`এই পরীক্ষায় সময় ${q.timeLimit} মিনিট। "OK" চাপলেই টাইমার চালু হবে (আগে শুরু করে থাকলে আগের টাইমারই চলবে, রিফ্রেশ করলেও থামবে না)। সময় শেষ হলে যে প্রশ্নের ছবি বাছা থাকবে সেগুলো নিজে থেকেই জমা হয়ে যাবে। শুরু করবে?`)) return;
    const t = await postToScriptRaw('startWrittenTimer', { code, slug });
    if(!t || t.status !== 'success' || !t.startedAt){ toast('টাইমার চালু করা যায়নি, আবার চেষ্টা করো'); return; }
    timer = { endAt: Number(t.startedAt) + Number(q.timeLimit) * 60000, offset: Number(t.now) - Date.now() };
  }
  window.__writtenSolveCtx = { exam: q, slug, name, answered, timer };
  go('writtenSolve', { exam: q, slug, name });
}
function renderWrittenSolve(exam, slug, name){
  if(!window.__writtenSolveCtx || window.__writtenSolveCtx.exam.code !== exam.code){
    window.__writtenSolveCtx = { exam, slug, name, answered: {} };
  }
  redrawWrittenSolve();
}
function redrawWrittenSolve(){
  const { exam, answered } = window.__writtenSolveCtx;
  const total = exam.questions.length;
  const doneCount = Object.keys(answered).length;
  const totalMarksAll = exam.questions.reduce((a,qq)=> a + (Number(qq.marks)||5), 0);
  const qHtml = exam.questions.map((q,idx)=>{
    const done = answered[idx];
    const maxMarks = Number(q.marks) || 5;
    const marks = done ? percentToMarks(done.percent, maxMarks) : null;
    return `<div class="q-block">
      <div class="q-text">${idx+1}. ${escapeHtml(q.text||'')} <span class="q-tag">${maxMarks} নম্বর</span></div>
      ${q.imageUrl ? `<img src="${driveImg(q.imageUrl)}" style="max-width:100%; border-radius:8px; margin-bottom:10px;" alt="প্রশ্নের ছবি">`:''}
