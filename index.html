      blocks = raw.replace(/\r/g, '').split(/\n(?=\s*(?:Q\s*\d*\s*[:.]|(?:প্রশ্ন\s*)?[\d০-৯]+\s*[.)।]\s))/i).map(x => x.trim()).filter(Boolean);
    }
    return blocks;
  }

    const arr = bqSplitBlocks(raw).map(bqParseOne).filter(o => o.text || o.ok);

    const noOpt = arr.filter(o => !o.ok).length, noAns = arr.filter(o => o.ok && o.correct < 0).length;
    bqAddParsed(arr); ta.value = '';
    st.innerHTML = `✅ ${arr.length}টা প্রশ্ন নিচে কার্ড হয়েছে।` + (noOpt ? ` <span style="color:var(--red)">⚠️ ${noOpt}টায় ৪টা অপশন ধরা যায়নি — হাতে ঠিক করো বা 🤖 AI দিয়ে চেষ্টা করো।</span>` : '') + (noAns ? ` <span style="color:#9B6A15">⚠️ ${noAns}টায় সঠিক উত্তর পাওয়া যায়নি — বেছে দাও।</span>` : '');
  };
  window.bqMcqAi = async function(){
    const ta = document.getElementById('rtBulkTxt'), st = document.getElementById('rtBulkSt'), b = document.getElementById('rtBulkAi'), raw = (ta || {}).value || '';
    if(!raw.trim()){ toast('আগে MCQ-গুলো পেস্ট করো'); return; }
    b.disabled = true; st.textContent = '🤖 AI আলাদা করছে...';
    const res = await postToScriptRaw('revisionBankParse', { text:raw });
    b.disabled = false;
    if(res && res.status === 'success'){
      bqAddParsed(res.data.map(o => ({ text:o.text, opts:o.options, correct:o.correct }))); ta.value = '';
      const noAns = res.data.filter(o => o.correct < 0).length;
      st.innerHTML = `✅ AI ${res.data.length}টা প্রশ্ন বের করেছে — নিচে মিলিয়ে দেখো।` + (noAns ? ` <span style="color:#9B6A15">⚠️ ${noAns}টায় সঠিক উত্তর বেছে দাও।</span>` : '');
    } else st.textContent = '❌ AI এখন পারছে না (কোটা শেষ?) — "কার্ডে ভাগ করো" চাপো বা পরে চেষ্টা করো।';
  };

  // ---- ছবি থেকে MCQ বের করে Q:/A)/ANS: ফরম্যাটে টেক্সটবক্সে বসানো (দেখে-ঠিক-করে তারপর ইম্পোর্ট) ----
  const imgMcqFmt = o => 'Q: ' + o.text + (o.tag ? ' [' + o.tag + ']' : '') + '\n' + o.options.map((x, j) => 'ABCD'[j] + ') ' + x).join('\n') + '\nANS: ' + 'ABCD'[o.correct];
  async function imgMcqRun(files, taId, stId){
    const ta = document.getElementById(taId), st = document.getElementById(stId); if(!ta || !st || !files.length) return;
    const lines = []; let total = 0, solved = 0;
    for(let i = 0; i < files.length; i++){
      st.innerHTML = lines.join('') + `<div>⏳ ছবি ${i + 1}/${files.length} পড়া হচ্ছে... পেজ বন্ধ কোরো না</div>`;
      let c; try{ c = await compressImageFile(files[i], 1600, 0.85); }catch(e){ lines.push(`<div style="color:var(--red)">❌ ছবি ${i + 1}: পড়া যায়নি</div>`); continue; }
      const res = await postToScriptRaw('revisionMcqFromImage', { imageBase64:c.base64, imageMimeType:c.mimeType });
      if(res && res.status === 'success'){
        const txt = res.data.map(imgMcqFmt).join('\n\n');
        ta.value = (ta.value.trim() ? ta.value.replace(/\s+$/, '') + '\n\n' : '') + txt;
        total += res.data.length; const sv = res.data.filter(o => !o.marked).length; solved += sv;
        lines.push(`<div style="color:var(--green)">✅ ছবি ${i + 1}: ${res.data.length}টা প্রশ্ন</div>`);
      } else lines.push(`<div style="color:var(--red)">❌ ছবি ${i + 1}: ${res && res.message === 'ai_unavailable' ? 'AI এখন পারছে না, পরে চেষ্টা করো' : 'প্রশ্ন বোঝা যায়নি — আরও পরিষ্কার ছবি দাও'}</div>`);
    }
    st.innerHTML = lines.join('') + (total ? `<div class="meta">মোট ${total}টা প্রশ্ন উপরের বক্সে বসেছে।${solved ? ` <span style="color:#9B6A15">⚠️ ${solved}টায় ছবিতে উত্তর চিহ্নিত ছিল না, AI নিজে সমাধান করেছে — ANS লাইনগুলো মিলিয়ে নাও।</span>` : ''} ঠিক থাকলে ইম্পোর্ট চাপো।</div>` : '');
  }
  window.imgMcqFiles = function(taId, stId, inp){ const fs = Array.from(inp.files || []); inp.value = ''; imgMcqRun(fs, taId, stId); };
  window.imgMcqClip = async function(taId, stId){
    try{
      const items = await navigator.clipboard.read(), files = [];
      for(const it of items){ const t = it.types.find(x => x.indexOf('image/') === 0); if(t){ const b = await it.getType(t); files.push(new File([b], 'paste.png', { type:t })); } }
      if(!files.length){ toast('ক্লিপবোর্ডে কোনো ছবি নেই'); return; }
      imgMcqRun(files, taId, stId);
    }catch(e){ toast('ব্রাউজার অনুমতি দেয়নি — "ছবি বাছো" ব্যবহার করো'); }
  };
  window.imgMcqBox = function(taId, stId){
    return `<div style="border:1.5px dashed var(--gold);border-radius:12px;padding:10px;margin:8px 0;">
      <b style="font-size:13.5px;">📷 অথবা MCQ-এর ছবি থেকে সরাসরি বের করো</b>
      <p class="hint" style="margin:4px 0 6px;">ছবি (স্ক্রিনশট/ক্লাসের ফ্রেম, একাধিকও চলে) দিলে AI প্রশ্ন-অপশন-উত্তর বের করে নিচের বক্সে বসিয়ে দেবে। ছবিতে উত্তর চিহ্নিত না থাকলে AI নিজে সমাধান করে — তাই ইম্পোর্টের আগে একবার দেখে নিয়ো।</p>
      <div class="row"><label class="btn btn-gold" style="margin:0;cursor:pointer;">🖼️ ছবি বাছো<input type="file" accept="image/*" multiple style="display:none" onchange="imgMcqFiles('${taId}','${stId}',this)"></label>
      <button class="btn btn-outline" onclick="imgMcqClip('${taId}','${stId}')">📋 ক্লিপবোর্ড থেকে</button></div>
      <div id="${stId}" class="hint" style="margin-top:6px;"></div></div>`;
  };

  window.bqDraw = function(k){
    const box = document.getElementById(BQL[k]); if(!box) return;
    const mcq = k === 'rt' && (document.getElementById('rtType') || {}).value === 'mcq';
    const bb = document.getElementById('rtMcqBulk'); if(bb) bb.style.display = mcq ? 'block' : 'none';
    box.innerHTML = BQ[k].map((it, i) => `<div class="bq-item" data-i="${i}" style="border:1px solid var(--rule);border-radius:12px;padding:10px;margin-bottom:10px;background:#fff;">
      <div style="display:flex;justify-content:space-between;align-items:center;"><b>প্রশ্ন ${i + 1}</b>${BQ[k].length > 1 || it.file || it.text ? `<a class="link-back" onclick="bqDel('${k}',${i})">✕ বাদ দাও</a>` : ''}</div>
      ${it.url ? `<img src="${it.url}" style="max-width:100%;max-height:220px;border-radius:8px;margin:6px 0;display:block;"><a class="link-back" onclick="bqNoImg('${k}',${i})">🗑️ ছবি সরাও</a>`
               : `<label class="field-label" style="margin-top:6px;">ছবি (ঐচ্ছিক — অথবা Ctrl+V)</label><input type="file" accept="image/*" onchange="bqOne('${k}',${i},this)" style="margin-bottom:6px;">`}
      ${k === 'rt' ? `<input type="text" placeholder="এই প্রশ্নের টপিক (ঐচ্ছিক — খালি থাকলে উপরের টপিক)" value="${escapeHtml(it.tag || '')}" oninput="BQ.rt[${i}].tag=this.value" style="margin:6px 0;">` : ''}
      <textarea placeholder="প্রশ্ন (লেখা) — ছবি দিলে ঐচ্ছিক" style="min-height:56px;" oninput="BQ.${k}[${i}].text=this.value">${escapeHtml(it.text)}</textarea>
      ${mcq ? it.opts.map((o, j) => `<input type="text" placeholder="অপশন ${['ক', 'খ', 'গ', 'ঘ'][j]}" value="${escapeHtml(o)}" oninput="BQ.${k}[${i}].opts[${j}]=this.value">`).join('')
              + `<label class="field-label">সঠিক উত্তর</label><select onchange="BQ.${k}[${i}].correct=+this.value">${it.correct < 0 ? '<option value="-1" selected>— বাছো —</option>' : ''}${['ক', 'খ', 'গ', 'ঘ'].map((n, j) => `<option value="${j}" ${it.correct === j ? 'selected' : ''}>${n}</option>`).join('')}</select>`
            : `<textarea placeholder="মডেল উত্তর (ঐচ্ছিক${k === 'as' ? ' — দিলে AI আরও নির্ভুল মেলাবে' : ''})" style="min-height:48px;" oninput="BQ.${k}[${i}].model=this.value">${escapeHtml(it.model)}</textarea>`}
    </div>`).join('');
  };
  window.bqComposerHtml = function(k){
    return `<div id="${k}Zone" tabindex="0" ondragover="event.preventDefault()" ondrop="bqDrop('${k}',event)" style="border:2px dashed var(--rule);border-radius:12px;padding:12px;margin:8px 0;text-align:center;background:#fafbfd;">
        <div style="font-size:13.5px;margin-bottom:8px;">📋 স্ক্রিনশট/ছবি <b>কপি</b> করে এখানে <b>Ctrl+V</b> দাও — একসাথে যতগুলো খুশি, প্রতিটা আলাদা প্রশ্ন হবে।<br>ছবি টেনে এনে ছাড়তেও পারো।</div>
        <div class="row"><button class="btn btn-gold" onclick="bqPasteBtn('${k}')">📋 ক্লিপবোর্ড থেকে পেস্ট</button>
        <label class="btn btn-outline" style="margin:0;cursor:pointer;">🖼️ ছবি বাছো (একাধিক)<input type="file" accept="image/*" multiple style="display:none" onchange="bqFiles('${k}',this)"></label></div></div>
      ${k === 'rt' ? `<div id="rtMcqBulk" style="border:1.5px solid var(--gold);border-radius:12px;padding:10px;margin:8px 0;">
        <b style="font-size:13.5px;">📥 একসাথে অনেক MCQ পেস্ট করো</b>
        <p class="hint" style="margin:4px 0 6px;">পরীক্ষার "দ্রুত ইম্পোর্ট"-এর একই ফরম্যাট (প্রশ্নের মাঝে ফাঁকা লাইন):<br><code>Q: প্রশ্ন লেখো [ট্যাগ]<br>A) অপশন ১<br>B) অপশন ২<br>C) অপশন ৩<br>D) অপশন ৪<br>ANS: A</code><br>[ট্যাগ] দিলে সেটাই ওই প্রশ্নের টপিক হবে (না দিলে উপরের টপিক)। <code>ক) খ) গ) ঘ)</code>, ১. ২. ৩. নম্বর, আর এক লাইনে সব অপশনও চলে।</p>
        ${imgMcqBox('rtBulkTxt', 'rtImgSt')}
        <textarea id="rtBulkTxt" style="min-height:110px;" placeholder="Q: প্রশ্ন লেখো [ট্যাগ]&#10;A) অপশন ১&#10;B) অপশন ২&#10;C) অপশন ৩&#10;D) অপশন ৪&#10;ANS: A&#10;&#10;Q: পরের প্রশ্ন..."></textarea>
        <div class="row"><button class="btn btn-gold" onclick="bqMcqSplit()">✂️ কার্ডে ভাগ করো</button><button class="btn btn-outline" id="rtBulkAi" onclick="bqMcqAi()">🤖 AI দিয়ে ভাগ করো</button></div>
        <div id="rtBulkSt" class="hint" style="margin-top:6px;"></div></div>` : ''}
      <div id="${BQL[k]}"></div>
      <button class="btn btn-outline btn-block" onclick="bqAddBlank('${k}')">➕ আরেকটা প্রশ্ন (লেখা)</button>`;
  };
  // বাল্ক সেভ: একটা একটা করে পাঠায়; ব্যর্থ হলে বাকিগুলো তালিকায় থেকে যায়
  window.bqSendAll = async function(k, mk, onProgress){
    const list = BQ[k].filter(it => it.file || it.text.trim()), done = [];
    for(let i = 0; i < list.length; i++){
      onProgress(i + 1, list.length);
      const params = mk(list[i], i, list.length);
      if(list[i].file){ try{ const c = await compressImageFile(list[i].file, 1200, 0.78); params.imageBase64 = c.base64; params.imageMimeType = c.mimeType; }catch(e){ return { ok:done.length, fail:'ছবি পড়া যায়নি', total:list.length }; } }
      const res = await postToScriptRaw(params.__action, (delete params.__action, params));
      if(!(res && res.status === 'success')) return { ok:done.length, fail:'সেভ হয়নি', total:list.length };
      done.push(list[i]); BQ[k] = BQ[k].filter(x => x !== list[i]);
    }
    return { ok:done.length, fail:'', total:list.length };
  };

  window.revTTag = async function(){
    const b = document.getElementById('revTagBtn'), st = document.getElementById('revTagSt');
    if(b) b.disabled = true;
    let total = 0, remaining = null, guard = 0, err = false, stuck = false, unclass = 0;
    while(guard++ < 30){
      if(st) st.innerHTML = `<p class="hint">🤖 ট্যাগ হচ্ছে... ${total}টা হয়েছে${remaining !== null ? ', বাকি ' + remaining + 'টা' : ''} — পেজ বন্ধ কোরো না</p>`;
      const res = await postToScriptRaw('revisionTagQuestions', {});
      if(!res || res.status !== 'success'){ err = true; break; }
      total += res.tagged; remaining = res.remaining; if(typeof res.unclassified === 'number') unclass = res.unclassified;
      if(res.remaining <= 0) break;
      if((typeof res.progress === 'number' ? res.progress : res.tagged) === 0){ stuck = true; break; }
    }
    if(st) st.innerHTML = err ? `<p class="hint" style="color:var(--red);">❌ সংযোগ বা সার্ভার সমস্যা, আবার চেষ্টা করো।</p>`
      : stuck ? `<p class="hint" style="color:#9B6A15;">⚠️ ${total}টা হয়েছে, বাকি ${remaining}টায় AI এখন পারছে না (কোটা শেষ?) — পরে আবার চাপো।</p>`
      : unclass > 0 ? `<p class="hint" style="color:#9B6A15;">✅ ${total}টা প্রশ্নের বিষয় ঠিক হয়েছে। ⚠️ ${unclass}টা প্রশ্ন AI ধরতে পারেনি (অশ্রেণিবদ্ধ হিসেবে চিহ্নিত) — পরে আবার চাপলে নিজে থেকে আবার চেষ্টা হবে।</p>`
      : `<p class="hint" style="color:var(--green);">✅ ${total}টা প্রশ্নের বিষয় ঠিক হয়েছে। সব প্রশ্ন এখন বিষয় অনুযায়ী আছে।</p>`;
    if(b) b.disabled = false;
  };
  window.revTType = function(){ bqDraw('rt'); };
  window.revTSaveSubs = async function(i){
    const T = window.__revT, s = T.students[i];
    const list = Object.keys(NOTES_SUBJECTS).filter(k => document.getElementById('rtS_' + i + '_' + k).checked);
    const res = await postToScriptRaw('revisionSubjectsSet', { slug:s.slug, subjects:list.join(',') });
    if(res && res.status === 'success'){ T.subMap[s.slug] = list; toast('সেভ হয়েছে ✅'); } else toast('সেভ হয়নি');
  };
  const rtv = id => (document.getElementById(id) || {}).value || '';
  window.revTSave = async function(){
    const type = rtv('rtType'), topic = rtv('rtTopic').trim(), keep = { scope:rtv('rtScope'), subj:rtv('rtSub'), topic, type };
    const list = BQ.rt.filter(it => it.file || it.text.trim());
    if(!topic && list.some(it => !String(it.tag || '').trim())){ toast('টপিক লেখো (অথবা প্রতিটা প্রশ্নে [ট্যাগ] দাও)'); return; }
    if(!list.length){ toast('অন্তত একটা প্রশ্ন (লেখা বা ছবি) দাও'); return; }
    if(type === 'mcq' && list.some(it => it.opts.some(o => !o.trim()))){ toast('MCQ-র চারটা অপশনই দাও'); return; }
    if(type === 'mcq' && list.some(it => it.correct < 0)){ toast('সব MCQ-তে সঠিক উত্তর বেছে দাও'); return; }
    const b = document.getElementById('rtSaveBtn'), st = document.getElementById('rtSaveSt'); b.disabled = true;
    const r = await bqSendAll('rt', it => {
      const payload = type === 'mcq' ? { text:it.text.trim(), options:it.opts.map(o => o.trim()), correct:it.correct } : { text:it.text.trim(), modelAnswerText:it.model.trim(), marks:5 };
      return { __action:'revisionBankSave', slug:keep.scope, subject:keep.subj, topic:String(it.tag || '').trim() || topic, type, payload:JSON.stringify(payload) };
    }, (i, n) => { st.textContent = '⏳ ' + i + '/' + n + ' যোগ হচ্ছে... পেজ বন্ধ কোরো না'; });
    if(r.fail) toast(r.ok + 'টা যোগ হয়েছে, বাকিগুলো ' + r.fail + ' — আবার চাপো'); else toast(r.ok + 'টা যোগ হয়েছে ✅');
    await revTRender();
    ['rtScope', 'rtSub', 'rtTopic', 'rtType'].forEach((id, j) => { const el = document.getElementById(id); if(el) el.value = [keep.scope, keep.subj, keep.topic, keep.type][j]; });   // একই টপিকে আরও দিতে সুবিধা
    bqDraw('rt');
  };
  window.revTGen = async function(){
    const topic = rtv('rtTopic').trim();
    if(!topic){ toast('আগে টপিক লেখো'); return; }
    const b = document.getElementById('rtGenBtn'); b.disabled = true; toast('AI বানাচ্ছে...');
    const res = await postToScriptRaw('revisionBankGen', { slug:rtv('rtScope'), subject:rtv('rtSub'), topic, type:rtv('rtType'), count:rtv('rtN') });
    if(res && res.status === 'success'){ toast(res.saved + 'টা যোগ হয়েছে ✅'); revTRender(); } else { b.disabled = false; toast('AI এখন বানাতে পারেনি, পরে চেষ্টা করো'); }
  };
  window.revTDel = async function(id){
    if(!confirm('মুছে ফেলবে?')) return;
    await postToScriptRaw('revisionBankDelete', { id });
    revTRender();
  };

  // ড্যাশবোর্ডে বাটন (খুঁজে দেখো বাটনের মতোই নিজে বসে যায়)
  function injectRev(){
    const tb = document.querySelector('#app button[onclick*="dailyHwManage"]');
    if(tb && tb.parentElement && !tb.parentElement.querySelector('[data-revt]')){
      const t = document.createElement('button');
      t.className = 'btn btn-outline btn-block'; t.setAttribute('data-revt', '1');
      t.textContent = '🔁 রিভিশন সেটআপ'; t.onclick = revTOpen;
      tb.parentElement.appendChild(t);
    }
  }
  new MutationObserver(injectRev).observe(document.getElementById('app'), { childList:true, subtree:true });
  injectRev();

  const OV_IV = { weak:3, medium:10, easy:30, 'new':14 }, OV_BN = { weak:0.3, medium:0.15, easy:0, 'new':0 }, OV_DAY = 86400000;
  const ovBn = n => String(n).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const ovIc = { weak:'🔴', medium:'🟡', easy:'🟢', 'new':'⚪' }, ovLb = { weak:'দুর্বল', medium:'মাঝারি', easy:'সহজ', 'new':'নতুন' };
  const ovCol = { weak:'#D9534F', medium:'#E0A100', easy:'#3FA66B', 'new':'#9AA5B1' };

  // শিক্ষকের জন্য: AI যে নিয়মে টপিক বাছে সেটাই দিন ধরে ধরে চালিয়ে দেখায় (ছাত্র রোজ যতক্ষণ পড়বে ধরে)
  function ovSim(T, daily, per){
    const now = Date.now();
    const act = T.filter(t => !t.skip).map(t => {
      const p0 = (t.lastTs ? (now - t.lastTs) / OV_DAY / OV_IV[t.level] : 99) + OV_BN[t.level];
      return { t, ls:t.lastTs || 0, rank:t.rank || 0, seen:p0 < 1 };     // এখন due না মানে এই চক্রে আগেই ঘোরা হয়ে গেছে
    });
    const doneToday = act.filter(a => a.t.today).map(a => a.t).sort((x, y) => y.lastTs - x.lastTs);
    const days = []; let left = act.filter(a => !a.seen).length, doneDay = 0;
    for(let d = 0; d < 90 && left > 0; d++){
      const ts = now + d * OV_DAY, picks = []; let budget = daily - (d === 0 ? doneToday.length * per : 0);
      act.forEach(a => { a.p = (a.ls ? (ts - a.ls) / OV_DAY / OV_IV[a.t.level] : 99) + OV_BN[a.t.level]; });
      const bonus = a => (a.p >= 1 && a.rank) ? 1000 - a.rank : 0;
      const order = act.slice().sort((x, y) => (y.p + bonus(y)) - (x.p + bonus(x)));
      const forced = !(d === 0 && doneToday.length);      // আজ আগেই কিছু করা থাকলে বাকি সময় শেষ হলে আর জোর করে যোগ করি না
      for(const a of order){
        if(a.p < 1) break;

        picks.push({ t:a.t, again:a.seen }); budget -= per; a.ls = ts;

        <select id="cvStud" onchange="revCovLoad()"><option value="">— বাছো —</option>${studs.map(s => `<option value="${s.slug}">${escapeHtml(s.name)}</option>`).join('')}</select>
        <label class="field-label">বিষয়</label>

    revCovLoad();
  };
  window.revCovLoad = async function(){
    const C = window.__cov, slug = val('cvStud'), subj = val('cvSubj'), body = document.getElementById('cvBody');
    if(!slug){ body.innerHTML = ''; return; }
    body.innerHTML = `<div class="hint" style="margin-top:10px;">লোড হচ্ছে...</div>`;
    const [tax, res] = await Promise.all([(async () => { const r = await getJson('revisionTaxonomy', {}); return (r && r.status === 'success') ? r.data : []; })(), postToScriptRaw('revisionCoveredGet', { slug })]);
    C.slug = slug; C.subj = subj;
    C.set = new Set(((res && res.leaves) || []).map(lk));
    // taxonomy -> অধ্যায় > টপিক > leaf
    const rows = tax.filter(t => t.subject === subj);
    const chs = [], topics = [];
    uniq(rows.map(t => t.chapter)).forEach(cn => {
      const ch = { name:cn, leaves:[], topics:[] }; chs.push(ch);
      uniq(rows.filter(t => t.chapter === cn).map(t => t.topic)).forEach(tn => {
        const leaves = rows.filter(t => t.chapter === cn && t.topic === tn).map(t => [t.subject, t.chapter, t.topic, t.subtopic || '']);
        const tp = { name:tn, leaves, subs:rows.filter(t => t.chapter === cn && t.topic === tn && t.subtopic).map(t => t.subtopic), ci:chs.length - 1 };
        ch.topics.push(topics.length); topics.push(tp); ch.leaves.push(...leaves);
      });
    });
    C.chs = chs; C.topics = topics;
    revCovDraw();
  };

  const state3 = leaves => { const n = leaves.filter(l => window.__cov.set.has(lk(l))).length; return n === 0 ? 0 : (n === leaves.length ? 2 : 1); };
  function revCovDraw(){
    const C = window.__cov, body = document.getElementById('cvBody'); if(!body) return;
    if(!C.chs.length){ body.innerHTML = `<div class="empty-state" style="margin-top:10px;">এই বিষয়ের কোনো অধ্যায় নেই — আগে "বই TOC / Taxonomy" থেকে তালিকা লোড করো।</div>`; return; }
    const totalT = C.topics.length, doneT = C.topics.filter(t => state3(t.leaves) === 2).length;
    body.innerHTML = `<div class="meta" style="margin:12px 0 8px 0;"><b>${doneT}/${totalT}</b>টা টপিক শেষ · <a class="link-back" onclick="revCovAll(true)">সব শেষ করো</a> · <a class="link-back" onclick="revCovAll(false)">সব খালি করো</a></div>` +
      C.chs.map((ch, ci) => {
        const s = state3(ch.leaves), d = ch.topics.filter(ti => state3(C.topics[ti].leaves) === 2).length;
        return `<details ${C.open[ci] ? 'open' : ''} ontoggle="window.__cov.open[${ci}]=this.open" style="border:1px solid var(--paper-edge);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:${s === 2 ? '#F1FAF4' : '#FCFDFE'};">
          <summary style="cursor:pointer;font-weight:700;">
            <input type="checkbox" ${s === 2 ? 'checked' : ''} data-ind="${s === 1 ? 1 : 0}" onclick="event.stopPropagation()" onchange="revCovToggle('c',${ci},this.checked)" style="display:inline-block;width:auto;margin:0 6px 0 0;">
            ${escapeHtml(ch.name)} <span class="meta" style="font-weight:400;">(${d}/${ch.topics.length})</span></summary>
          ${ch.topics.map(ti => { const t = C.topics[ti], ts = state3(t.leaves);
            return `<div style="margin:6px 0 6px 6px;"><label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer;">
                <input type="checkbox" ${ts === 2 ? 'checked' : ''} onchange="revCovToggle('t',${ti},this.checked)" style="display:inline-block;width:auto;margin:3px 0 0 0;">
                <span>${escapeHtml(t.name)}${ts === 1 ? ' <span class="meta">(আংশিক)</span>' : ''}</span></label>
              ${t.subs.map((sn, si) => { const leaf = t.leaves.find(l => l[3] === sn);
                return `<label style="display:flex;gap:6px;margin:3px 0 0 24px;font-size:13px;cursor:pointer;"><input type="checkbox" ${C.set.has(lk(leaf)) ? 'checked' : ''} onchange="revCovToggle('s',${ti}*1000+${si},this.checked)" style="display:inline-block;width:auto;margin:2px 0 0 0;"><span>${escapeHtml(sn)}</span></label>`; }).join('')}
            </div>`; }).join('')}
        </details>`; }).join('');
    body.querySelectorAll('input[data-ind="1"]').forEach(i => { i.indeterminate = true; });
  }

  window.revCovToggle = async function(kind, idx, on){
    const C = window.__cov; let leaves = [];
    if(kind === 'c') leaves = C.chs[idx].leaves;
    else if(kind === 't') leaves = C.topics[idx].leaves;
    else { const t = C.topics[Math.floor(idx / 1000)], sn = t.subs[idx % 1000]; leaves = t.leaves.filter(l => l[3] === sn); }
    leaves.forEach(l => on ? C.set.add(lk(l)) : C.set.delete(lk(l)));   // সাথে সাথে স্ক্রিনে দেখাও
    revCovDraw();
    const res = await postToScriptRaw('revisionCoveredSet', { slug:C.slug, on:String(on), leaves:JSON.stringify(leaves) });
    if(!res || res.status !== 'success'){
      toast('সেভ হয়নি, আবার চেষ্টা করো');
      leaves.forEach(l => on ? C.set.delete(lk(l)) : C.set.add(lk(l))); revCovDraw();
    }
  };
  window.revCovAll = async function(on){
    const C = window.__cov; if(!C.chs.length) return;
    if(!confirm(on ? 'এই বিষয়ের সব অধ্যায় "শেষ" হিসেবে চিহ্নিত করবে?' : 'এই বিষয়ের সব টিক তুলে নেবে?')) return;
    const leaves = C.chs.flatMap(c => c.leaves);
    leaves.forEach(l => on ? C.set.add(lk(l)) : C.set.delete(lk(l))); revCovDraw();
    const res = await postToScriptRaw('revisionCoveredSet', { slug:C.slug, on:String(on), leaves:JSON.stringify(leaves) });
    toast(res && res.status === 'success' ? 'সেভ হয়েছে ✅' : 'সেভ হয়নি');
  };

  function injectCov(){
    const t = document.querySelector('#app button[data-rx]');
    if(t && t.parentElement && !t.parentElement.querySelector('[data-rxc]')){
      const b = document.createElement('button'); b.className = 'btn btn-outline btn-block'; b.setAttribute('data-rxc', '1');
      b.textContent = '✅ কতদূর পড়ানো হয়েছে'; b.onclick = revCovOpen; t.parentElement.appendChild(b);
    }
  }
  new MutationObserver(injectCov).observe(document.getElementById('app'), { childList:true, subtree:true });
  injectCov();
})();


/* ============ NOTES v3: বিষয় › পত্র › অধ্যায় · PDF অপশন · AI-কে নির্দেশ দিয়ে ঠিক করো (start) ============ */
(function(){
  const bn2n = s => Number(String(s||'').replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d))) || 0;
  const PAPERS = ['১ম পত্র','২য় পত্র','উদ্ভিদবিজ্ঞান','প্রাণিবিজ্ঞান','অন্যান্য (পত্র ঠিক হয়নি)'];
  const OTHER = PAPERS[4];

  // AI যা-ই লিখুক (পুরনো এলোমেলো নামও), পত্র/অধ্যায়/টপিক আলাদা করে নেয়
  window.noteNorm = function(n){
    let ch = String(n.chapter || '').trim(), topic = String(n.topic || '').trim();
    if(ch.indexOf('|') !== -1){
      const parts = ch.split('|').map(s => s.trim()).filter(Boolean).filter(p => !NOTES_SUBJECTS[p.toLowerCase()]);
      const tp = parts.find(p => /^T-?\d+/i.test(p));
      ch = parts.find(p => p !== tp) || parts[0] || '';
      if(!topic && tp) topic = tp;
    }
    let paper = '', m;
    if((m = ch.match(/^\s*([১২])[^\s·]{0,3}\s*পত্র\s*[·•:\-–]*\s*(.*)$/))){ paper = m[1] === '১' ? PAPERS[0] : PAPERS[1]; ch = m[2] || ch; }
    else if((m = ch.match(/^\s*(উদ্ভিদ|প্রাণি)[^·•:\-–]*[·•:\-–]+\s*(.*)$/))){ paper = m[1] === 'উদ্ভিদ' ? PAPERS[2] : PAPERS[3]; ch = m[2] || ch; }
    const cm = ch.match(/অধ্যায়\s*[-–]?\s*([০-৯0-9]+)/);
    return { paper: paper || OTHER, chapter: ch || 'অন্যান্য', topic: topic || 'সাধারণ', chNo: cm ? bn2n(cm[1]) : 999 };
  };

  // ---- ছাত্র: বিষয় › পত্র › অধ্যায় ----
  renderNotesList = async function(subject){
    app.innerHTML = `${header('ক্লাস নোট / স্লাইড')}<div class="card center">লোড হচ্ছে...</div>`;
    const all = await getAllNotes();
    const mine = all.filter(n => n.subject === subject);
    mine.forEach(n => { n._x = noteNorm(n); });
    const papers = PAPERS.filter(p => mine.some(n => n._x.paper === p));
    let paper = state.paper;
    if(paper === undefined && papers.length <= 1) paper = papers[0] || OTHER;
    window.__notesListCtx = { subject, items: mine, paper, papers };
    window.__lastNotesPaper = paper;
    if(paper === undefined){
      const btns = papers.map((p, i) => {
        const c = mine.filter(n => n._x.paper === p).length;
        return `<button class="btn btn-primary btn-block" style="margin-top:8px;" onclick="notesPickPaper(${i})">📘 ${escapeHtml(p)} <span class="meta" style="color:#fff;opacity:.8;">(${c}টা নোট)</span></button>`;
      }).join('');
      app.innerHTML = `${header('ক্লাস নোট / স্লাইড')}
        <div class="card"><h2>${NOTES_SUBJECTS[subject].label}</h2>
          <p class="hint">কোন পত্রের নোট দেখতে চাও?</p>
          ${btns || '<div class="empty-state">এখনো এই বিষয়ে কোনো নোট/স্লাইড যোগ করা হয়নি।</div>'}</div>
        <div class="center"><a class="link-back" onclick="go('notesSubject')">← ফিরে যাও</a></div>${creditFooter()}`;
      return;
    }
    const mineHere = mine.filter(n => n._x.paper === paper);
    app.innerHTML = `${header('ক্লাস নোট / স্লাইড')}
      <div class="card"><h2>${NOTES_SUBJECTS[subject].label}${papers.length > 1 || paper !== OTHER ? ' · ' + escapeHtml(paper) : ''}</h2>
        ${mineHere.length > 4 ? `<input type="text" id="notesSearch" placeholder="🔎 অধ্যায়/টপিক/শিরোনাম খোঁজো" oninput="drawNotesGroups()">` : ''}
        <div id="notesGroups"></div></div>
      <div class="center"><a class="link-back" onclick="${papers.length > 1 ? `go('notesList',{subject:'${subject}'})` : `go('notesSubject')`}">← ফিরে যাও</a></div>${creditFooter()}`;
    drawNotesGroups();
  };
  window.notesPickPaper = function(i){
    const c = window.__notesListCtx; if(!c) return;
    go('notesList', { subject: c.subject, paper: c.papers[i] });
  };
  window.drawNotesGroups = function(){
    const ctx = window.__notesListCtx, el = document.getElementById('notesGroups'); if(!ctx || !el) return;
    const q = ((document.getElementById('notesSearch') || {}).value || '').trim().toLowerCase();
    const list = ctx.items.map((n, idx) => ({ n, idx })).filter(x => x.n._x.paper === ctx.paper).filter(x =>
      !q || (x.n.title + ' ' + x.n._x.chapter + ' ' + x.n._x.topic + ' ' + (x.n.subtopics || []).join(' ')).toLowerCase().indexOf(q) !== -1);
    if(!list.length){ el.innerHTML = `<div class="empty-state">কিছু পাওয়া যায়নি।</div>`; return; }
    const chapters = {};
    list.forEach(x => { const k = x.n._x.chapter; (chapters[k] = chapters[k] || { no: x.n._x.chNo, topics: {} }); (chapters[k].topics[x.n._x.topic] = chapters[k].topics[x.n._x.topic] || []).push(x); });
    const order = Object.keys(chapters).sort((a, b) => chapters[a].no - chapters[b].no || a.localeCompare(b));
    const open = (list.length <= 12 || q) ? 'open' : '';
    el.innerHTML = order.map(ch => {
      const topics = chapters[ch].topics, count = Object.keys(topics).reduce((a, t) => a + topics[t].length, 0);
      return `<details ${open} style="margin-bottom:10px;border:1px solid var(--paper-edge);border-radius:10px;padding:8px 12px;background:#FCFDFE;">
        <summary style="cursor:pointer;font-weight:700;">📖 ${escapeHtml(ch)} <span class="meta">(${count}টা)</span></summary>
        ${Object.keys(topics).sort().map(tp => `<div style="margin-top:10px;">
          <div style="font-weight:600;color:var(--pencil);font-size:13.5px;margin-bottom:6px;">▸ ${escapeHtml(tp)}</div>
          ${topics[tp].map(x => { const n = x.n; return `<div class="exam-item" style="margin-bottom:8px;">
            <h3 style="margin-bottom:4px;font-size:15px;">${escapeHtml(n.title)}</h3><div>${noteChips(n)}</div>
            ${n.type === 'html'
              ? `<div class="row" style="margin-top:6px;"><button class="btn btn-outline" onclick="viewNoteSlide(${x.idx})">📄 স্লাইড দেখো</button><button class="btn btn-outline" onclick="notePdf(${x.idx})">📥 PDF</button></div>`
              : `<a href="${escapeHtml(n.content)}" target="_blank" rel="noopener" class="btn btn-outline btn-block" style="text-decoration:none;margin-top:6px;">📄 খোলো</a>`}
          </div>`; }).join('')}</div>`).join('')}
      </details>`;
    }).join('');
  };

  // ---- PDF: স্লাইডগুলো একসাথে প্রিন্ট-পেজে সাজিয়ে "Save as PDF" ----
  window.slidesPdf = function(title, slides){
    const old = document.getElementById('pdfFrame'); if(old) old.remove();
    const f = document.createElement('iframe');
    f.id = 'pdfFrame'; f.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;border:0;';
    document.body.appendChild(f);
    const doc = f.contentDocument;
    doc.open();
    doc.write(`<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><title>${escapeHtml(title || 'নোট')}</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
      <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
      <style>@page{size:A4;margin:14mm} body{font-family:'Noto Sans Bengali',sans-serif;color:#1F2A44;line-height:1.7;font-size:14px}
      h1.t{font-size:22px;border-bottom:2px solid #1F2A44;padding-bottom:6px;margin:0 0 14px 0}
      section{page-break-after:always;padding-bottom:6px} section:last-child{page-break-after:auto}
      img{max-width:100%} table{border-collapse:collapse;max-width:100%} td,th{border:1px solid #999;padding:4px 8px}</style></head>
      <body><h1 class="t">${escapeHtml(title || '')}</h1>${slides.map(s => `<section>${s}</section>`).join('')}</body></html>`);
    doc.close();
    toast('PDF তৈরি হচ্ছে... প্রিন্ট স্ক্রিনে "Save as PDF" বাছো');
    setTimeout(async function(){
      try{ if(window.renderMathInElement) renderMathInElement(doc.body, { delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}], throwOnError:false }); }catch(e){}
      try{ await Promise.race([doc.fonts.ready, new Promise(r => setTimeout(r, 2500))]); }catch(e){}
      f.contentWindow.focus(); f.contentWindow.print();
    }, 900);
  };
  window.notePdf = async function(idx){
    const c = window.__notesListCtx; if(!c) return;
    const n = c.items[idx]; let content = n.content;
    if(String(content).indexOf('DRIVEHTML:') === 0){
      toast('লোড হচ্ছে...');

  function loadImg(file){

  async function stitch(files, maxW, quality){

        <input type="text" id="bkBoard" value="${esc(W.board)}" placeholder="যেমন: ঢাকা বোর্ড ২০২৩ / BUET 05-06" oninput="bkSetBoard(this.value)">
        <p class="hint" style="margin:-4px 0 8px;">এই ট্যাগ করা প্রশ্ন Exam Leak-এ সবচেয়ে গুরুত্ব পায়। প্রিভিউতে প্রতিটা প্রশ্নের ট্যাগ আলাদা করে বদলাতে পারবে।</p>
        <label class="field-label">প্রশ্ন কীভাবে দেবে</label>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button class="btn ${!isText ? 'btn-primary' : 'btn-outline'}" style="flex:1" onclick="bkSrc('img')">🖼️ ছবি আপলোড</button>
          <button class="btn ${isText ? 'btn-primary' : 'btn-outline'}" style="flex:1" onclick="bkSrc('text')">📝 টেক্সট পেস্ট</button>
        </div>
        ${isText
          ? `<textarea id="bkText" style="min-height:220px;font-size:14px;" placeholder="${W.kind === 'cq' ? 'এখানে এক বা একাধিক সৃজনশীল প্রশ্ন পেস্ট করো...' : 'এখানে MCQ গুলো পেস্ট করো...'}" oninput="bkText(this.value)">${esc(W.text)}</textarea><p class="hint" id="bkTextInfo"></p>`
          : `<label class="field-label">ছবি (একসাথে অনেকগুলো বাছো, সর্বোচ্চ ${MAX_FILES}টা)</label>
        <input type="file" id="bkFiles" accept="image/*" multiple style="margin-bottom:10px;" onchange="bkPick(this)">
        <div id="bkFileList"></div>`}
        <button class="btn btn-primary btn-block" id="bkGo" onclick="bkRun()" style="margin-top:10px;">🤖 AI দিয়ে পড়ো ও ট্যাগ করো</button>
        <div id="bkProg" style="margin-top:10px;"></div>
      </div>
      <div id="bkPreview"></div>
      <div class="center"><a class="link-back" onclick="go('teacherDashboard')">← ফিরে যাও</a></div>${creditFooter()}`;
    if(isText) bkTextInfo(); else bkFilesDraw();
    if(W.items.length) bkPreviewDraw();
    if(!Object.keys(W.master).length) await bkLoadMaster();
  }
  window.bkSrc = function(s){ if(W.busy) return; W.src = s; bkRender(); };
  window.bkText = function(v){ W.text = v; bkTextInfo(); };
  function bkTextInfo(){ const el = document.getElementById('bkTextInfo'); if(!el) return; const n = textChunks(W.text).length; el.textContent = W.text.trim() ? `${W.text.length} অক্ষর → ${n}টা অংশে AI-কে পাঠানো হবে` : ''; }
  async function bkLoadMaster(){
    const r = await postToScriptRaw('taxMaster', {});
    if(r && r.status === 'success'){ W.master = r.tree || {}; }
    else toast('মাস্টার তালিকা আনা যায়নি (Apps Script নতুন version Deploy করা আছে তো?)');
  }
  window.bkKind = function(k){ if(W.busy) return; W.kind = k; if(k === 'mcq' && W.dest.type === 'hw') W.dest.type = 'rev'; W.files.forEach(f => f.join = false); resetRun(); bkRender(); };
  window.bkSetBoard = function(v){ W.board = v; W.items.forEach(x => { if(!x.boardEdited) x.board = v; }); };
  window.bkSetSubj = function(v){ W.subject = v; if(W.items.length){ W.items.forEach(x => { x.tag = null; x.tagTried = false; }); W.known = []; bkPreviewDraw(); toast('বিষয় বদলেছে — "আবার চেষ্টা" চাপলে নতুন বিষয়ে ট্যাগ হবে'); } };
  window.bkPick = function(inp){
    const list = [...inp.files].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
    if(list.length + W.files.length > MAX_FILES){ toast(`একবারে সর্বোচ্চ ${MAX_FILES}টা ছবি`); }
    list.slice(0, MAX_FILES - W.files.length).forEach(f => W.files.push({ file:f, url:URL.createObjectURL(f), join:false }));
    inp.value = ''; resetRun(); bkFilesDraw();
  };
  function bkFilesDraw(){
    const el = document.getElementById('bkFileList'); if(!el) return;
    if(!W.files.length){ el.innerHTML = ''; return; }
    let q = 0;
    el.innerHTML = `<p class="hint">${W.files.length}টা ছবি → ${groups().length}টা প্রশ্ন/গ্রুপ</p>` + W.files.map((f, i) => {
      if(!f.join || i === 0) q++;
      const head = (!f.join || i === 0) ? `<div style="font-weight:700;margin-top:10px;">${W.kind === 'cq' ? 'প্রশ্ন' : 'পাতা'} #${q}</div>` : '';
      return `${head}<div style="display:flex;gap:8px;align-items:center;margin:4px 0;padding:6px;border:1px solid var(--rule);border-radius:8px;${f.join ? 'margin-left:18px;' : ''}">
        <img src="${f.url}" style="width:54px;height:54px;object-fit:cover;border-radius:6px;">
        <div style="flex:1;min-width:0;"><div class="meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(f.file.name)}</div>
          ${i > 0 ? `<label style="font-size:12.5px;display:flex;gap:4px;align-items:center;"><input type="checkbox" style="width:auto;margin:0;" ${f.join ? 'checked' : ''} onchange="bkJoin(${i}, this.checked)"> ↳ আগের প্রশ্নের পরের পাতা</label>` : ''}</div>
        <button class="info-btn" onclick="bkMove(${i}, -1)">▲</button><button class="info-btn" onclick="bkMove(${i}, 1)">▼</button><button class="info-btn" style="color:var(--red)" onclick="bkDel(${i})">✕</button></div>`;
    }).join('');
  }
  window.bkJoin = function(i, v){ W.files[i].join = v; resetRun(); bkFilesDraw(); };
  window.bkDel = function(i){ URL.revokeObjectURL(W.files[i].url); W.files.splice(i, 1); if(W.files[0]) W.files[0].join = false; resetRun(); bkFilesDraw(); };
  window.bkMove = function(i, d){ const j = i + d; if(j < 0 || j >= W.files.length) return; [W.files[i], W.files[j]] = [W.files[j], W.files[i]]; W.files[0].join = false; resetRun(); bkFilesDraw(); };

  // ---------------- পাইপলাইন: (ক) প্রতি গ্রুপ থেকে প্রশ্ন বের করা, (খ) ১২টা করে ট্যাগ ----------------
  // আবার চাপলে যেগুলো আগেই হয়ে গেছে সেগুলো বাদ দিয়ে শুধু বাকিগুলো চলে (ব্যর্থ হলে থেমে থাকে না, পরে আবার চেষ্টা করা যায়)
  function setProg(frac, msg){
    const el = document.getElementById('bkProg'); if(!el) return;
    const pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
    el.innerHTML = `<div style="background:#E8ECF3;border-radius:8px;height:10px;overflow:hidden;"><div style="height:10px;width:${pct}%;background:var(--green);transition:width .3s"></div></div><p class="hint" style="margin-top:6px;">${msg} (${pct}%) — পেজ বন্ধ কোরো না</p>`;
  }
  window.bkRun = async function(){
    if(W.busy) return;
    const isText = W.src === 'text';
    if(isText){
      if(W.text.trim().length < 5){ toast('আগে প্রশ্নের লেখা পেস্ট করো'); return; }
      if(W.text !== W.textUsed){ resetRun(); W.textUsed = W.text; W.chunks = textChunks(W.text); }
    } else if(!W.files.length){ toast('আগে ছবি বাছো'); return; }
    W.busy = true; const btn = document.getElementById('bkGo'); if(btn) btn.disabled = true;
    const gs = isText ? W.chunks : groups(), failed = [];
    const needTag = () => W.items.filter(x => !x.tag && !x.tagTried);
    W.items.forEach(x => { if(!x.tag) x.tagTried = false; });   // আগের রানে যেগুলো ট্যাগ হয়নি সেগুলো আবার চেষ্টা
    if(!Object.keys(W.master).length) await bkLoadMaster();
    let done = 0;

    // (ক)
    for(let gi = 0; gi < gs.length; gi++){
      if(W.results[gi] && W.results[gi].ok){ done++; continue; }
      setProg(0.7 * done / gs.length, `প্রশ্ন পড়া হচ্ছে — ${gi + 1}/${gs.length}`);
      let act, payload;
      if(isText){ act = 'bulkExtractText'; payload = { kind:W.kind, text:gs[gi] }; }
      else {
        let img; try{ img = await stitch(gs[gi].map(i => W.files[i].file), 1200, 0.72); }
        catch(e){ W.results[gi] = { ok:false, msg:'ছবি পড়া যায়নি' }; failed.push(gi); continue; }
        act = 'bulkExtract'; payload = { kind:W.kind, base64:img.base64, mimeType:img.mimeType };
      }
      let r = await postToScriptRaw(act, payload);
      if(r && r.status === 'error' && (r.message === 'ai_unavailable' || r.message === 'network')){ await new Promise(s => setTimeout(s, 2500)); r = await postToScriptRaw(act, payload); }
      if(r && r.status === 'success'){
        W.results[gi] = { ok:true };
        r.questions.forEach(q => W.items.push({ gi, kind:W.kind, text:q.text, options:q.options || null, correct:(q.correct === undefined ? null : q.correct),
          modelAnswerText:q.modelAnswerText || '', imageUrl:(W.kind === 'cq' || q.needsImage) ? (r.imageUrl || '') : '', tag:null, tagTried:false, removed:false, board:q.tag || W.board, boardEdited:!!q.tag }));
        done++;
      } else {
        W.results[gi] = { ok:false, msg: r && r.message === 'ai_unavailable' ? 'AI এখন সাড়া দিচ্ছে না' : r && r.message === 'nothing_found' ? (isText ? 'লেখায় প্রশ্ন পাওয়া যায়নি' : 'ছবিতে প্রশ্ন পাওয়া যায়নি') : 'পড়া যায়নি' };
        failed.push(gi);
      }
    }
    // (খ) ট্যাগ — নতুন নামগুলো পরের ব্যাচকে জানানো হয়, যাতে একই টপিক ব্যাচ ভেদে আলাদা নাম না পায়
    let aiDown = false; const tagTotal = needTag().length || 1;
    while(!aiDown){
      const pend = needTag().slice(0, CHUNK_TAG); if(!pend.length) break;
      setProg(0.7 + 0.3 * (1 - needTag().length / tagTotal), `অধ্যায়/টপিক ঠিক করা হচ্ছে — বাকি ${needTag().length}টা`);
      const r = await postToScriptRaw('bulkTag', { subject:W.subject, known:JSON.stringify(W.known), items:JSON.stringify(pend.map(x => ({ text:x.text + (x.options ? ' ; ' + x.options.join(' ; ') : ''), subject:W.subject }))) });
      if(!r || r.status !== 'success'){ aiDown = true; break; }
      pend.forEach((it, i) => {
        it.tagTried = true; const t = r.tags[i];
        if(t){ it.tag = { subject:t.subject, chapter:t.chapter, topic:t.topic, subs:t.subs || [] }; bkRegister(it.tag); if(t.isNew) W.known.push({ subject:t.subject, chapter:t.chapter, topic:t.topic }); }
      });
    }
    W.busy = false;
    const prog = document.getElementById('bkProg');
    if(prog){
      const bad = failed.length ? `<p class="hint" style="color:#9B6A15;">⚠️ ${failed.length}টা ${isText ? 'অংশ' : 'গ্রুপ'} পড়া যায়নি: ${failed.map(g => `#${g + 1} (${esc(W.results[g].msg)})`).join(', ')} — আবার চাপলে শুধু এগুলোই চেষ্টা হবে।</p>` : '';
      const dn = aiDown ? `<p class="hint" style="color:#9B6A15;">⚠️ AI এখন ট্যাগ বসাতে পারেনি — প্রশ্নগুলো নিচে আছে, নিজে ট্যাগ বেছে নিতে পারো, বা পরে আবার চাপো।</p>` : '';
      prog.innerHTML = `<p class="hint" style="color:var(--green);">✅ ${W.items.length}টা প্রশ্ন পাওয়া গেছে।</p>${bad}${dn}`;
    }
    if(btn){ btn.disabled = false; btn.textContent = '🔄 বাকিগুলো আবার চেষ্টা করো'; }
    bkPreviewDraw();
  };

  // ---------------- মাস্টার তালিকা থেকে অপশন (AI/শিক্ষকের বানানো নতুন নামও পরের কার্ডে পাওয়া যায়) ----------------
  function bkRegister(t){ if(!t || !t.subject || !t.chapter || !t.topic) return; const e = (W.extra[t.subject] = W.extra[t.subject] || {}); (e[t.chapter] = e[t.chapter] || {})[t.topic] = true; }
  const bkChs = sj => uniq(((W.master[sj] || []).map(c => c.chapter)).concat(Object.keys(W.extra[sj] || {})));
  function bkTps(sj, ch){ const m = (W.master[sj] || []).find(c => c.chapter === ch); return uniq((m ? m.topics.map(t => t.topic) : []).concat(Object.keys(((W.extra[sj] || {})[ch]) || {}))); }
  const bkIsNew = (sj, ch) => !(W.master[sj] || []).some(c => c.chapter === ch);

  // ---------------- প্রিভিউ ----------------
  function bkInvalid(it){ const t = it.tag; return !t || !t.subject || !t.chapter || !t.topic || (it.kind === 'mcq' && !(it.correct >= 0 && it.correct <= 3 && it.correct !== null)); }
  function bkCard(it, i){
    const t = it.tag || { subject:W.subject || '', chapter:'', topic:'' };
    const chs = t.subject ? bkChs(t.subject) : [], tps = (t.subject && t.chapter) ? bkTps(t.subject, t.chapter) : [];
    const isNew = t.subject && t.chapter && bkIsNew(t.subject, t.chapter);
    const L = ['ক', 'খ', 'গ', 'ঘ'];
    return `<div class="card" id="bkC${i}" style="${it.removed ? 'display:none;' : ''}${bkInvalid(it) ? 'border:2px solid var(--red);' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center;"><b>${it.kind === 'cq' ? 'CQ' : 'MCQ'} #${i + 1}</b>
        <span><span class="meta">${W.kind === 'cq' ? 'ছবি-গ্রুপ #' + (it.gi + 1) : ''}</span> <button class="info-btn" style="color:var(--red)" onclick="bkRemove(${i})">🗑️ বাদ</button></span></div>
      ${it.imageUrl ? `<img src="${driveImg(it.imageUrl)}" style="max-width:100%;max-height:260px;border-radius:8px;margin:6px 0;">` : ''}
      <textarea style="min-height:${it.kind === 'cq' ? 110 : 60}px;font-size:14px;" oninput="bkSet(${i},'text',this.value)">${esc(it.text)}</textarea>
      <input type="text" value="${esc(it.board || '')}" placeholder="🏷️ বোর্ড/ভর্তি ট্যাগ (ঐচ্ছিক)" style="margin-top:6px;font-size:13px;" oninput="bkSet(${i},'board',this.value); W.items[${i}].boardEdited = true">
      ${it.kind === 'mcq' ? `<div style="margin-top:6px;">${it.options.map((o, j) => `<div style="display:flex;gap:6px;align-items:center;margin:3px 0;"><b>${L[j]})</b><input type="text" value="${esc(o)}" style="margin:0;" oninput="bkOpt(${i},${j},this.value)"></div>`).join('')}
        <label class="field-label">সঠিক উত্তর ${it.correct === null ? '<span style="color:var(--red)">(বাছতে হবে)</span>' : ''}</label>
        <select onchange="bkSet(${i},'correct',this.value === '' ? null : Number(this.value)); bkRedraw(${i})"><option value="">— বাছো —</option>${L.map((l, j) => `<option value="${j}" ${it.correct === j ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` : ''}
      <div style="margin-top:8px;padding:8px;background:#F4F6FA;border-radius:8px;">
        <div class="meta" style="margin-bottom:4px;">🏷️ ট্যাগ ${!it.tag ? '<span style="color:var(--red)">— AI ধরতে পারেনি, নিজে বাছো</span>' : isNew ? '<span style="color:#9B6A15">— 🆕 মাস্টার তালিকায় নেই (কনফার্ম করলে নতুন অধ্যায় হিসেবে যোগ হবে)</span>' : '<span style="color:var(--green)">— মাস্টার তালিকা থেকে</span>'}</div>
        <select onchange="bkSubjC(${i}, this.value)">${subjOpts(t.subject, '— বিষয় —')}</select>
        <select onchange="bkChC(${i}, this.value)" style="margin-top:6px;"><option value="">— অধ্যায় —</option>${chs.map((c, j) => `<option value="${j}" ${t.chapter === c ? 'selected' : ''}>${esc(c)}${bkIsNew(t.subject, c) ? ' 🆕' : ''}</option>`).join('')}<option value="__new">➕ নতুন অধ্যায়...</option></select>
        <select onchange="bkTpC(${i}, this.value)" style="margin-top:6px;"><option value="">— টপিক —</option>${tps.map((c, j) => `<option value="${j}" ${t.topic === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}<option value="__new">➕ নতুন টপিক...</option></select>
      </div></div>`;
  }
  function bkPreviewDraw(){
    const el = document.getElementById('bkPreview'); if(!el) return;
    if(!W.items.length){ el.innerHTML = ''; return; }
    el.innerHTML = `<div class="card" id="bkSummary"></div>${W.items.map(bkCard).join('')}
      <div class="card"><div id="bkDest"></div><button class="btn btn-primary btn-block" id="bkSave" onclick="bkConfirm()" style="margin-top:10px;">✅ কনফার্ম ও সেভ করো</button><div id="bkSaveSt" style="margin-top:8px;"></div></div>`;
    bkSummary(); bkDestInit();
  }
  function bkSummary(){
    const el = document.getElementById('bkSummary'); if(!el) return;
    const live = W.items.filter(x => !x.removed), bad = live.filter(bkInvalid).length;
    const nw = live.filter(x => x.tag && x.tag.chapter && bkIsNew(x.tag.subject, x.tag.chapter)).length;
    el.innerHTML = `<h2>👀 প্রিভিউ — ${live.length}টা প্রশ্ন</h2><p class="hint">${bad ? `<span style="color:var(--red)">⚠️ ${bad}টায় ট্যাগ/উত্তর বাকি (লাল বর্ডার)।</span> ` : '<span style="color:var(--green)">✅ সব ঠিক আছে।</span> '}${nw ? `🆕 ${nw}টা প্রশ্ন মাস্টার তালিকায় নেই এমন অধ্যায়ে — নাম মিলিয়ে দেখো, একই অধ্যায় আলাদা নামে যেন না যায়।` : ''}</p>`;
  }
  window.bkRedraw = function(i){ const el = document.getElementById('bkC' + i); if(el){ const d = document.createElement('div'); d.innerHTML = bkCard(W.items[i], i); el.replaceWith(d.firstElementChild); } bkSummary(); };
  window.bkSet = function(i, k, v){ W.items[i][k] = v; };
  window.bkOpt = function(i, j, v){ W.items[i].options[j] = v; };
  window.bkRemove = function(i){ W.items[i].removed = true; const el = document.getElementById('bkC' + i); if(el) el.style.display = 'none'; bkSummary(); };
  window.bkSubjC = function(i, v){ W.items[i].tag = { subject:v, chapter:'', topic:'', subs:[] }; bkRedraw(i); };
  window.bkChC = function(i, v){
    const it = W.items[i], t = it.tag || (it.tag = { subject:W.subject, chapter:'', topic:'', subs:[] });
    if(!t.subject){ toast('আগে বিষয় বাছো'); bkRedraw(i); return; }
    if(v === '__new'){
      const name = (prompt('নতুন অধ্যায়ের নাম (মাস্টার তালিকার ফরম্যাটে, যেমন: ১ম পত্র · অধ্যায়-০২: ভেক্টর)') || '').replace(/\|/g, ' ').trim();
      if(name){ t.chapter = name; t.topic = ''; (W.extra[t.subject] = W.extra[t.subject] || {})[name] = W.extra[t.subject][name] || {}; }

  async function bkMakeSet(){

        for(let pi = 0; pi < parts.length; pi++){
          const title = base + (subs.length > 1 ? ' — ' + subjLabel(sj) : '') + (parts.length > 1 ? ` (${pi + 1})` : '');
          const key = sj + '|' + pi;

  function loadImg(file){
    return new Promise((res, rej) => {
      const url = URL.createObjectURL(file), img = new Image();

    const imgs = []; for(const f of files) imgs.push(await loadImg(f));
    let w = Math.min(maxW, Math.max(...imgs.map(i => i.width)));
    let hs = imgs.map(i => Math.round(i.height * (w / i.width)));
    const GAP = 6, MAXH = 7000;
    let total = hs.reduce((a, b) => a + b, 0) + GAP * (imgs.length - 1);
    const k = total > MAXH ? MAXH / total : 1;
    w = Math.round(w * k); hs = hs.map(h => Math.round(h * k)); total = hs.reduce((a, b) => a + b, 0) + GAP * (imgs.length - 1);
    const c = document.createElement('canvas'); c.width = w; c.height = total;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, total);
    let y = 0; imgs.forEach((im, i) => { x.drawImage(im, 0, y, w, hs[i]); y += hs[i] + GAP; });
    return { base64: c.toDataURL('image/jpeg', quality).split(',')[1], mimeType:'image/jpeg' };

  // ---------- নিজের HW জমা: প্রশ্নের পাতা + খাতার পাতা (দুটোই একাধিক), টপিক লিখতে হয় না ----------
  const S2 = { q:[], a:[], busy:false };

  // ড্যাশবোর্ডের পুরনো "Daily HW" উইজেট → একটাই HW উইজেট (+ রিভিশন সেট, ক্যালেন্ডার)

  };

  // =====================================================================================

  const R = { list:[], set:null, items:[], pages:{} };

  async function srRender(){

  window.srMcq = async function(itemId, choice){

  window.srCq = async function(itemId){

    } else { b.disabled = false; out.innerHTML = `<p class="hint" style="color:var(--red);">${gradeErrMsg(r)}</p>`; }

  // =====================================================================================
  // ধাপ ৫ক: একটাই ক্যালেন্ডার — HW (লাল), রিভিশন (নীল), ক্লাস (সবুজ)
  // =====================================================================================
  const COL = { hw:'#EC4899', rev:'#7C3AED', class:'#2E9E5B' };   // HW গোলাপি · রিভিশন বেগুনি · ক্লাস: নিজে confirm সবুজ / exam-এ নীল / অপেক্ষায় হলুদ
  const YEL = '#F2B705', BLU = '#3B82F6';
  const colorOf = e => e.type === 'class' ? (e.src === 'exam' ? BLU : e.src === 'pending' ? YEL : COL.class) : COL[e.type];
  const TYPE_LABEL = { hw:'HW', rev:'রিভিশন', class:'ক্লাস' };
  const C = { y:null, m:null, events:[], sel:'' };
  async function mcRender(){
    const stud = needStud(); if(!stud) return;
    const now = new Date(); if(C.y === null){ C.y = now.getFullYear(); C.m = now.getMonth(); C.sel = todayStr(); }
    loading('আমার ক্যালেন্ডার');
    const r = await postToScriptRaw('planCalendar', { slug:stud.slug, month:`${C.y}-${String(C.m + 1).padStart(2, '0')}`, today:todayStr() });

    const first = new Date(C.y, C.m, 1).getDay(), dim = new Date(C.y, C.m + 1, 0).getDate(), today = todayStr(), by = {};

      const ds = `${C.y}-${String(C.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, ev = by[ds] || [];
      const types = uniq(ev.map(e => e.type)), missed = ev.some(e => e.status === 'missed');
      const cols = uniq(['class', 'hw', 'rev'].map(t => ev.filter(e => e.type === t)[0]).filter(Boolean).map(colorOf));

    }
    const sel = by[C.sel] || [];
    const list = sel.map(e => {
      const st = { done:'✅ হয়েছে', todo:'⏳ বাকি', missed:'⚠️ মিস' }[e.status] || '';

        <div style="margin-top:12px;font-size:12px;color:var(--pencil);display:flex;gap:14px;flex-wrap:wrap;"><span>🟩 ক্লাস (নিজে confirm)</span><span>🟦 ক্লাস (exam দিয়ে)</span><span>🟨 confirm বাকি</span><span>🟪 রিভিশন</span><span><i style="display:inline-block;width:13px;height:13px;border-radius:3px;background:#EC4899;vertical-align:-2px;"></i> HW</span><span>একাধিক হলে মিশ্র রঙ</span><span style="box-shadow:inset 0 0 0 2px #7F1D1D;padding:0 6px;border-radius:4px;">⚠️ মিস</span></div></div>
      <div class="card"><h3>${esc(C.sel)} — সেদিনের কাজ</h3>${list}</div>
      <div class="center"><a class="link-back" onclick="go('studentDashboard')">← ড্যাশবোর্ডে ফিরে যাও</a></div>${creditFooter()}`;
  }
  window.mcNav = function(d){ C.m += d; if(C.m < 0){ C.m = 11; C.y--; } if(C.m > 11){ C.m = 0; C.y++; } C.sel = ''; mcRender(); };
  window.mcPick = function(ds){ C.sel = ds; mcDraw(); };
  window.mcConfirm = async function(ds){

      : B.mode === 'tag' ? `<select onchange="sbF('chapter', this.value)"><option value="">— অধ্যায় (সব) —</option>${chs.map(c => `<option value="${esc(c.chapter)}" ${B.f.chapter === c.chapter ? 'selected' : ''}>${esc(c.chapter)}</option>`).join('')}</select>

        <label class="field-label">বিষয়</label><select onchange="sbF('subject', this.value)">${subjOpts(B.f.subject, '— বিষয় বাছো —')}</select>
        <label class="field-label">সেটের নাম</label><input type="text" value="${esc(B.meta.title)}" placeholder="যেমন: ভেক্টর — সাপ্তাহিক রিভিশন" onchange="B_meta('title', this.value)">
        <div class="row"><div style="flex:1"><label class="field-label">তারিখ (কবে থেকে)</label><input type="date" value="${esc(B.meta.date)}" onchange="B_meta('date', this.value)"></div>
          <div style="flex:1"><label class="field-label">ডেডলাইন</label><input type="date" value="${esc(B.meta.due)}" onchange="B_meta('due', this.value)"></div></div></div>

        ${B.f.subject ? filters : `<p class="hint">আগে ওপরে বিষয় বাছো।</p>`}

  function injectPlan(){

      const opts = q.options.map((o, j) => `<div style="margin:3px 0;${withAns && j === q.correct ? 'font-weight:700;color:var(--green);' : ''}">${L4[j]}) ${esc(o)}</div>`).join('');

        ${withAns ? '' : `<details style="margin-top:4px;"><summary style="cursor:pointer;font-size:13px;">✅ উত্তর দেখো</summary><b>${L4[q.correct] || '?'}) ${esc(q.options[q.correct] || '')}</b></details>`}</div>`;
    }
    const ans = q.modelAnswerText || q.modelAnswerImageUrl ? `<div style="margin-top:6px;white-space:pre-wrap;">${esc(q.modelAnswerText)}</div>${q.modelAnswerImageUrl ? `<img src="${driveImg(q.modelAnswerImageUrl)}" style="max-width:100%;border-radius:8px;margin-top:4px;">` : ''}` : '<div class="meta">মডেল উত্তর নেই।</div>';
    return `<div class="exam-item"><div class="meta">${tags}</div>${meta}${cqHtml(q, i)}${img}
      ${withAns ? `<div style="margin-top:6px;"><b>উত্তর:</b>${ans}</div>` : `<details style="margin-top:6px;"><summary style="cursor:pointer;font-size:13px;">✅ মডেল উত্তর দেখো</summary>${ans}</details>`}</div>`;

    const d = L.data;

// ব্যাকএন্ড: Imp.gs (impList / impQuestions / impSave / impDelete / impRestore / impBuildNow)
// =====================================================================================
const IMP_ICONS = { physics:'⚛️', chemistry:'🧪', mathematics:'📐', biology:'🌿', ict:'💻' };
const impBn = s => String(s == null ? '' : s).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const impE = s => escapeHtml(String(s == null ? '' : s));
window.__imp = window.__imp || { list:{}, qs:{} };

async function impCall(action, params){
  try{
    const o = await postToScriptRaw(action, params || {});
    return (o && o.status === 'success') ? o : null;
  }catch(e){ return null; }
}
async function impLoad(subject, force){
  if(!force && window.__imp.list[subject]) return window.__imp.list[subject];
  const o = await impCall('impList', { subject });
  if(o){ window.__imp.list[subject] = o.chapters || []; return window.__imp.list[subject]; }
  return null;
}
function impSalChips(sals, max){
  if(!sals || !sals.length) return '';
  const shown = sals.slice(0, max || 6).map(s => `<span class="q-tag" style="margin:0 4px 4px 0; display:inline-block;">${impE(impBn(s))}</span>`).join('');
  return shown + (sals.length > (max || 6) ? `<span class="meta">+${impBn(sals.length - (max || 6))}টা আরও</span>` : '');
}

window.impOpenChapter = function(subject, sectionKey, chapter){ go('impChapter', { subject, sectionKey, chapter, tab:'topics' }); };

function impStars(score, max){
  const r = max ? score / max : 0, n = Math.max(1, Math.min(5, Math.ceil(r * 5)));
  return '🔥'.repeat(n > 3 ? 2 : 1) + '⭐'.repeat(n);
}
function impCountLine(t){
  if(t.total == null && t.g == null) return '';
  const parts = [];
  if(t.g != null && t.gh != null) parts.push(`গ ${impBn(t.g)}টি + ঘ ${impBn(t.gh)}টি`);
  if(t.total != null) parts.push(`মোট ${impBn(t.total)}টি প্রশ্ন`);
  return '📝 ' + parts.join(' · ');
}
function impTopicCard(t, max){
  const pct = max ? Math.max(8, Math.round(t.score / max * 100)) : 0;
  const hasAi = t.score > 0;
  const badge = t.stars ? `<span class="q-tag">${'⭐'.repeat(t.stars)}</span>` : (hasAi ? `<span class="q-tag">${impStars(t.score, max)}</span>` : '');
  const cnt = impCountLine(t);
  return `<div class="exam-item">
    <div class="row-top"><h3 style="margin-bottom:0;">${impE(t.topic)}</h3>${badge}</div>
    ${cnt ? `<div class="meta" style="margin-top:4px;">${cnt}</div>` : ''}
    ${t.note ? `<div style="white-space:pre-wrap; font-size:14.5px; line-height:1.7; margin:6px 0;">${impE(t.note)}</div>` : ''}
    ${hasAi ? `<div style="background:#EEF3F8; border-radius:6px; height:7px; margin:8px 0 4px;"><div style="width:${pct}%; height:100%; border-radius:6px; background:var(--gold);"></div></div>
      <div class="meta">মোট ${impBn(t.score)}টা সাল-ট্যাগ · ${impBn(t.qCount)}টা প্রশ্ন থেকে</div>
      <div style="margin-top:6px;">${impSalChips(t.sals, 6)}</div>` : ''}
  </div>`;
}
async function renderImpChapter(subject, sectionKey, chapter, tab){
  tab = tab || 'topics';
  const sec = TOPIC_STRUCTURE[subject].sections[sectionKey];
  const chJs = JSON.stringify(chapter).replace(/"/g, '&quot;');
  const tabs = `<div class="row" style="margin:10px 0;">
      <button class="btn ${tab === 'topics' ? 'btn-primary' : 'btn-outline'} btn-block" onclick="go('impChapter',{subject:'${subject}',sectionKey:'${sectionKey}',chapter:${chJs},tab:'topics'})">⭐ গুরুত্বপূর্ণ টপিক</button>
      <button class="btn ${tab === 'qs' ? 'btn-primary' : 'btn-outline'} btn-block" onclick="go('impChapter',{subject:'${subject}',sectionKey:'${sectionKey}',chapter:${chJs},tab:'qs'})">❓ গুরুত্বপূর্ণ প্রশ্ন</button>
    </div>`;
  const shell = (inner) => `${header('গুরুত্বপূর্ণ টপিক')}
    <div class="card"><h2>${impE(chapter)}</h2><div class="meta">${TOPIC_STRUCTURE[subject].label} · ${sec ? sec.label : ''}</div>${tabs}${inner}</div>
    <div class="center"><a class="link-back" onclick="go('impChapters',{subject:'${subject}',sectionKey:'${sectionKey}'})">← অধ্যায় তালিকায় ফিরে যাও</a></div>${creditFooter()}`;
  app.innerHTML = shell('<div class="center">লোড হচ্ছে...</div>');

  if(tab === 'topics'){
    const list = await impLoad(subject);
    if(state.screen !== 'impChapter' || state.tab !== 'topics') return;
    const c = (list || []).find(x => x.chapter === chapter);
    if(!c || !c.topics.length){ app.innerHTML = shell('<p class="hint">এই অধ্যায়ে এখনো গুরুত্বপূর্ণ টপিক যোগ হয়নি।</p>'); return; }
    const max = Math.max.apply(null, c.topics.map(t => t.score || 0));
    const teacher = c.topics.filter(t => t.teacherId), ai = c.topics.filter(t => !t.teacherId);
    app.innerHTML = shell(
      (teacher.length ? `<h3 style="margin-top:6px;">👨‍🏫 স্যারের বাছাই করা</h3>${teacher.map(t => impTopicCard(t, max)).join('')}` : '') +
      (ai.length ? `<h3 style="margin-top:14px;">🤖 সাল অনুযায়ী গুরুত্বপূর্ণ</h3><p class="hint">যে টপিকের সাথে যত বেশি বোর্ড/ভর্তি সাল জড়িত, সেটা তত উপরে।</p>${ai.map(t => impTopicCard(t, max)).join('')}` : ''));
    return;
  }
  // প্রশ্ন ট্যাব
  const ck = subject + '|' + chapter;
  let qs = window.__imp.qs[ck];
  if(!qs){ const o = await impCall('impQuestions', { subject, chapter }); qs = o ? o.questions : null; if(qs) window.__imp.qs[ck] = qs; }
  if(state.screen !== 'impChapter' || state.tab !== 'qs') return;
  if(!qs){ app.innerHTML = shell('<p class="hint" style="color:var(--red);">❌ লোড করা যায়নি।</p>'); return; }
  if(!qs.length){ app.innerHTML = shell('<p class="hint">এই অধ্যায়ের জন্য এখনো কোনো গুরুত্বপূর্ণ প্রশ্ন বাছাই হয়নি।</p>'); return; }
  const cards = qs.map((q, i) => {
    const opts = q.kind === 'mcq' && q.options.length ? `<div style="margin-top:8px;">${q.options.map((o, j) => `<div style="padding:5px 8px; margin-bottom:4px; border-radius:6px; ${j === q.correct ? 'background:#E8F6EF; border:1px solid var(--green);' : 'background:#F5F7FA;'}">${'ক খ গ ঘ'.split(' ')[j] || ''}) ${impE(o)}${j === q.correct ? ' ✅' : ''}</div>`).join('')}</div>` : '';
    const model = q.kind === 'cq' && q.model ? `<details style="margin-top:8px;"><summary style="cursor:pointer; color:var(--blue,#2B5797); font-weight:600;">উত্তর দেখো</summary><div style="white-space:pre-wrap; margin-top:6px; line-height:1.7;">${impE(q.model)}</div></details>` : '';
    const img = q.imageUrl ? `<img src="${impE(q.imageUrl)}" loading="lazy" style="max-width:100%; border-radius:8px; margin-top:8px;" onerror="this.style.display='none'">` : '';
    return `<div class="exam-item">
      <div class="meta"><b>#${impBn(i + 1)}</b> <span class="q-tag">${q.kind === 'mcq' ? 'MCQ' : 'CQ'}</span> <span class="q-tag">📌 ${impE(q.topic)}</span> <span class="q-tag">${impBn(q.score)}টা সাল</span></div>
      <div style="white-space:pre-wrap; font-size:15px; line-height:1.7; margin-top:6px;">${impE(q.text)}</div>${img}${opts}${model}
      <div style="margin-top:8px;">${impSalChips(q.sals, 8)}</div>
    </div>`;
  }).join('');
  app.innerHTML = shell(`<p class="hint">যে প্রশ্ন যত বেশি সাল বোর্ড/ভর্তিতে এসেছে, সেটা তত উপরে।</p>${cards}`);
}

// ---------- বাল্ক: টেক্সট পার্স → প্রিভিউ (এডিট করা যায়) → সেভ ----------
const IMP_STAR_RE = /[⭐★🌟✭✯]/gu;
function impBkParse(text){
  const out = [];
  String(text || '').split(/\r?\n/).forEach(raw => {
    let L = raw.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d));
    if(!L.trim()) return;
    const stars = Math.min(5, (L.match(IMP_STAR_RE) || []).length);
    L = L.replace(IMP_STAR_RE, ' ').replace(/[|│┃\t]+/g, ' ');
    if(/গ\s*\+\s*ঘ|মোট\s*প্রশ্ন|topic\s*suggestion|^\s*টপিক\s*$/i.test(L)) return;
    const fi = L.search(/\d/);
    const topic = (fi === -1 ? L : L.slice(0, fi)).replace(/^[\s\d.\-)•:]+/, '').replace(/[\s:\-–—.]+$/, '').trim();
    if(!topic || topic.length < 2) return;
    const rest = fi === -1 ? '' : L.slice(fi);
    let g = null, gh = null, total = null;
    const pm = rest.match(/^(\d+)\s*(?:টি)?\s*\+\s*(\d+)\s*(?:টি)?\s*(.*)$/);
    if(pm){
      g = +pm[1]; gh = +pm[2];
      const tn = (pm[3].match(/\d+/g) || []).map(Number);
      total = !tn.length ? g + gh : (tn.length >= 2 && /\+/.test(pm[3]) ? tn[0] + tn[1] : tn[0]);
    } else {
      const nums = (rest.match(/\d+/g) || []).map(Number);
      if(nums.length >= 3){ g = nums[nums.length - 3]; gh = nums[nums.length - 2]; total = nums[nums.length - 1]; }
      else if(nums.length === 2){ g = nums[0]; gh = nums[1]; total = g + gh; }
      else if(nums.length === 1){ total = nums[0]; }
    }
    out.push({ topic, orig:topic, custom:true, stars, g, gh, total, keep:true });
  });
  return out;
}
window.impBkPreview = function(){
  const items = impBkParse(document.getElementById('impBkText').value);
  const box = document.getElementById('impBkOut');
  window.__impBk = items;

  box.innerHTML = impBkRows();
};
function impBkTax(){
  const M = window.__impMgr, el = document.getElementById('impBkCh');
  const c = M && el ? M.chapters[Number(el.value)] : null;
  return c ? c.taxTopics : [];
}
function impNormT(s){ return String(s || '').replace(/সম্পর্কিত|সংক্রান্ত|বিষয়ক/g, '').replace(/[^A-Za-z0-9\u0980-\u09FF]/g, '').toLowerCase(); }
function impDice(a, b){
  if(!a || !b) return 0; if(a === b) return 1;
  if(a.length > 3 && b.length > 3 && (a.includes(b) || b.includes(a))) return 0.85;   // কাটা/ছোট নামও ধরবে
  const bg = s => { const r = []; for(let i = 0; i < s.length - 1; i++) r.push(s.slice(i, i + 2)); return r; };
  const x = bg(a), y = bg(b); if(!x.length || !y.length) return 0;
  const m = {}; y.forEach(g => m[g] = (m[g] || 0) + 1);
  let h = 0; x.forEach(g => { if(m[g] > 0){ h++; m[g]--; } });
  return 2 * h / (x.length + y.length);
}
function impBestTax(name, list){
  let best = null, bs = 0; const n = impNormT(name);
  list.forEach(t => { const sc = impDice(n, impNormT(t)); if(sc > bs){ bs = sc; best = t; } });
  return bs >= 0.5 ? best : null;
}
window.impBkRematch = function(silent){
  const tax = impBkTax();
  (window.__impBk || []).forEach(it => {
    const m = impBestTax(it.orig, tax);
    if(m){ it.topic = m; it.custom = false; } else { it.topic = it.orig; it.custom = true; }
  });
  const box = document.getElementById('impBkOut');

};

        <span class="meta">গ</span><input type="number" min="0" value="${num(it.g)}" onchange="impBkSet(${i},'g',this.value)" style="width:62px;">

  const kept = items.filter(x => x.keep && x.topic.trim()).length;

  window.rvSaveCfg = async function(){
    const r = await postToScript('setRevealConfig', { apiBill: Number(document.getElementById('rvApi').value) || 0, missCut: Number(document.getElementById('rvMiss').value) || 0, mode: document.getElementById('rvMode').value });
    if(r) toast('সেভ হয়েছে ✅');
  };
  window.rvRevealNow = async function(slug){
    if(!confirm('এই ছাত্রের লুকানো MCQ কুপন এখনই প্রকাশ করবে? (CQ-এর রিভিল অ্যানিমেশন আর হবে না)')) return;

})();
</script>

<!-- ===== Universal Back Button (সব "← ফিরে যাও" লিংকের বদলে একটাই বাটন) ===== -->
<style>
  #uniBack{ position:fixed; top:calc(14px + env(safe-area-inset-top,0px)); left:14px; z-index:60; display:none;
    background:var(--ink,#1F2A44); color:#fff; border:none; border-radius:20px; padding:8px 16px;
    font-family:var(--font-body,inherit); font-weight:600; font-size:13.5px; cursor:pointer;
    box-shadow:0 4px 14px -4px rgba(31,42,68,0.5); }
  #uniBack:active{ transform:translateY(1px); }
  @media (max-width:480px){ #uniBack{ top:auto; bottom:calc(78px + env(safe-area-inset-bottom,0px)); left:12px; padding:8px 14px; font-size:12.5px; } }
  .ub-hide{ display:none !important; }
</style>
<button id="uniBack" type="button" onclick="uniBackGo()">← পেছনে</button>
<script>
(function(){
  const ROOTS = ['landing','studentDashboard','teacherDashboard'];   // এই স্ক্রিনগুলোতে হিস্ট্রি রিসেট হয়, বাটন দেখায় না
  const NO_BACK = ['studentExam'];                                    // পরীক্ষা চলাকালীন back বন্ধ
  const hist = [];
  const __go = go;
  go = function(screen, data){
    const prev = state;
    if(ROOTS.indexOf(screen) >= 0){ hist.length = 0; }
    else if(prev && prev.screen && prev.screen !== screen && NO_BACK.indexOf(prev.screen) < 0){
      hist.push(prev); if(hist.length > 40) hist.shift();
    }
    return __go(screen, data === undefined ? {} : data);
  };
  window.uniBackGo = function(){
    const p = hist.pop(); if(!p) return;
    if(typeof timerInterval !== 'undefined' && timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    if(typeof closeLibraryPanel === 'function') closeLibraryPanel();
    state = p; render();
  };
  // পুরনো "← ..." back লিংকগুলো লুকাও (শুধু যেগুলো go(...) ডাকে; বাকিগুলো যেমন আছে তেমন থাকবে)
  function sweep(){
    document.querySelectorAll('#app a.link-back').forEach(a=>{
      const oc = a.getAttribute('onclick') || '';
      if(/^\s*←/.test(a.textContent) && /^\s*(go\(|teacherLogout)/.test(oc)){
        a.classList.add('ub-hide');
        const box = a.parentElement;
        if(box && box !== document.getElementById('app') && box.children.length === 1 && box.textContent.trim() === a.textContent.trim()) box.classList.add('ub-hide');
      }
    });
    const b = document.getElementById('uniBack');
    const sc = state && state.screen;
    b.style.display = (hist.length && NO_BACK.indexOf(sc) < 0 && ROOTS.indexOf(sc) < 0) ? 'inline-flex' : 'none';
  }
  const __r = render;
  render = function(){ const r = __r.apply(this, arguments); sweep(); return r; };
  let q = 0;
  new MutationObserver(()=>{ if(q) return; q = requestAnimationFrame(()=>{ q = 0; sweep(); }); })
    .observe(document.getElementById('app'), { childList:true, subtree:true });
  sweep();
})();
</script>

<!-- ===== Universal Tag Button + ট্যাগ সেন্টার (সব ট্যাগ-বাটন একখানে) ===== -->
<style>
  #tagFab{ position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); right:14px; z-index:60; display:none;
    background:var(--gold,#E9B949); color:#3a2a06; border:none; border-radius:22px; padding:10px 18px;
    font-family:var(--font-body,inherit); font-weight:700; font-size:14px; cursor:pointer;
    box-shadow:0 4px 14px -4px rgba(0,0,0,0.4); }
  #tagFab:active{ transform:translateY(1px); }
  @media (max-width:480px){ #tagFab{ bottom:calc(128px + env(safe-area-inset-bottom,0px)); right:12px; padding:9px 15px; font-size:13px; } }
</style>
<button id="tagFab" type="button" onclick="go('tagCenter')">🏷️ ট্যাগ</button>
<script>
(function(){
  function ptr(title, sub){
    return `<h3>🏷️ ${title}</h3><p class="hint">${sub}</p><button class="btn btn-gold btn-block" onclick="go('tagCenter')">🏷️ ট্যাগ সেন্টারে যাও</button>`;
  }

  // ---------- ট্যাগ সেন্টার স্ক্রিন ----------
  async function renderTagCenter(){
    syncLogoutFab();
    if(!currentTeacher){ go('teacherGate'); return; }
    app.innerHTML = `${header('ট্যাগ সেন্টার')}<div class="card center">লোড হচ্ছে...</div>`;
    let all = [];
    try{ all = await getAllNotes(); window.__notesAll = all; }catch(e){}
    if(state.screen !== 'tagCenter') return;
    const pend = all.filter(n => n.untagged);
    const row = (n, withAi) => `
      <div class="review-block" style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div style="min-width:0;"><b>${escapeHtml(n.title || '(শিরোনাম নেই)')}</b>
          <div class="meta">${n.chapter && n.topic ? '📖 ' + escapeHtml(n.chapter) + ' › ' + escapeHtml(n.topic) : '⚠️ ট্যাগ হয়নি'}</div></div>
        <div style="display:flex; gap:6px; flex-shrink:0;">
          <button class="btn btn-outline" style="padding:7px 12px; font-size:12.5px;" onclick="noteTagEditById('${n.id}')">🏷️ ট্যাগ</button>
          ${withAi ? `<button class="btn btn-outline" style="padding:7px 12px; font-size:12.5px;" onclick="retagNoteUI('${n.id}')">🤖 AI</button>` : ''}
        </div>
      </div>`;
    const sec = (title, open, inner) => `<details class="dg" ${open ? 'open' : ''}><summary><span>${title}</span></summary><div class="dg-in">${inner}</div></details>`;
    app.innerHTML = `
      ${header('ট্যাগ সেন্টার')}
      <div class="card" style="border:2px solid var(--gold);">
        <h2>🏷️ ট্যাগ সেন্টার</h2>
        <button id="tagEveryBtn" class="btn btn-gold btn-block" onclick="tagEverything()">⚡ সবকিছু এখনই ট্যাগ করো</button>
        <p class="hint" style="margin:6px 0 0;">নোট → MCQ → Written CQ → Mastery → Daily HW → নাম মেলানো, শেষে বাকির হিসাব।</p>
        <div id="tagEveryStatus" style="margin-top:8px;"></div>
        ${sec(`📝 নোট / স্লাইড ${pend.length ? `<span class="q-tag">${pend.length}টা বাকি</span>` : '<span class="q-tag">✅ সব ঠিক</span>'}`, pend.length > 0, `
          <button id="tagAllBtn" class="btn btn-primary btn-block" onclick="tagAllNotesUI()" ${pend.length ? '' : 'disabled'}>🤖 সবগুলো AI দিয়ে ট্যাগ করো</button>
          <div id="tagAllStatus" style="margin:8px 0;"></div>
          ${pend.map(n => row(n, true)).join('')}
          ${all.length ? `<details style="margin-top:10px;"><summary style="cursor:pointer; font-weight:600; font-size:13px;">সব নোট (${all.length}টা) — ট্যাগ বদলাও</summary>${all.map(n => row(n, false)).join('')}</details>` : ''}`)}
        ${sec('📋 প্রশ্ন · Daily HW', false, `
          <div class="row">
            <button class="btn btn-outline btn-block" id="tagNowBtn" onclick="tagNowUI()">🏷️ বাকি সব ট্যাগ করো</button>
            <button class="btn btn-outline btn-block" id="unifyTagBtn" onclick="unifyTagsUI()">🔗 টপিক এক নামে মেলাও</button>
          </div>
          <div id="tagNowStatus" style="margin-top:8px;"></div><div id="unifyTagStatus" style="margin-top:8px;"></div>
          <p class="hint" style="margin-top:6px;">এগুলো প্রতি ১০ মিনিটে অটো ট্যাগ হয় (ট্রিগার চালু থাকলে)।</p>`)}
        ${sec('🔁 রিভিশনের প্রশ্ন', false, `
          <button id="revTagBtn" class="btn btn-primary btn-block" onclick="revTTag()">🤖 প্রশ্নের বিষয় ট্যাগ করো</button>
          <div id="revTagSt" style="margin-top:8px;"></div>`)}
        ${sec('🎯 Exam Leak', false, `
          <button class="btn btn-gold btn-block" onclick="go('tLeakPrep')">⚙️ MCQ/CQ ট্যাগ ও স্লাইডের CQ</button>`)}
      </div>
      ${creditFooter()}`;
  }

  // ---------- একটাই বাটনে সব ট্যাগ ----------
  let teBusy = false;
  window.tagEverything = async function(){
    if(teBusy) return; teBusy = true;
    const btn = document.getElementById('tagEveryBtn'), st = document.getElementById('tagEveryStatus');
    if(btn) btn.disabled = true;
    const say = h => { const el = document.getElementById('tagEveryStatus'); if(el) el.innerHTML = h; };
    const line = (ok, t) => `<div class="meta" style="color:${ok === true ? 'var(--green)' : ok === false ? 'var(--red)' : '#9B6A15'};">${t}</div>`;
    const log = [];
    const show = cur => say(log.join('') + (cur ? `<p class="hint">🤖 ${cur} — পেজ বন্ধ কোরো না</p>` : ''));
    let failed = false;
    try{
      // ১) নোট/স্লাইড
      let nDone = 0, nLeft = null, guard = 0, nStuck = false, nErr = false;
      while(guard++ < 60){
        show(`নোট ট্যাগ হচ্ছে... ${nDone}টা হয়েছে${nLeft !== null ? ', বাকি ' + nLeft + 'টা' : ''}`);
        const r = await postToScriptRaw('tagNotesBatch', { max:3 });
        if(!r || r.status !== 'success'){ nErr = true; break; }
        nDone += r.done; nLeft = r.remaining;
        if(r.remaining <= 0) break;
        if(r.done === 0){ nStuck = true; break; }
      }
      log.push(nErr ? line(false, '❌ নোট: সংযোগ সমস্যা') : nStuck ? line(null, `⚠️ নোট: ${nDone}টা হয়েছে, বাকি ${nLeft}টায় AI এখন পারছে না`) : line(true, `✅ নোট/স্লাইড: ${nDone}টা ট্যাগ হলো`));
      if(nErr) failed = true;

      // ২) প্রশ্ন/HW/Mastery/Written — একটাই সার্ভার-লুপ (note, exam, mcq, wq, hw সবই এর ভেতরে)
      let total = 0, left = null, unclass = 0, g2 = 0, pStuck = false, pErr = false;
      while(g2++ < 40){
        show(`প্রশ্ন ও HW ট্যাগ হচ্ছে... ${total}টা হয়েছে${left !== null ? ', বাকি ' + left + 'টা' : ''}`);
        const r = await postToScriptRaw('tagPendingNow', {});
        if(!r || r.status !== 'success'){ pErr = true; break; }
        total += r.tagged; left = r.remaining; if(typeof r.unclassified === 'number') unclass = r.unclassified;
        if(r.remaining <= 0) break;
        if((typeof r.progress === 'number' ? r.progress : r.tagged) === 0){ pStuck = true; break; }
      }
      log.push(pErr ? line(false, '❌ প্রশ্ন/HW: সংযোগ/সার্ভার সমস্যা (Apps Script নতুন version Deploy করা আছে তো?)')
        : pStuck ? line(null, `⚠️ প্রশ্ন/HW: ${total}টা হয়েছে, বাকি ${left}টায় AI এখন পারছে না (কোটা শেষ?) — পরে আবার চাপো`)
        : line(true, `✅ প্রশ্ন (MCQ, Written CQ, Mastery) ও Daily HW: ${total}টা ট্যাগ হলো`));
      if(pErr) failed = true;
      if(unclass > 0) log.push(line(null, `⚠️ ${unclass}টা আইটেম AI ধরতে পারেনি ("অশ্রেণিবদ্ধ") — আবার চাপলে নিজে থেকে আবার চেষ্টা হবে`));

      // ৩) টপিকের নাম মেলানো
      show('একই টপিকের নাম মেলানো হচ্ছে...');
      const u = await postToScriptRaw('unifyTagsNow', {});
      log.push(u && u.status === 'success' ? line(true, `✅ নাম মেলানো: ${u.changed || 0}টা বদলেছে (মোট ${u.total || 0}টার মধ্যে)`) : line(false, '❌ নাম মেলানো যায়নি'));

      // ৪) বাকি কিছু আছে কিনা — Exam Leak-এর হিসাব থেকে
      show('শেষ হিসাব মেলানো হচ্ছে...');
      const lp = await postToScriptRaw('leakPrepGet', { tkey:TEACHER_PASSWORD });
      if(lp && lp.status === 'success'){
        const rest = o => Math.max(0, (o.total || 0) - (o.tagged || 0));
        const bits = [];
        if(rest(lp.exam)) bits.push(`পরীক্ষার MCQ ${rest(lp.exam)}টা`);
        if(rest(lp.mastery)) bits.push(`Mastery MCQ ${rest(lp.mastery)}টা`);
        if(rest(lp.wq)) bits.push(`Written CQ ${rest(lp.wq)}টা`);
        if(lp.notes && lp.notes.untaggedNotes) bits.push(`স্লাইড-নোট ${lp.notes.untaggedNotes}টা`);
        if(lp.notes && lp.notes.noChapter) bits.push(`স্লাইড থেকে তোলা CQ ${lp.notes.noChapter}টার অধ্যায় নেই`);
        log.push(bits.length ? line(null, '📋 এখনো বাকি: ' + bits.join(' · ')) : line(true, '🎉 পরীক্ষা, Written, Mastery ও নোট — কিছুই ট্যাগ-ছাড়া নেই'));
      }
    }catch(e){
      log.push(line(false, '❌ মাঝপথে সমস্যা হয়েছে, আবার চাপো'));
    }
    say(log.join('') + '<p class="hint" style="margin-top:8px;">রিভিশন ও Exam Leak এই একই ট্যাগ-তালিকা থেকে প্রশ্ন নেয়, তাই এখানে ট্যাগ হলেই সব জায়গায় কাজ করবে।</p>');
    if(btn) btn.disabled = false;
    teBusy = false;
    if(failed) return;
    // নোটের তালিকা (বাকি সংখ্যা) নতুন করে আনো, কিন্তু রিপোর্ট ঢেকে ফেলো না
    try{ const all = await getAllNotes(); window.__notesAll = all; }catch(e){}
  };

  // ---------- এক নোটের AI ট্যাগ → ট্যাগ-এডিট পাতার ভেতরে ----------
  window.ntAi = async function(){
    const n = window.__noteTagCtx; if(!n) return;
    toast('AI ট্যাগ করছে...');
    const res = await postToScriptRaw('retagNote', { id:n.id });
    toast(res && res.status === 'success' && res.tagged ? '✅ ট্যাগ হয়েছে' : 'AI এখন ট্যাগ করতে পারেনি — নিজে ট্যাগ করো বা পরে চেষ্টা করো');
    go('notesManage');
  };

  // tagAllNotesUI শেষে 'notesManage'-এ পাঠায় — ট্যাগ সেন্টারে থাকলে ওখানেই রিফ্রেশ হোক
  const __g = go;
  go = function(screen, data){
    if(screen === 'notesManage' && state && state.screen === 'tagCenter'){ renderTagCenter(); return; }
    return __g(screen, data);
  };

  // render-এ নতুন স্ক্রিন যোগ
  const __r = render;
  render = function(){
    if(state.screen === 'tagCenter'){ renderTagCenter(); return; }
    return __r.apply(this, arguments);
  };

  // ---------- ছড়ানো ট্যাগ-বাটন লুকিয়ে এক জায়গায় দেখাও ----------
  function sweepTags(){
    const sc = state && state.screen;
    const fab = document.getElementById('tagFab');
    fab.style.display = (typeof currentTeacher !== 'undefined' && currentTeacher && sc !== 'tagCenter' && sc !== 'teacherGate') ? 'block' : 'none';
    if(sc === 'tagCenter') return;
    const swap = (el, html) => { if(el && !el.dataset.ub){ el.dataset.ub = '1'; el.innerHTML = html; } };
    const a = document.getElementById('tagAllBtn');   if(a) swap(a.closest('.card'), ptr('নোটের ট্যাগ', 'ট্যাগ বাকি থাকা নোট ও AI ট্যাগের সব বাটন এখন ট্যাগ সেন্টারে।'));
    const r = document.getElementById('revTagBtn');   if(r) swap(r.closest('.card'), ptr('প্রশ্নের বিষয় ট্যাগ', 'রিভিশনের প্রশ্ন ট্যাগ করার বাটন এখন ট্যাগ সেন্টারে।'));
    const t = document.getElementById('tagNowBtn');   if(t) swap(t.parentElement, ptr('প্রশ্ন / HW ট্যাগ', 'এখনই ট্যাগ করা ও টপিক মেলানোর বাটন এখন ট্যাগ সেন্টারে।'));
    document.querySelectorAll('#app button[onclick^="retagNoteUI"]').forEach(b => b.classList.add('ub-hide'));
    if(sc === 'notesTagEdit' && !document.getElementById('ntAiBtn')){
      const save = document.querySelector('#app button[onclick^="saveNoteTagEdit"]');
      if(save) save.insertAdjacentHTML('afterend', '<button id="ntAiBtn" class="btn btn-outline btn-block" style="margin-top:8px;" onclick="ntAi()">🤖 AI দিয়ে ট্যাগ করো</button>');
    }
  }
  let q = 0;
  new MutationObserver(() => { if(q) return; q = requestAnimationFrame(() => { q = 0; sweepTags(); }); })
    .observe(document.getElementById('app'), { childList:true, subtree:true });
  sweepTags();
})();
</script>
